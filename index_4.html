世紀荷蘭萊頓大學藥酒\",\"Bombay英國10種草本，蒸餾3次\",\"Botanist艾雷島22＋9種，2010年\",\"Tanqueray英國1830，四植物四蒸餾\"],\"quiz\":[{\"q\":\"依教材，「VODKA」據說是由俄語哪個詞的發音而來？\",\"o\":[\"生命之水中的「水（VODA）」\",\"火之水（OGON）\",\"大地之乳（MOLOKO）\",\"北方之泉（SEVER）\"],\"a\":0,\"why\":\"教材伏特加介紹：VODKA 由俄語「生命之水」中的「水（VODA）」發音而來。\"},{\"q\":\"教材指出伏特加以連續蒸餾製成酒精度95%以上的烈酒後，再用蒸餾水淡化至多少？\",\"o\":[\"30%~38%\",\"40%~60%\",\"60%~80%\",\"20%~30%\"],\"a\":1,\"why\":\"教材原料及成酒過程：淡化至40%~60%。\"},{\"q\":\"教材稱哪一種伏特加俗稱「鑽石酒」？\",\"o\":[\"手工伏特加\",\"加味伏特加 Flavoured Vodka\",\"原味伏特加 Neutral Vodka\",\"野牛草伏特加\"],\"a\":2,\"why\":\"教材：原味伏特加「Neutral Vodka」俗稱鑽石酒，以活性碳過濾成為無色無味。\"},{\"q\":\"ABSOLUT 絕對伏特加創始於西元幾年？\",\"o\":[\"1923年\",\"1979年\",\"1862年\",\"1895年\"],\"a\":3,\"why\":\"教材品牌歷史：西元1895年創始於瑞典。\"},{\"q\":\"被稱為「伏特加酒之王」的人是誰？\",\"o\":[\"Lars Olsson Smith（拉爾斯·奧爾森·史密斯）\",\"Facundo Bacardi Masso\",\"Tito Beveridge\",\"John Paul DeJoria\"],\"a\":0,\"why\":\"教材 ABSOLUT 品牌歷史：被稱為「伏特加酒之王」的 Lars Olsson Smith。\"},{\"q\":\"Belvedere 雪樹伏特加的產區與原料，依教材為何？\",\"o\":[\"法國／小麥\",\"波蘭／100%黃金裸麥\",\"美國／非轉基因玉米\",\"瑞典／冬小麥\"],\"a\":1,\"why\":\"教材 Belvedere：產區波蘭，採用100%黃金裸麥（Mazovia 的 Dankowskie 黃金裸麥）。\"},{\"q\":\"灰雁伏特加經過幾次蒸餾？\",\"o\":[\"3次\",\"4次\",\"5次\",\"上百次\"],\"a\":2,\"why\":\"教材 Grey Goose 品牌特色第1點與品牌歷史皆載5次蒸餾。\"},{\"q\":\"Tito's 伏特加使用的原料是什麼？\",\"o\":[\"黃金裸麥\",\"冬小麥\",\"甜菜\",\"非轉基因玉米\"],\"a\":3,\"why\":\"教材：Tito 選用了非轉基因玉米，並使用傳統的銅製蒸餾器精釀伏特加。\"},{\"q\":\"蘭姆酒的起源地，依教材為下列哪一島？\",\"o\":[\"小安地列斯群島的巴貝多（Barbados）島\",\"牙買加\",\"馬丁尼克島\",\"古巴聖地牙哥\"],\"a\":0,\"why\":\"教材蘭姆酒介紹：十七世紀初葉英國人移民到小安地列斯群島的巴貝多島，利用甘蔗製造蒸餾酒。\"},{\"q\":\"依教材，厚重型蘭姆酒是用哪一種蒸餾機蒸餾？\",\"o\":[\"連續式蒸餾機\",\"單式蒸餾機\",\"羅夢式蒸餾器\",\"汽鍋頭式蒸餾器\"],\"a\":1,\"why\":\"教材：厚重型蘭姆酒是蜜糖經複雜發酵，用單式蒸餾機蒸餾後，再以木桶成熟。\"},{\"q\":\"BACARDI 百加地起源於哪一年、哪一地？\",\"o\":[\"1914年／日本\",\"1830年／英國\",\"1862年／古巴聖地牙哥\",\"1866年／美國田納西州\"],\"a\":2,\"why\":\"教材：起源自1862年，方坎多·百加地·馬索先生買下位於古巴聖地牙哥的釀酒廠。\"},{\"q\":\"依教材，BACARDI 的發酵時間為多久？\",\"o\":[\"3天\",\"6個月\",\"8至12小時\",\"30至35小時\"],\"a\":3,\"why\":\"教材製程第1點：在嚴格控制的狀態下置放發酵30至35小時。\"},{\"q\":\"依教材，只有在墨西哥哪一州栽培的 Maguey 最優良，且只有當地村莊生產者才能稱 Tequila？\",\"o\":[\"哈利司克州\",\"Jalicso 低地\",\"瓦哈卡州\",\"奇瓦瓦州\"],\"a\":0,\"why\":\"教材：只有在墨西哥中央高原北部的哈利司克州所栽培的 Maguey 最優良，出產地名叫特吉拉 Tequila。\"},{\"q\":\"依教材，可以冠上 Tequila 之名的原料植物是什麼？\",\"o\":[\"Maguey 以外的任何龍舌蘭\",\"藍色龍舌草（Blue Agave）\",\"調羹花屬（Dasylirion）沙漠植物\",\"仙人掌\"],\"a\":1,\"why\":\"教材：只有在某些特定地區、使用藍色龍舌草（Blue Agave）為原料者才有資格冠上 Tequila 之名。\"},{\"q\":\"PATRON 培恩由誰在哪一年創立？\",\"o\":[\"Aldo Bottega，1977年\",\"Jim McEwan，2010年\",\"John Paul DeJoria，1989年\",\"Facundo Bacardi Masso，1862年\"],\"a\":2,\"why\":\"教材品牌歷史：1989年由 John Paul DeJoria 創立，公司位於拉斯維加斯·內華達州。\"},{\"q\":\"Patron Reposado 依教材使用何種桶、存放多久？\",\"o\":[\"小橡木桶、至少12個月\",\"法國橡木桶、2年\",\"不鏽鋼桶、無年份\",\"小橡木桶、至少2個月\"],\"a\":3,\"why\":\"教材商品頁：Patron Reposado 年份2個月、小橡木桶，橡木桶存放至少2個月。\"},{\"q\":\"依教材，區分利口酒與烈酒「可能唯一可靠的方法」是什麼？\",\"o\":[\"利口酒會添加糖，而烈酒則不會\",\"利口酒酒精度一定低於20%\",\"利口酒必須陳年\",\"利口酒不可作為基酒\"],\"a\":0,\"why\":\"教材利口酒介紹：可能唯一可靠的區分方法就是，利口酒會添加糖，而烈酒則不會。\"},{\"q\":\"Baileys 奶酒由哪一公司於哪一年開始研製？\",\"o\":[\"Distilleria Bottega，1977年\",\"愛爾蘭 Gilbeys，1971年\",\"愛爾蘭 Gilbeys，1974年\",\"帝亞吉歐，1959年\"],\"a\":1,\"why\":\"教材：子公司愛爾蘭 Gilbeys 於1971年開始研製，1974年在都柏林生產上市。\"},{\"q\":\"Bottega Limone Natura 的檸檬皮在 Grappa 基酒中浸泡多久？\",\"o\":[\"約7天\",\"約15天\",\"約30天\",\"約3年\"],\"a\":2,\"why\":\"教材商品頁：將檸檬皮放入 Grappa 基酒中浸泡約30天，再分離過濾。\"},{\"q\":\"山崎蒸餾廠依教材誕生於哪一年，創辦人是誰？\",\"o\":[\"1914年／鳥井信治郎\",\"1923年／木內儀兵衛\",\"1953年／鳥井信治郎\",\"1923年／鳥井信治郎\"],\"a\":3,\"why\":\"教材：1923年山崎蒸餾廠誕生，創辦人鳥井信治郎，是日本第一座威士忌蒸餾廠。\"},{\"q\":\"CHOYA 蝶矢梅酒創立於哪一年？\",\"o\":[\"1914年\",\"1924年\",\"1959年\",\"1823年\"],\"a\":0,\"why\":\"教材：CHOYA 是全球銷售第一的日本梅酒品牌，創立於1914年。\"},{\"q\":\"CHOYA French Oak 的熟成方式，依教材為何？\",\"o\":[\"靜置熟成2-3年\",\"3年熟成後再於法國橡木桶陳釀2年，共5年\",\"5年熟成後再於法國橡木桶陳釀3年\",\"直接於法國橡木桶熟成5年\"],\"a\":1,\"why\":\"教材商品頁：3年熟成梅酒原液放入法國橡木酒桶再沉睡2年，歷時五年的陳醇。\"},{\"q\":\"木內酒造創立於哪一年，由誰創立？\",\"o\":[\"1823年／鳥井信治郎\",\"1914年／木內儀兵衛\",\"1823年／木內儀兵衛\",\"1866年／木內儀兵衛\"],\"a\":2,\"why\":\"教材：木內酒造創立於1823年，源自日本茨城縣，由木內儀兵衛創立。\"},{\"q\":\"依教材，田納西威士忌與波本威士忌最大的不同處是什麼？\",\"o\":[\"使用二手雪莉桶陳年\",\"以裸麥為主原料\",\"酒精度須達50%以上\",\"使用全新橡木桶，經過糖楓木炭過濾\"],\"a\":3,\"why\":\"教材 Jack Daniel's 品牌特色第1點即此說明。\"},{\"q\":\"玉山高粱依教材創始於哪一年、由哪個酒廠團隊研發？\",\"o\":[\"1953年／嘉義酒廠\",\"1953年／南投酒廠\",\"1949年／嘉義酒廠\",\"1966年／南投酒廠\"],\"a\":0,\"why\":\"教材台灣菸酒公司：玉山高粱創始於1953年，由嘉義酒廠釀酒團隊研發。\"},{\"q\":\"玉山樽藏梅酒依教材使用什麼桶熟陳、酒精度為多少？\",\"o\":[\"法國橡木桶／17%\",\"OMAR 原桶強度的波本桶（梅子酒桶）／20%\",\"美國白橡木桶／20%\",\"不鏽鋼桶／14.5%\"],\"a\":1,\"why\":\"教材商品頁：裝入 OMAR 原桶強度的波本桶（梅子酒桶）長時間熟陳，酒精度20%，南投酒廠生產。\"},{\"q\":\"霧峰農會釀酒嚴選的米為下列哪一種？\",\"o\":[\"山田錦\",\"台農67號\",\"台農71號益全香米\",\"台梗9號\"],\"a\":2,\"why\":\"教材霧峰農會品牌特色：嚴選霧峰在地栽種的「台農71號」益全香米釀造。\"},{\"q\":\"琴酒最初是由哪一位教授、為何目的所調製？\",\"o\":[\"英國牛津大學教授，為海軍防腐\",\"蘇格蘭愛丁堡大學教授，為製造香水\",\"瑞典藥劑師，為解酒\",\"荷蘭萊頓大學 Franciscus Srlvius 教授，為保護荷蘭人免於感染熱帶疾病\"],\"a\":3,\"why\":\"教材琴酒介紹：由荷蘭 Leiden（萊頓）大學 Franciscus Srlvius（席爾華斯）教授調製，作為解熱劑有利尿解熱效用。\"},{\"q\":\"Bombay Sapphire 使用幾種草本植物調味、蒸餾幾次？\",\"o\":[\"10種、3次\",\"11種、3次\",\"10種、4次\",\"22種、5次\"],\"a\":0,\"why\":\"教材 BOMBAY：獨家使用10種草本植物混合調味，使用蒸氣融合法將天然穀物烈酒蒸餾3次。\"},{\"q\":\"依教材，Bombay Sapphire 獨家使用的蒸餾器名稱及全球數量為何？\",\"o\":[\"壺式蒸餾器，全球四種\",\"汽鍋頭式蒸餾器（Carterhead），全球僅四套\",\"羅夢式蒸餾器（Lomond Still），全球唯一\",\"班內特銅壺蒸餾器，全球僅兩套\"],\"a\":1,\"why\":\"教材 BOMBAY：使用獨特研發設計的汽鍋頭式蒸餾器（Carterhead，全球僅四套，Bombay Sapphire 獨家使用）。\"},{\"q\":\"Botanist 植物學家琴酒使用的植物組合依教材為何？\",\"o\":[\"10種草本植物\",\"11種獨特優質原料\",\"艾雷島22種在地植物＋9種經典琴酒草本原料\",\"6種日本植物＋8種經典琴酒材料\"],\"a\":2,\"why\":\"教材 Botanist：手工採集艾雷島上的22種在地植物，加上9種經典琴酒草本原料。\"},{\"q\":\"ROKU 六使用的6種日本植物，依教材品牌介紹為何？\",\"o\":[\"櫻花、梅子、煎茶、抹茶、柚子皮、山椒\",\"小黃瓜、玫瑰花瓣、杜松子、芫荽、甘草、歐白芷\",\"杜松子、肉桂、當歸、桔子皮、檸檬皮、葛縷子\",\"櫻花、櫻花葉、日本柚子皮、煎茶、玉露、日本山椒\"],\"a\":3,\"why\":\"教材 ROKU：使用櫻花、櫻花葉、日本柚子皮、煎茶、玉露、日本山椒6種經典日本植物。\"},{\"q\":\"Hendrick's 亨利爵士琴酒創立於哪一年，由哪個集團推出？\",\"o\":[\"1999年／格蘭父子集團\",\"2010年／格蘭父子集團\",\"1830年／帝亞吉歐集團\",\"1999年／三得利集團\"],\"a\":0,\"why\":\"教材：亨利爵士琴酒創立於1999年，是由格蘭父子集團推出的小批次琴酒品牌。\"},{\"q\":\"Tanqueray 坦奎瑞創立於哪一年，屬於哪一類型琴酒？\",\"o\":[\"1999年／小批次琴酒\",\"1830年／倫敦乾琴酒（London Dry Gin）\",\"1830年／艾雷島干琴酒\",\"1899年／倫敦乾琴酒\"],\"a\":1,\"why\":\"教材：Tanqueray 是全球頂級的倫敦乾琴酒（London Dry Gin）品牌，創立於1830年。\"},{\"q\":\"Tanqueray 原版配方堅持只使用哪四種核心植物？\",\"o\":[\"杜松子、肉桂、當歸、檸檬皮\",\"櫻花、煎茶、玉露、山椒\",\"杜松子、芫荽、歐白芷根、甘草\",\"杜松子、小黃瓜、玫瑰花瓣、胡萎\"],\"a\":2,\"why\":\"教材：自1830年創立以來，原版配方始終堅持只使用四種核心植物：杜松子、芫荽、歐白芷根、甘草。\"}]},\"清酒\":{\"subject\":\"清酒\",\"sections\":[{\"h\":\"八海山 Hakkaisan — 品牌概要\",\"notes\":[\"品牌英文名稱 Hakkaisan；中文名稱 八海山；產區 日本。\",\"酒造全名：八海山酒造株式會社，位於新潟縣南魚沼市。\",\"成立於 1818 年，是日本最具代表性的清酒品牌之一。\",\"品牌名來自當地著名山脈「八海山」。\",\"品牌特色五點：優質原料（新潟縣南魚沼天然水源與高質量酒米）、精湛技藝（傳統工藝結合現代科技）、口感清新（清爽乾淨）、創新與傳承並行、國際化與地方化。\",\"酒米：主要使用「山田錦」這類優質酒米，粒大、黏性強，能更好吸收水份以提高釀酒效果。\",\"水源：來自南魚沼的天然水，水質清澈、礦物質含量低，尤其適合釀酒。\",\"八海山清酒酒精度一般在 15% 左右，具有一定的果香和米香。\",\"風味清爽，帶水果香氣與輕微米香，口感乾淨不油膩，適合搭配壽司、刺身等日本料理。\",\"釀酒技術：傳統技藝結合現代化設備，嚴格溫度控制與精確發酵；並重視環境保護、持續發展與節能措施。\",\"國際聲譽：多次獲國際獎項，在歐美、亞洲等地區均有消費群體。\"],\"table\":{\"head\":[\"八海山常見酒款\",\"教材說明\"],\"rows\":[[\"八海山本醸造 Hakkaisan Honjozo\",\"口感乾淨、較為清爽，適合日常飲用\"],[\"八海山吟釀 Hakkaisan Ginjo\",\"使用精細的酒米，釀造過程注重控制溫度，具濃郁果香味\"],[\"八海山大吟釀 Hakkaisan Daiginjo\",\"八海山頂級酒款，米的精磨比例通常在 50% 以下，口感極其細膩\"],[\"八海山純米酒 Hakkaisan Junmai\",\"不添加酒精，使用 100% 純米釀造，味道更厚實、香氣濃郁\"]]}},{\"h\":\"八海山 — 品項規格（容量／酒精度／風格）\",\"notes\":[\"八海山純米大吟釀浩和藏仕：720ML、17%，使用山田錦 Yamada Nishiki 和其他優質酒米；不添加酒精，完全依靠天然酵母發酵。話術重點：精磨至 50% 以下，酒體柔滑、微妙果香與花香，回味悠長。\",\"八海山純米大吟釀雪室貯藏：17%（教材未填容量），是八海山結合傳統與創新的代表作之一；「雪室貯藏」意指利用天然雪室（利用冬季積雪的自然冷藏庫）進行低溫三年儲藏。\",\"八海山 AWA 氣泡酒：720ML、13%，氣泡秘訣是「瓶內二次發酵」，與多數注入 CO₂ 的日本氣泡酒（Sparkling Sake）不同，屬自然氣泡，氣泡細膩且持久；話術提到使用新潟雪融天然水、50% 精米步合的大吟釀等級釀造。\",\"八海山純米大吟釀：720ML、16%，使用三大知名酒米山田錦、美山錦及五百萬石，精輾而成精米步合 45% 的純米大吟釀。\",\"八海山純米大吟釀話術重點：以手工製作的米麴與八海山融雪「雷電樣清水」釀製；新鮮水梨與青蘋果香氣，微甘口與酸度均衡，適合餐中品飲。\",\"四款品項的年份與橡木桶欄位皆為「無」。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"精米步合／關鍵字\"],\"rows\":[[\"八海山純米大吟釀浩和藏仕\",\"720ML\",\"17％\",\"精磨至 50% 以下；山田錦；天然酵母發酵\"],[\"八海山純米大吟釀雪室貯藏\",\"（教材原文未填）\",\"17％\",\"天然雪室低溫三年儲藏\"],[\"八海山 AWA 氣泡酒\",\"720ML\",\"13％\",\"瓶內二次發酵；50% 精米步合大吟釀等級\"],[\"八海山純米大吟釀\",\"720ML\",\"16％\",\"精米步合 45%；山田錦、美山錦、五百萬石\"]]}},{\"h\":\"出羽櫻 Dewazakura — 品牌概要\",\"notes\":[\"品牌英文名稱 Dewazakura；中文名稱 出羽櫻；產區 日本。\",\"酒造名稱：出羽櫻酒造株式會社（Dewazakura Sake Brewery Co., Ltd.）。\",\"創立年份：1892 年（明治 25 年）。\",\"所在地：日本山形縣天童市。\",\"名稱由來：「出羽」為舊國名，「櫻」象徵日本美學與清酒精神。\",\"品牌特色：是日本清酒界最早推廣吟釀酒文化的酒造之一；堅持「小批量手工釀造」，強調人力監控每個釀造階段。\",\"自創業以來秉持「品質第一」與「手工釀造」的職人精神，以當地山形優質米、水、氣候資源為基礎。\",\"山形縣四季分明、寒冷氣候與優質水源，是釀造清酒的理想地。\",\"招牌「櫻花吟釀」自 1980 年問世以來引領吟釀風潮，多次榮獲國際金獎與評選冠軍。\",\"釀酒精神延伸至藝術領域，創立專屬美術館，體現「酒如藝術」的品牌靈魂。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"教材重點\"],\"rows\":[[\"出羽櫻一路純米大吟釀\",\"720ML\",\"15％\",\"「一路」象徵專心一意追求極致吟釀；100% 使用頂級兵庫縣產山田錦；精米 45%；榮獲 2008 年英國 IWC 冠軍清酒\"],[\"出羽櫻清酒禮盒 105\",\"300ML*5\",\"15％\",\"使用山形縣本地優質酒米與天然水源；內含出羽燦燦純米吟釀、一耕特別純米、雪女神純米大吟釀、櫻花吟釀、誠醸辛口五款\"],[\"出羽櫻大吟釀原酒\",\"720ML\",\"17％\",\"運用最先進冰溫儲存技術，於「負 5 度」的「清酒睡眠啤酒廠」陳釀；愛山米每年只能釀造出極少量的超限定酒\"]]}},{\"h\":\"出羽櫻 — 品項細節\",\"notes\":[\"出羽櫻一路純米大吟釀香氣以鳳梨、青蘋果、哈密瓜為主，滑順圓潤，尾韻甘甜悠長。\",\"出羽櫻清酒禮盒 105 的風格主軸：清新果香、爽口純淨、細膩平衡，展現日本東北地區的自然清冽與氣候特質。\",\"禮盒涵蓋從純米吟釀、大吟釀到辛口特別純米，適合一次品味出羽櫻的不同層次與風格。\",\"出羽櫻大吟釀原酒可享受從玻璃杯中升起的濃郁水果香氣與原酒般的濃郁鮮味。\",\"三款品項的年份與橡木桶欄位皆為「無」。\"]},{\"h\":\"獺祭 Dassai — 品牌概要\",\"notes\":[\"品牌英文名稱 Dassai；中文名稱 獺祭；產區 日本。\",\"由位於山口縣的旭酒造（Asahi Shuzo）製造。\",\"品牌特色：獺祭只製造「純米大吟釀」（不加釀造酒精、不混和低精米等級），並以此定位高品質高端市場；以「純米大吟釀 Only」為核心，並創新推出「獺祭」品牌。\",\"旭酒造創立於 1948 年山口縣岩國市周東町，前身是祖父於明治時期創辦的周東桜酒場，戰後由其父親恢復經營並改名為旭酒造。\",\"1970 年代經營大受打擊，1973 年石油危機後業績大幅衰退。\",\"1984 年櫻井博志接掌公司，當時銷售已縮減至原僅三分之一；他決定放棄普通酒與本釀造酒，改以「純米大吟釀 Only」為核心。\",\"命名由來：源自地名「獺越」，意指河獺排列魚貝彷彿祭典；「獺」是日本一種水獺，傳說牠會將捕到的魚排列在河邊像在獻祭，「祭」象徵對傳統、自然與工藝的敬意，合起來是「將工藝美學展示出來的儀式」。\",\"1980 年代初便開發純米大吟釀：從獺祭 45 → 39 → 23，其中 23（精米率 23%）為品牌標誌性標竿。\",\"使用山田錦酒米，進行極高比例精米。\",\"以超高精米技術、革新釀造理念與時尚形象，打破傳統清酒框架。\"],\"table\":{\"head\":[\"代表酒款\",\"精米步合\"],\"rows\":[[\"獺祭 45\",\"45%\"],[\"獺祭 39\",\"39%\"],[\"獺祭 23\",\"僅 23%\"],[\"獺祭 Beyond\",\"超越精米率概念，以味道為核心開發，極為稀有\"]]}},{\"h\":\"獺祭 — 品項規格表\",\"notes\":[\"所有獺祭品項的容量皆為 720ML，年份與橡木桶欄位皆為「無」。\",\"Dassai 23：精米率僅 23%，全球極少數可達此精細程度的純米大吟釀，無添加酒精，保留米的天然香與旨味；口感柔滑細緻、酸度柔和、尾韻乾淨俐落。\",\"Dassai 23 HAYATA：100% 山田錦、精米步合僅 23%；採用 Hayata 教授技術——低溫高速巴氏殺菌＋微氣泡 CO₂ 注入；話術指出以 Meiji 大學 Hayata 教授研發技術為根基，以 65°C 節能巴氏殺菌。\",\"Dassai 23 Shinsei：23%（採頂級山田錦）；由日本傳奇設計師山本寬齋設計，以「夏至時分的赤紅太陽」為靈感，瓶身採亮眼紅色；2022 年 Oriental Sake Awards 精品類純米大吟釀金賞。\",\"Dassai 39：旭酒造純米大吟釀系列中的中堅代表，精米步合達到 39%，堪稱性價比最高的高端清酒；香氣為梨子、白桃與蘋果，適合搭配精緻的海鮮料理。\",\"Dassai Beyond：獺祭磨之先驅，精米步合度和品質超乎一般水準；旭酒造花費 10 年時間，以超越「獺祭二割三分」為目標，是旭酒造所有商品中最高等級酒款；酒標由當地知名書法家山本一遊先生一枚一枚書寫。\",\"Dassai 23 centrifuge NEW：精米步合達到 23%，首創遠心分離系統，一分鐘 3000 次遠心分離回轉速，從醪中分離酒及酒粕，完全無加壓；旭酒造於 2000 年開始首次將遠心分離技術導入清酒業界。\",\"Dassai Mini Set：精米步合 23%、39%、45%，是送禮的最佳選擇。\",\"Dassai Blue Type 23：旭酒造 2023 年首開先例，在美國紐約創立酒藏並推出全新品牌「DASSAI BLUE」，有「青出於藍勝於藍」的涵意；選用日本和美國阿肯色州產山田錦及紐約哈德遜河谷的水源，山田錦精米 23%；2024 Sake Competition「海外出品酒部門」金賞。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"精米步合\",\"關鍵技術／榮譽\"],\"rows\":[[\"Dassai 23\",\"720ML\",\"16％\",\"23%\",\"無添加酒精，保留米的天然香與旨味\"],[\"Dassai 23 HAYATA\",\"720ML\",\"16％\",\"23%\",\"Hayata 教授技術：低溫高速巴氏殺菌（65°C）＋微氣泡 CO₂ 注入\"],[\"Dassai 23 Shinsei\",\"720ML\",\"16％\",\"23%\",\"山本寬齋設計紅瓶；2022 Oriental Sake Awards 金賞\"],[\"Dassai 39\",\"720ML\",\"16％\",\"39%\",\"性價比最高的高端清酒\"],[\"Dassai Beyond\",\"720ML\",\"16％\",\"超越一般水準（磨之先驅）\",\"費時 10 年；書法家山本一遊手寫酒標；最高等級酒款\"],[\"Dassai 23 centrifuge NEW\",\"720ML\",\"16％\",\"23%\",\"遠心分離系統，一分鐘 3000 次回轉；2000 年導入業界\"],[\"Dassai Mini Set\",\"720ML\",\"15％\",\"23%、39%、45%\",\"送禮最佳選擇\"],[\"Dassai Blue Type 23\",\"720ML\",\"14％\",\"23%\",\"2023 年紐約酒藏；阿肯色州山田錦＋哈德遜河谷水；2024 Sake Competition 海外出品酒部門金賞\"]]}},{\"h\":\"三品牌對照總表\",\"notes\":[\"三個品牌產區皆標示為「日本」。\",\"縣別記法：八海山＝新潟縣南魚沼市、出羽櫻＝山形縣天童市、獺祭＝山口縣（旭酒造創立於岩國市周東町）。\"],\"table\":{\"head\":[\"品牌\",\"酒造\",\"縣／所在地\",\"創立年\",\"代表精米步合\",\"品牌特色\"],\"rows\":[[\"八海山 Hakkaisan\",\"八海山酒造株式會社\",\"新潟縣南魚沼市\",\"1818 年\",\"大吟釀通常 50% 以下；純米大吟釀 45%\",\"南魚沼天然水＋優質酒米；傳統結合現代科技；口感清爽乾淨；創新與傳承並行；國際化與地方化\"],[\"出羽櫻 Dewazakura\",\"出羽櫻酒造株式會社\",\"山形縣天童市\",\"1892 年（明治 25 年）\",\"一路純米大吟釀 精米 45%\",\"日本清酒界最早推廣吟釀酒文化的酒造之一；堅持小批量手工釀造、人力監控每個釀造階段\"],[\"獺祭 Dassai\",\"旭酒造 Asahi Shuzo\",\"山口縣（岩國市周東町）\",\"1948 年\",\"45%／39%／23%\",\"只製造純米大吟釀，不加釀造酒精、不混和低精米等級；「純米大吟釀 Only」定位高端市場\"]]}},{\"h\":\"教材中的清酒分類觀念（特定名稱酒）\",\"notes\":[\"教材以八海山酒款說明分類層級：本醸造 → 吟釀 → 大吟釀，另有純米酒一類。\",\"本醸造（Honjozo）：口感乾淨、較清爽，適合日常飲用。\",\"吟釀（Ginjo）：使用精細的酒米，釀造過程注重控制溫度，具濃郁果香味。\",\"大吟釀（Daiginjo）：頂級酒款，米的精磨比例通常在 50% 以下，口感極其細膩。\",\"純米酒（Junmai）：不添加酒精，使用 100% 純米釀造，味道更厚實、香氣 ,\"o\":[\"注入 CO₂（Sparkling Sake）\",\"遠心分離\",\"瓶內二次發酵\",\"低溫巴氏殺菌\"],\"a\":2,\"why\":\"教材寫氣泡秘訣是「瓶內二次發酵」，與多數注入 CO₂ 的日本氣泡酒不同。\"},{\"q\":\"出羽櫻酒造的創立年份為？\",\"o\":[\"1818 年\",\"1948 年\",\"1980 年\",\"1892 年（明治 25 年）\"],\"a\":3,\"why\":\"教材列「創立年份：1892 年（明治 25 年）」。\"},{\"q\":\"出羽櫻名稱中的「出羽」其由來為？\",\"o\":[\"河川名\",\"舊國名\",\"酒米名\",\"創辦人姓氏\"],\"a\":1,\"why\":\"教材寫「『出羽』為舊國名，『櫻』象徵日本美學與清酒精神」。\"},{\"q\":\"出羽櫻的招牌「櫻花吟釀」自哪一年問世並引領吟釀風潮？\",\"o\":[\"1973 年\",\"1980 年\",\"1984 年\",\"2008 年\"],\"a\":1,\"why\":\"教材寫招牌「櫻花吟釀」自 1980 年問世以來引領吟釀風潮。\"},{\"q\":\"出羽櫻一路純米大吟釀 100% 使用哪裡產的山田錦？\",\"o\":[\"山形縣\",\"新潟縣\",\"美國阿肯色州\",\"兵庫縣\"],\"a\":3,\"why\":\"教材產品風格寫「100% 使用頂級兵庫縣產『山田錦』」。\"},{\"q\":\"出羽櫻大吟釀原酒是在幾度的「清酒睡眠啤酒廠」中陳釀？\",\"o\":[\"負 5 度\",\"負 10 度\",\"0 度\",\"5 度\"],\"a\":0,\"why\":\"教材話術寫「通過在『負 5 度』的『清酒睡眠啤酒廠』中陳釀」。\"},{\"q\":\"出羽櫻大吟釀原酒每年只能釀造出極少量超限定酒，所用的米是？\",\"o\":[\"五百萬石\",\"美山錦\",\"愛山米\",\"雪女神\"],\"a\":2,\"why\":\"教材話術寫「愛山米每年只能釀造出極少量的超限定酒」。\"},{\"q\":\"獺祭由哪一家酒造製造，位於哪一縣？\",\"o\":[\"旭酒造・山口縣\",\"旭酒造・新潟縣\",\"八海山酒造・山口縣\",\"出羽櫻酒造・山形縣\"],\"a\":0,\"why\":\"教材寫獺祭由位於山口縣的旭酒造（Asahi Shuzo）所製造。\"},{\"q\":\"旭酒造創立於西元哪一年？\",\"o\":[\"1818 年\",\"1892 年\",\"1948 年\",\"1973 年\"],\"a\":2,\"why\":\"教材寫「旭酒造創立於 1948 年山口縣岩國市周東町」。\"},{\"q\":\"「獺祭」的命名源自哪一個地名？\",\"o\":[\"周東町\",\"獺越\",\"岩國\",\"天童\"],\"a\":1,\"why\":\"教材寫獺祭的命名源自地名「獺越」，意指河獺排列魚貝彷彿祭典。\"},{\"q\":\"依教材，獺祭的品牌特色是只製造哪一類清酒？\",\"o\":[\"本釀造\",\"吟釀\",\"原酒\",\"純米大吟釀\"],\"a\":3,\"why\":\"教材寫獺祭只製造「純米大吟釀」（不加釀造酒精、不混和低精米等級）。\"},{\"q\":\"獺祭代表酒款的精米步合，由高到低的開發順序為？\",\"o\":[\"45 → 39 → 23\",\"23 → 39 → 45\",\"50 → 45 → 39\",\"39 → 45 → 23\"],\"a\":0,\"why\":\"教材寫「從 獺祭 45 → 39 → 23」，其中 23% 為品牌標誌性標竿。\"},{\"q\":\"Dassai 23 centrifuge 首創的遠心分離系統，每分鐘回轉速為多少？\",\"o\":[\"1000 次\",\"2000 次\",\"3000 次\",\"5000 次\"],\"a\":2,\"why\":\"教材寫「一分鐘 3000 次遠心分離回轉速，從醪中分離酒及酒粕」。\"},{\"q\":\"Dassai Blue Type 23 使用的米與水源為？\",\"o\":[\"兵庫縣山田錦與南魚沼天然水\",\"山形縣酒米與天童市天然水\",\"日本和美國阿肯色州產山田錦及紐約哈德遜河谷水源\",\"愛山米與雪融水\"],\"a\":2,\"why\":\"教材寫 DASSAI BLUE 選用日本和美國阿肯色州產山田錦及紐約哈德遜河谷的水源。\"},{\"q\":\"Dassai Beyond 的教材定位為？\",\"o\":[\"性價比最高的高端清酒\",\"旭酒造所有商品中最高等級酒款\",\"入門日常飲用款\",\"首創遠心分離的酒款\"],\"a\":1,\"why\":\"教材話術寫 Beyond 花 10 年超越「獺祭二割三分」，是旭酒造所有商品中最高等級酒款。\"},{\"q\":\"1984 年接掌旭酒造、決定放棄普通酒與本釀造酒的是誰？\",\"o\":[\"山本一遊\",\"山本寬齋\",\"櫻井博志\",\"Hayata 教授\"],\"a\":2,\"why\":\"教材寫 1984 年櫻井博志接掌公司，以「純米大吟釀 Only」為核心。\"},{\"q\":\"依教材，八海山純米酒（Junmai）的特徵是？\",\"o\":[\"添加釀造酒精使口感清爽\",\"精米步合 23%，極度純淨\",\"以雪室低溫三年儲藏\",\"不添加酒精、使用 100% 純米釀造，味道厚實香氣濃郁\"],\"a\":3,\"why\":\"教材常見酒款寫純米酒不添加酒精、使用 100% 純米釀造，味道更厚實、香氣濃郁。\"}]},\"白酒\":{\"subject\":\"白酒\",\"sections\":[{\"h\":\"白酒的定義與歷史\",\"notes\":[\"白酒是一種包含很多不同種類蒸餾酒的混合名詞，其原料可能是不同的穀物。\",\"和朝鮮半島的燒酒一樣，中國的蒸餾白酒可能是元朝時期由被蒙古人征服的中亞波斯地區傳入並普及開的。\",\"日本燒酒也是在同時期由朝鮮半島以及和中國關係密切的琉球傳入的。\",\"也有說法認為唐朝時已經有蒸餾酒。\",\"白酒品種繁多，但都是用糧食釀造的蒸餾酒，是世界七大蒸餾酒之一。\",\"白酒是北方及川貴地區的中國人在酒桌上最常喝的酒，也是在傳統節日送人的禮品。\"]},{\"h\":\"中國白酒的釀造原則與原料分工\",\"notes\":[\"中國白酒的釀造首先要製麴，即用熟糧食和菌種混合培養。\",\"製成麴後，再和糧食混合同時進行糖化和發酵製成糧食酒、再蒸餾。\",\"製麴時使用豆類、麥類等各種糧食。\"],\"table\":{\"head\":[\"用途／酒種\",\"所用原料\"],\"rows\":[[\"製麴\",\"豆類、麥類等各種糧食\"],[\"製酒發酵\",\"主要用高粱\"],[\"米香型白酒\",\"用大米\"],[\"包穀酒\",\"主要用包穀\"]]}},{\"h\":\"高粱酒概說\",\"notes\":[\"高梁酒為我國最具代表性的蒸餾酒，產地遍及我國大江南北，以東北產量最多。（教材原文）\",\"高梁酒又名高梁燒，氣味猛烈。（教材原文）\",\"台灣高梁酒之製造，創始於民國三十九年十一月於嘉義酒廠。\",\"目前除嘉義酒廠外，官田酒廠亦有生產。\"]},{\"h\":\"高粱酒原料\",\"notes\":[\"除主原料之高梁外，還有大麥、小麥、豌豆、小豆等。（教材原文）\",\"台灣高梁過去僅有澎湖之白高梁，及沿海鹿港、朴子等地種植的紅高梁。\",\"後來引進美國新品種有 25 種，但目前製酒所用的以 West land 之品種一種為主。\",\"豆類使用情形並無一定，可全用小麥替代。\"],\"table\":{\"head\":[\"原料\",\"教材說明\"],\"rows\":[[\"高梁\",\"台灣高梁；過去僅有澎湖白高梁及鹿港、朴子等地紅高梁；後引進美國新品種 25 種，現以 West land 一種為主\"],[\"大麥\",\"皮厚，粉碎後作麴，質鬆而菌類易於繁殖，為製麴之主要原料\"],[\"小麥\",\"在製麴上實為配合補充營養成分之功用，因其營養成分高，有利於菌類之繁殖生長\"],[\"豆類\",\"使用情形並無一定，可全用小麥替代\"]]}},{\"h\":\"製造方法一：酒麴製造\",\"notes\":[\"將小麥磨碎後，加水攪和，以達全量之 37-38% 為宜。\",\"裝入圓形麴模，用壓模機重壓成直徑 25cm、厚 9cm 之麴塊。\",\"麴塊中間有一直徑 1 吋之圓孔，每塊重約 5kg。\",\"送入麴室採開放式之自然接種培養約 27 天則可成熟。\",\"成熟麴塊列置於空氣流通之麴庫中，貯存備用。\",\"酒麴以全面灰色，帶有特有的黴臭，破碎面呈灰白色，暗色部份少者為良品。\"],\"table\":{\"head\":[\"項目\",\"規格\"],\"rows\":[[\"加水量\",\"達全量之 37-38%\"],[\"麴塊直徑\",\"25cm\"],[\"麴塊厚度\",\"9cm\"],[\"中間圓孔\",\"直徑 1 吋\"],[\"每塊重量\",\"約 5kg\"],[\"培養天數\",\"約 27 天（開放式自然接種）\"]]}},{\"h\":\"製造方法二：高粱飯之處理\",\"notes\":[\"清洗：高梁先經洗滌、浸泡，夏季 3-4 日、冬季 4-5 日，中間換水一次。\",\"蒸煮：可加壓蒸煮機或連續式蒸煮機，蒸煮壓力 1.5kg/cm2，約 1.5 小時，蒸煮效率高，高梁易於糊化。\",\"發酵時用麴量為高梁飯之 15-17%。\",\"操作係將粉碎後之高梁麴粉，以 6% 量拌和已煮熟且冷卻後之高梁，入發酵槽中。\",\"並予壓緊上覆塑膠布，盡量使之密封，1-2 日後翻醪 1 次，供給空氣，促進菌類之繁殖，再予密封。\",\"發酵時醪溫以 25-30℃ 為宜（在第 5-6 日間最高可達 40-43℃）。\",\"夏季 14-16 日、冬季 16-20 日發酵完成。\",\"取出酒醪入蒸餾鍋行第一次蒸餾。\",\"酒渣子再分別進行第二次加 6% 之麴粉拌和，同第一次之方法發酵 15 日。\",\"第三次拌麴，加麴粉 5% 也發酵 15 日即告完成。\",\"同一原料，皆須各經三次發酵、蒸餾作業。\"],\"table\":{\"head\":[\"發酵次序\",\"加麴粉比例\",\"發酵天數\"],\"rows\":[[\"第一次\",\"6%（用麴量為高梁飯之 15-17%）\",\"夏季 14-16 日、冬季 16-20 日\"],[\"第二次\",\"6%\",\"15 日\"],[\"第三次\",\"5%\",\"15 日\"]]}},{\"h\":\"製造方法三：蒸餾與分級\",\"notes\":[\"目前蒸餾與冷卻裝置，夕用機械操作。（教材原文）\",\"最先餾出之酒，含酒精度 65% 以上者為大麴酒。\",\"55-60% 以上者為高梁酒，應分別貯存。\",\"酒精度降至 10-55% 之同者為酒尾，另行收集。（教材原文）\",\"酒尾去漂浮雜物，再次蒸餾，即可得與高梁酒之品質相若。\"],\"table\":{\"head\":[\"餾出酒精度\",\"分類\"],\"rows\":[[\"65% 以上\",\"大麴酒\"],[\"55-60% 以上\",\"高梁酒\"],[\"降至 10-55%\",\"酒尾（另行收集，去漂浮雜物再次蒸餾）\"]]}},{\"h\":\"高粱酒的保存方式\",\"notes\":[\"通常蒸餾酒是沒有保存期限的，越沉越香、放越久越有價值，高梁就是蒸餾酒的一種，像威士忌也是蒸餾酒的一種。\",\"蒸餾酒的保存期限是「無限期」。\",\"因為蒸餾酒不含氨基酸、糖分等，再加上酒精的殺菌作用，微生物無法存活繁殖。\",\"除非是開瓶後放置不理，經過一段時間酒精揮發殆盡，才會產生變質現象。\"]},{\"h\":\"品味高粱酒：純飲\",\"notes\":[\"金門高梁酒特香、特純、特甘、特冽的原味由舌尖入喉，純飲的豪情才能品酌出道地的高梁酒大地風味。\",\"冰凍：儲放於冰凍庫中的高梁酒，由於具有不結凍的特質，故冰鎮後的高梁，減少了酒精的刺激，減緩嗆味，入喉更順口，酒香更清冽，炎夏飲用別有一番滋味。\",\"溫熱：高梁酒經稍加溫熱後再飲用，酒中如乙醛、甲醇等辛辣口味的成分較易揮發，故口味將較柔順，香氣將更濃郁。\"]},{\"h\":\"品味高粱酒：調味飲用法\",\"notes\":[\"加冰塊。\",\"加礦泉水（冰水）：最佳黃金比例為 1：1。\",\"加入礦泉水或冰水後，會產生混濁現象，酒精濃度降低，適合偏好低酒精濃度飲用者品嚐。\",\"其他：加熱水、加果汁、加香檳、加蜂蜜、加乳酸飲料、加乳酸飲料、加烏梅酒。（教材原文，乳酸飲料重複列出）\"]},{\"h\":\"金門酒廠品牌基本資料\",\"notes\":[\"品牌英文名稱：KINMEN KAOLIANG LIQUOR（KKL）。\",\"品牌中文名稱：金門酒廠。\",\"產區：台灣金門。\",\"品牌特色一：使用金門特產旱地高梁。\",\"品牌特色二：水質甘甜的寶月神泉。\",\"品牌特色三：承襲古法三高二低一翻的純糧固態發酵釀酒工藝。\"],\"table\":{\"head\":[\"項目\",\"內容\"],\"rows\":[[\"品牌英文名稱\",\"KINMEN KAOLIANG LIQUOR（KKL）\"],[\"品牌中文名稱\",\"金門酒廠\"],[\"產區\",\"台灣金門\"],[\"品牌特色\",\"1. 金門特產旱地高梁 2. 水質甘甜的寶月神泉 3. 古法三高二低一翻純糧固態發酵釀酒工藝\"]]}},{\"h\":\"金門酒廠品牌故事：四個階段\",\"notes\":[\"金門酒廠於 1952 年由金門防衛司令官胡璉上將創立，迄今已逾七十餘載。\",\"歷經「草創期」、「發展期」、「興盛期」、「轉型期」等四個階段。\",\"草創期：民國 41 年 9 月，金門酒廠前身「九龍江酒廠」成立於金門城南門外。\",\"民國 45 年福建省政府遷台後改名為「金門酒廠」。（教材原文）\",\"草創期利用金門特產旱地高梁，引進當地水質甘甜的寶月神泉，加上釀酒師父的專業經驗，釀造出風味獨特，香、醇、甘、冽的高梁酒。\",\"發展期：民國 66 年 12 月，金酒始納入國家公賣體系銷台；在此期間金酒首度出洋銷售國外，從此躍上國際舞台，聲名大噪。\",\"興盛期：民國 81 年金門解除戰地政務後，金門酒廠改隸屬於金門縣政府，實施「金酒在台一體流通制度」。\",\"興盛期而後銷台數量不在設限，於民國 82 年著手興建二廠－金寧廠，向機械化、生產自動化、行政管理電腦化邁進。\",\"民國 86 年 2 月金寧廠開始量產。\",\"轉型期：民國 87 年 2 月 16 日，金門酒廠正式改制為「金門酒廠實業股份有限公司」，邁向民營化與機關組織公司化之改組。\",\"轉型期配合菸酒專賣制度改變後的經營環境，期許能提高我國加入 WTO 後之競爭力。\",\"民國 89 年正式完成民營化。\",\"民國 93 年在廈門註冊全資子公司「金門酒廠(廈門)貿易有限公司」，積極拓展大陸市場。\"],\"table\":{\"head\":[\"階段\",\"關鍵時間與事件\"],\"rows\":[[\"草創期\",\"民國 41 年 9 月「九龍江酒廠」成立於金門城南門外；民國 45 年改名「金門酒廠」\"],[\"發展期\",\"民國 66 年 12 月納入國家公賣體系銷台，首度出洋銷售國外\"],[\"興盛期\",\"民國 81 年解除戰地政務、改隸金門縣政府、金酒在台一體流通制度；民國 82 年興建二廠金寧廠；民國 86 年 2 月金寧廠量產\"],[\"轉型期\",\"民國 87 年 2 月 16 日改制「金門酒廠實業股份有限公司」；民國 89 年完成民營化；民國 93 年廈門註冊子公司\"]]}},{\"h\":\"製程三大特色之一：得天獨厚製酒環境\",\"notes\":[\"金門位於中式白酒的黃金釀酒線（北緯 23~28 度）。\",\"金門四面臨海，屬於大陸與海洋氣候。\",\"當地環境天然，無大型工業污染。\",\"加上花岡片麻岩層層透濾的純淨水質、富含礦物質及微量元素。（教材原文）\",\"最適合培育制麴和發酵菌種。（教材原文）\"]},{\"h\":\"製程三大特色之二：製酒工藝（堅持古法釀造，自然不添加）\",\"notes\":[\"金門高粱酒的釀造工藝，主要分為「製麴」、「釀酒」、「窖藏」、「包裝」四個階段。\",\"製麴採用嚴格篩選的優質小麥為製麴原料。\",\"製麴流程：研磨→攪和→製麴塊→培麴→堆麴→磨麴，加入蒸煮後經冷卻的高粱飯中發酵。\",\"麴是一種含有麴菌的物質，能使澱粉轉化為葡萄糖，產生酵母菌用以製造酒精。\",\"酒麴的好壞，對高粱酒的風味、品質，具有舉足輕重的關鍵性地位。\",\"金門酒廠採自動化機械壓製成方型麴塊，中間打孔提高育麴優質率。\",\"育麴方式採自然落菌法：以地板麴培育高溫麴（約 60 度以上）、架子麴培育中溫麴（約 50 度以上）。\",\"釀酒以優質的高粱為釀酒原料，採用不打碎原料的整粒高粱的固態發酵法。\",\"釀酒步驟：浸泡→高壓蒸煮→冷卻→拌麴→發酵→蒸餾（第一道酒）→再拌麴→再發酵→再蒸餾（第二道酒）完成釀酒生產作業。\",\"純糧固態發酵釀酒工藝是藉由固態蒸餾提取原料的精華，以水蒸汽由固體中提取所需要的物質。\",\"意即酒麴＋原粒高粱＝高粱酒。\",\"高溫摘酒，有利低沸點物質揮發，酒損率高、但酒質優。\",\"窖藏：將蒸餾的第一、二道酒，調配酒度融合後，儲存在不鏽鋼桶或陶土製成的甕中陳放。\",\"陳放的作用，主要是要讓酒液更加安定，使酒質穩定。\",\"包裝：蒸餾後的高粱酒經過長期的窖藏熟陳後，須由經驗豐富的調酒師進行勾調後，方可進行品質鑑定。\",\"酒質達到出廠標準後，開始進行灌裝作業。\",\"包裝過程：洗瓶→灌裝→封蓋→檢視→貼標→裝箱。\",\"三高是指「高溫製麴」、「高壓蒸飯」、「高溫接酒」。\",\"二低是指「低溫入池」、「低溫發酵」。\",\"一翻則是指固態發酵過程中一種特殊的「翻糟工藝」。\"],\"table\":{\"head\":[\"階段\",\"重點\"],\"rows\":[[\"製麴\",\"優質小麥；研磨→攪和→製麴塊→培麴→堆麴→磨麴；自然落菌法；地板麴培育高溫麴（約 60 度以上）、架子麴培育中溫麴（約 50 度以上）\"],[\"釀酒\",\"整粒高粱固態發酵；浸泡→高壓蒸煮→冷卻→拌麴→發酵→蒸餾（第一道酒）→再拌麴→再發酵→再蒸餾（第二道酒）\"],[\"窖藏\",\"第一、二道酒調配酒度融合後，儲存於不鏽鋼桶或陶土甕中陳放，讓酒液更安定、酒質穩定\"],[\"包裝\",\"調酒師勾調→品質鑑定→洗瓶→灌裝→封蓋→檢視→貼標→裝箱\"]]}},{\"h\":\"三高二低一翻\",\"notes\":[\"三高：高溫製麴、高壓蒸飯、高溫接酒。\",\"二低：低溫入池、低溫發酵。\",\"一翻：固態發酵過程中一種特殊的「翻糟工藝」。\"],\"table\":{\"head\":[\"口訣\",\"內容\"],\"rows\":[[\"三高\",\"高溫製麴、高壓蒸飯、高溫接酒\"],[\"二低\",\"低溫入池、低溫發酵\"],[\"一翻\",\"翻糟工藝\"]]}},{\"h\":\"製程三大特色之三：坑道儲酒\",\"notes\":[\"坑道是金門戰地延伸的文化產物。\",\"坑道終年陰涼潮濕、溫濕適宜（溫度約 15-20 度、濕度約 85-90%）。\",\"花崗岩坑道溫、溼度起伏穩定，有助於儲酒加速酒品陳化。\",\"搭配陶罈儲酒，陶罈具有毛細管作用，有利於將新酒雜味自然揮發，排出低沸點雜質，促進酒酯化、氧化還原作用。\",\"陶土含有多種金屬氧化物，促熟作用快，酒損高，但有助酒質提高。\"]},{\"h\":\"補充說明：陳年標示法規\",\"notes\":[\"依酒類標示管理辦法第十二條第三項：酒類標示陳年者，應加註熟成年數。\",\"如以數種陳年之酒類調製而成者，應以最短之酒齡標示熟成年數。\",\"前開熟成年數之標示，須具有詳實紀錄及相關證明文件，備供查核。\"]},{\"h\":\"產品介紹：酒精度、容量與年份一覽\",\"notes\":[\"多數金酒產品的年份欄位為「僅標示罐裝年月日」，僅陳年酒款標示年份。\",\"58 度金門高粱酒 0.75L*2 瓶：容量 1.5L（07.5L*2，教材原文），酒精度 58％。\",\"58 度特級高粱酒俗稱白金龍，是深具金門酒廠標誌性風格的最大宗酒款之一，酒標以雙龍呈現。\",\"58 度建國百年國宴酒：容量 0.6L、1.2L，酒精度 58％；外交部於中華民國建國一百年的國慶宴會用酒，款待外國使節的代表酒款，免稅通路獨家販售。\",\"建國百年國宴酒外盒以中華民國國旗及總統府作為主視覺，酒標以燦爛煙花為設計。\",\"46 度寶月泉高粱酒：容量 0.6L，酒精度 46％；抗日儒將趙家驤將軍以詩句「為愛金門酒，來尋寶月泉」道盡對金酒的喜愛。\",\"寶月泉瓶身仿「寶月古泉」之八角造型，八音同「發」及「八卦」守護意念；話術帶點茴香，伴隨羅勒葉似的氣味。\",\"58 度 823 紀念酒：容量 0.5L，酒精度 58％；嚴選窖藏優質冬酒調和精製；以金門「八二三戰役勝利紀念碑」為概念，酒標是蔣故總統經國先生親臨前線的圖像，顯示追求『和平』的價值。\",\"53 度新二鍋頭瓷瓶 1L：容量 1L，酒精度 53％。\",\"二鍋頭是指古時釀造白酒採用天鍋蒸餾，當更換第二鍋冷卻水時，蒸餾出的白酒剛好是酒心，簡稱之為二鍋頭；這一區間酒質風味特殊，醇厚甘香，現今泛指酒質優良之高粱酒。\",\"新二鍋頭精選上等的糯紅高粱及小麥為原料，僅摘取每年冬季期間二次發酵、二次蒸餾後「截頭去尾」的酒心，運用特有的「以酒勾酒」勾兌工藝，盛裝於瓷瓶中，利用瓷土特有的催陳效果。\",\"56 度金酒典藏珍品 0.75L：酒精度 56％，年份 3 年；紋以赤紅金龍加上印金轉印於瓶身。\",\"56 度陳年高粱酒燙金版 0.6L：酒精度 56％，年份 5 年；外盒用燙金雙龍做為主視覺，禮盒設計搭配兩只小酒杯。（話術仍寫「窖藏三年淬煉而成」，教材原文）\",\"56 度 8 年陳年高粱 0.6L：酒精度 56％，年份 8 年；以「紫氣東來」、「紫雲龍」、「八年」為設計主軸，窖藏於恆溫恆濕坑道中至少 8 年以上之熟成。\",\"56 度 12 年陳年高粱酒：容量 0.6L，酒精度 56％，年份 12 年；以「平步青雲」、「青雲龍」、「十二年」為設計主軸，免稅通路獨家販售，窖藏至少 12 年以上。\",\"56 度 15 年陳年高粱酒 0.6L：酒精度 56％，年份 15 年；以「龍靈自可騰九天」、「騰雲雙龍」、「十五年」為設計主軸，瓶蓋以玫瑰金點綴；15 年陳高有著「溫文儒雅」的獨特性格。\",\"15 年陳高結合金門酒廠首席調酒師精心調配及具大陸「白酒國家評委」資格的品酒師進行感官鑒定與把關。\",\"56 度 22 年陳年高粱酒 0.6L：酒精度 56％，年份 22 年；設計主軸同為「龍靈自可騰九天」、「騰雲雙龍」，瓶蓋以金質元素點綴；22 年陳高有著「內斂沉穩」的獨特性格，窖藏至少 22 年以上。\",\"57.1 李洋 16 年紀念酒 1.6L：酒精度 57.1％，年份 16 年；以「鳳羽」、「16」為設計主軸，每一瓶都擁有獨一無二的專屬編號，以及李洋簽名小卡，附贈兩只水晶鬱金香杯，搭配專屬的 LED 燈座。\",\"李洋 16 年紀念酒特選儲陳 16 年窖藏老酒，醬陳香氣突出而優雅，馥郁著醃漬梅子、果乾等香氣，特別添加食用級純金箔。\",\"金酒時光窖藏 6.56B2 禮盒：容量 0.75L，酒精度 58.6％；嚴選 6 款風格獨具的酒液進行勾兌，陳年總和達 56 年，因此取名「6.56」；昇恆昌獨家販售。\",\"金酒時光窖藏 6.61B2 禮盒：容量 0.75L，酒精度 58.2％；嚴選 6 款風格獨具的酒液進行勾兌，陳年總和達 61 年，因此取名「6.61」；昇恆昌獨家販售。\",\"時光窖藏系列以「Time（時光）」、「台灣（Taiwan）」為設計主軸，採用磨砂玻璃瓶身，結合金門酒廠標誌性的雙龍水墨畫。\",\"龍騰九霄：酒精濃度 58.6%，容量 700ml；以金城老廠窖藏 30 年老酒做為酒體靈魂；清香純正、帶有醬香、果蜜香，尾韻以烏梅般的深層韻味收尾；昇恆昌免稅獨賣。\",\"釀酒大師：酒精濃度 58%，容量 700ml；以極高標準自金城、金寧兩廠精選十年以上熟成基酒；香氣飽滿豐富、帶有烏梅及熟瓜果香，最後以輕盈的醬陳香作為尾韻收尾；昇恆昌免稅獨賣。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"年份\",\"重點\"],\"rows\":[[\"58 度金門高粱酒 0.75L*2 瓶\",\"1.5L(07.5L*2)\",\"58％\",\"僅標示罐裝年月日\",\"俗稱白金龍，酒標雙龍，最大宗酒款之一\"],[\"58 度建國百年國宴酒 0.6L\",\"0.6L、1.2L\",\"58％\",\"僅標示罐裝年月日\",\"建國一百年國慶宴會用酒，免稅通路獨家販售\"],[\"46 度寶月泉高粱酒\",\"0.6L\",\"46％\",\"僅標示罐裝年月日\",\"趙家驤將軍詩句；八角瓶身仿寶月古泉\"],[\"58 度 823 紀念酒\",\"0.5L\",\"58％\",\"僅標示罐裝年月日\",\"嚴選窖藏優質冬酒；八二三戰役勝利紀念碑概念\"],[\"53 度新二鍋頭瓷瓶 1L\",\"1L\",\"53％\",\"僅標示罐裝年月日\",\"糯紅高粱及小麥；截頭去尾酒心；瓷瓶催陳\"],[\"56 度金酒典藏珍品 0.75L\",\"0.75L\",\"56％\",\"3 年\",\"赤紅金龍印金轉印；入門陳年酒款\"],[\"56 度陳年高粱酒燙金版 0.6L\",\"0.6L\",\"56％\",\"5 年\",\"燙金雙龍禮盒，搭配兩只小酒杯\"],[\"56 度 8 年陳年高粱 0.6L\",\"0.6L\",\"56％\",\"8 年\",\"紫氣東來、紫雲龍；坑道窖藏至少 8 年\"],[\"56 度 12 年陳年高粱酒\",\"0.6L\",\"56％\",\"12 年\",\"平步青雲、青雲龍；免稅通路獨家販售\"],[\"56 度 15 年陳年高粱酒 0.6L\",\"0.6L\",\"56％\",\"15 年\",\"溫文儒雅；瓶蓋玫瑰金點綴\"],[\"56 度 22 年陳年高粱酒 0.6L\",\"0.6L\",\"56％\",\"22 年\",\"內斂沉穩；瓶蓋金質元素點綴\"],[\"57.1 李洋 16 年紀念酒 1.6L\",\"1.6L\",\"57.1％\",\"16 年\",\"鳳羽、16；專屬編號、簽名小卡、食用級純金箔\"],[\"金酒時光窖藏 6.56B2 禮盒\",\"0.75L\",\"58.6％\",\"僅標示罐裝年月日\",\"6 款勾兌，陳年總和 56 年；昇恆昌獨家\"],[\"金酒時光窖藏 6.61B2 禮盒\",\"0.75L\",\"58.2％\",\"僅標示罐裝年月日\",\"6 款勾兌，陳年總和 61 年；昇恆昌獨家\"],[\"龍騰九霄\",\"700ml\",\"58.6%\",\"僅標示罐裝年月日\",\"金城老廠窖藏 30 年老酒為酒體靈魂；昇恆昌免稅獨賣\"],[\"釀酒大師\",\"700ml\",\"58%\",\"僅標示罐裝年月日\",\"金城、金寧兩廠十年以上熟成基酒；昇恆昌免稅獨賣\"]]}}],\"card\":[\"白酒皆糧食釀造蒸餾酒，世界七大蒸餾酒之一\",\"製麴用豆麥；發酵主用高粱；米香型用大米\",\"大麥為製麴主要原料；小麥補充營養成分\",\"台灣高粱酒創始民國39年11月嘉義酒廠\",\"官田酒廠亦有生產；品種以West land為主\",\"麴塊直徑25cm、厚9cm、重約5kg、培養27天\",\"小麥磨碎加水達全量37-38%，中有1吋圓孔\",\"蒸煮壓力1.5kg/cm2、約1.5小時\",\"用麴量為高粱飯15-17%；醪溫25-30℃\",\"三次發酵蒸餾；加麴6%、6%、5%\",\"65%以上大麴酒；55-60%以上高粱酒；酒尾\",\"蒸餾酒保存期限無限期，不含氨基酸糖分\",\"金酒1952年胡璉上將創立；前身九龍江酒廠\",\"民國45年改名金門酒廠；89年完成民營化\",\"黃金釀酒線北緯23~28度；寶月神泉\",\"四階段：製麴、釀酒、窖藏、包裝\",\"三高二低一翻；一翻為翻糟工藝\",\"坑道溫15-20度、濕85-90%；陶罈毛細管\"],\"quiz\":[{\"q\":\"依教材，白酒是世界幾大蒸餾酒之一？\",\"o\":[\"世界五大蒸餾酒\",\"世界六大蒸餾酒\",\"世界七大蒸餾酒\",\"世界八大蒸餾酒\"],\"a\":2,\"why\":\"教材歷史段：「都是用糧食釀造的蒸餾酒，是世界七大蒸餾酒之一」。\"},{\"q\":\"教材認為中國的蒸餾白酒可能是哪個時期由中亞波斯地區傳入並普及？\",\"o\":[\"元朝時期\",\"唐朝時期\",\"明朝時期\",\"清朝時期\"],\"a\":0,\"why\":\"教材寫「可能是元朝時期由被蒙古人征服的中亞波斯地區傳入並普及開的」；唐朝僅是「也有說法」已有蒸餾酒。\"},{\"q\":\"依教材，米香型白酒使用的原料是？\",\"o\":[\"高粱\",\"包穀\",\"小麥\",\"大米\"],\"a\":3,\"why\":\"教材寫「米香型白酒則用大米，包穀酒主要用包穀」，製酒發酵主要用高粱。\"},{\"q\":\"教材指出皮厚、粉碎後作麴質鬆而菌類易於繁殖，為製麴之主要原料者是？\",\"o\":[\"大麥\",\"小麥\",\"豌豆\",\"高粱\"],\"a\":0,\"why\":\"教材高粱酒原料第2項：「大麥皮厚，粉碎後作麴，質鬆而菌類易於繁殖，為製麴之主要原料」。\"},{\"q\":\"依教材，小麥在製麴上的功用是什麼？\",\"o\":[\"提供澱粉來源以提高出酒率\",\"配合補充營養成分，有利於菌類之繁殖生長\",\"增加麴塊硬度便於堆疊\",\"降低發酵溫度\"],\"a\":1,\"why\":\"教材第3項：「小麥實為配合補充營養成分之功用，因其營養成分高，有利於菌類之繁殖生長」。\"},{\"q\":\"台灣高粱酒之製造創始於何時、何地？\",\"o\":[\"民國三十九年十一月於官田酒廠\",\"民國四十一年九月於嘉義酒廠\",\"民國三十九年十一月於嘉義酒廠\",\"民國四十五年於金門酒廠\"],\"a\":2,\"why\":\"教材高粱酒段：「台灣高梁酒之製造，創始於民國三十九年十一月於嘉義酒廠」。\"},{\"q\":\"依教材，目前台灣除嘉義酒廠外，還有哪一酒廠生產高粱酒？\",\"o\":[\"金寧酒廠\",\"官田酒廠\",\"金城酒廠\",\"九龍江酒廠\"],\"a\":1,\"why\":\"教材寫「目前除嘉義酒廠外，官田酒廠亦有生產」。\"},{\"q\":\"教材提到引進美國高粱新品種共幾種，目前製酒所用以哪一品種為主？\",\"o\":[\"25 種，以 West land 一種為主\",\"15 種，以白高梁一種為主\",\"25 種，以紅高梁一種為主\",\"30 種，以旱地高梁為主\"],\"a\":0,\"why\":\"教材寫「後來引進美國新品種有 25 種，但目前製酒所用的以 West land 之品種一種為主」。\"},{\"q\":\"酒麴製造時，小麥磨碎後加水攪和應達全量之多少？\",\"o\":[\"15-17%\",\"25-30%\",\"37-38%\",\"55-60%\"],\"a\":2,\"why\":\"教材酒麴製造：「加水攪和，以達全量之 37-38%為宜」。\"},{\"q\":\"依教材，壓模成形的麴塊規格為何？\",\"o\":[\"直徑 9cm、厚 25cm、每塊約 5kg\",\"直徑 25cm、厚 9cm、每塊約 5kg\",\"直徑 25cm、厚 9cm、每塊約 15kg\",\"直徑 27cm、厚 6cm、每塊約 5kg\"],\"a\":1,\"why\":\"教材寫「重壓成直徑 25cm，厚 9cm，中間有一直徑 1 吋之圓孔，每塊重約 5kg 之麴塊」。\"},{\"q\":\"麴塊送入麴室採開放式之自然接種，培養約幾天可成熟？\",\"o\":[\"約 15 天\",\"約 20 天\",\"約 37 天\",\"約 27 天\"],\"a\":3,\"why\":\"教材寫「送入麴室採開放式之自然接種培養約 27 天則可成熟」。\"},{\"q\":\"依教材，高粱蒸煮的壓力與時間為？\",\"o\":[\"1.5kg/cm2，約 1.5 小時\",\"5kg/cm2，約 1 小時\",\"1.5kg/cm2，約 5 小時\",\"0.5kg/cm2，約 1.5 小時\"],\"a\":0,\"why\":\"教材蒸煮項：「蒸煮壓力 1.5kg/cm2，約 1.5 小時，蒸煮效率高，高梁易於糊化」。\"},{\"q\":\"發酵時的用麴量為高粱飯之多少？\",\"o\":[\"6-7%\",\"10-15%\",\"15-17%\",\"37-38%\"],\"a\":2,\"why\":\"教材發酵項：「發酵時用麴量為高梁飯之 15-17%」；6% 是拌和已煮熟冷卻高粱時的加入量。\"},{\"q\":\"依教材，發酵時醪溫以多少為宜，第 5-6 日間最高可達多少？\",\"o\":[\"15-20℃為宜，最高 30-33℃\",\"25-30℃為宜，最高 40-43℃\",\"40-43℃為宜，最高 50℃\",\"25-30℃為宜，最高 60℃以上\"],\"a\":1,\"why\":\"教材寫「發酵時醪溫以 25-30℃為宜。(在第 5-6 日間最高可達 40-43℃)」。\"},{\"q\":\"依教材，第三次拌麴所加的麴粉比例與發酵天數是？\",\"o\":[\"6%、15 日\",\"6%、20 日\",\"5%、27 日\",\"5%、15 日\"],\"a\":3,\"why\":\"教材寫第二次加 6% 麴粉發酵 15 日，「第三次拌麴，加麴粉 5%也發酵 15 日即告完成」。\"},{\"q\":\"蒸餾時最先餾出之酒，含酒精度 65% 以上者稱為？\",\"o\":[\"酒尾\",\"高梁酒\",\"大麴酒\",\"二鍋頭\"],\"a\":2,\"why\":\"教材蒸餾段：「最先餾出之酒，含酒精度 65%以上者為大麴酒」，55-60% 以上者為高梁酒。\"},{\"q\":\"高粱酒加礦泉水（冰水）飲用的最佳黃金比例為？\",\"o\":[\"2：1\",\"1：2\",\"1：3\",\"1：1\"],\"a\":3,\"why\":\"教材調味飲用法：「最佳黃金比例為 1：1」，加水後會產生混濁現象、酒精濃度降低。\"},{\"q\":\"金門酒廠是哪一年、由何人創立？\",\"o\":[\"1952 年由金門防衛司令官胡璉上將創立\",\"1956 年由福建省政府創立\",\"1952 年由趙家驤將軍創立\",\"1977 年由金門縣政府創立\"],\"a\":0,\"why\":\"教材品牌故事：「金門酒廠於 1952 年由金門防衛司令官胡璉上將創立」。\"},{\"q\":\"金門酒廠的前身名稱與成立時間、地點為？\",\"o\":[\"九龍江酒廠，民國 45 年成立於金寧\",\"金寧酒廠，民國 82 年成立\",\"九龍江酒廠，民國 41 年 9 月成立於金門城南門外\",\"寶月酒廠，民國 41 年成立於金門城南門外\"],\"a\":2,\"why\":\"教材草創期：「民國 41 年 9 月，金門酒廠前身「九龍江酒廠」成立於金門城南門外」，民國 45 年才改名金門酒廠。\"},{\"q\":\"依教材，金酒二廠「金寧廠」開始量產的時間是？\",\"o\":[\"民國 82 年\",\"民國 86 年 2 月\",\"民國 87 年 2 月 16 日\",\"民國 89 年\"],\"a\":1,\"why\":\"教材興盛期：民國 82 年著手興建二廠金寧廠，「於民國 86 年 2 月金寧廠開始量產」。\"},{\"q\":\"教材所稱中式白酒的「黃金釀酒線」位於？\",\"o\":[\"北緯 23~28 度\",\"北緯 15~20 度\",\"北緯 28~33 度\",\"北緯 20~25 度\"],\"a\":0,\"why\":\"教材製程特色一：「金門位於中式白酒的黃金釀酒線(北緯 23~28 度)」。\"},{\"q\":\"依教材，金門酒廠育麴採自然落菌法，地板麴與架子麴各培育什麼麴？\",\"o\":[\"地板麴培育中溫麴（約 50 度以上）、架子麴培育高溫麴（約 60 度以上）\",\"地板麴培育高溫麴（約 60 度以上）、架子麴培育中溫麴（約 50 度以上）\",\"地板麴培育低溫麴（約 30 度以上）、架子麴培育高溫麴（約 60 度以上）\",\"兩者皆培育高溫麴（約 60 度以上）\"],\"a\":1,\"why\":\"教材寫「以地板麴培育高溫麴(約 60 度以上)、架子麴培育中溫麴(約 50 度以上)」。\"},{\"q\":\"「三高二低一翻」中的「一翻」指的是？\",\"o\":[\"翻醪供氣\",\"翻瓶檢視\",\"翻糟工藝\",\"翻麴堆麴\"],\"a\":2,\"why\":\"教材：「一翻則是指固態發酵過程中一種特殊的「翻糟工藝」」；三高為高溫製麴、高壓蒸飯、高溫接酒。\"},{\"q\":\"金門坑道儲酒的溫、濕度條件約為？\",\"o\":[\"溫度約 25-30 度、濕度約 60-65%\",\"溫度約 15-20 度、濕度約 85-90%\",\"溫度約 15-20 度、濕度約 55-60%\",\"溫度約 50 度以上、濕度約 85-90%\"],\"a\":1,\"why\":\"教材坑道儲酒：「溫度約 15-20 度、濕度約 85-90%」，花崗岩坑道溫溼度起伏穩定。\"},{\"q\":\"依教材，「二鍋頭」一詞的由來是？\",\"o\":[\"第二次發酵後蒸餾所得之酒\",\"第二座蒸餾鍋所產之酒\",\"第二年窖藏後取出之酒\",\"古時採天鍋蒸餾，更換第二鍋冷卻水時蒸餾出的白酒剛好是酒心\"],\"a\":3,\"why\":\"教材 53 度新二鍋頭瓷瓶產品風格段之原文定義，現今泛指酒質優良之高粱酒。\"}]},\"香菸\":{\"subject\":\"香菸\",\"sections\":[{\"h\":\"香菸的起源\",\"notes\":[\"香菸是菸草製品的一種；製法是把菸草烤乾後切絲，再以紙捲製成圓桶形條狀。\",\"吸食時把其中一端點燃，然後在另一端用口吸出產生的菸霧。\",\"香菸最初在土耳其一帶流行，當地人喜歡把菸絲以報紙捲起來吸食。\",\"在克里米亞戰爭中，英國士兵從當時的鄂圖曼帝國士兵中學會了吸食方法，之後傳播到不同地方。\",\"菸草被用來做香菸產生於近代，大量生產出現在克里米亞戰爭；這次戰爭在某種程度上幫助了香菸的大量泛濫。\",\"在一戰和二戰間，各國的軍方將香菸大量分發給官兵。\",\"二十世紀後半期，香菸的危害開始被廣泛宣傳，在菸盒上也出現了吸菸有害的提示。\",\"影響菸品特性的因素包括菸葉的品種、收割方式、土壤、氣候和天氣，這些都會影響香菸的味道和香氣。\",\"同一株菸草作物可產生不同等級的菸葉，例如作物頂端的葉片比底部的葉片曝露在更多陽光下。\",\"菸葉等級通常根據生長的位置、厚度、香氣、顆粒、顏色及作物的品質和成熟度而定。\",\"菸葉顏色以淡黃色、橘色和赤褐色最為常見。\",\"不同等級的品質取決於菸葉可加工製造的能力及感官特性，產生從澀口至順喉、濃郁等不同味道。\",\"向菸農採購菸葉後便送往菸葉廠加工，分離葉片與葉梗，之後根據不同等級分類。\",\"為了讓最後成品呈現不同的味道，菸草必須經過「熟化」過程，約需時三個月至兩年之久。\"]},{\"h\":\"香菸如何製作（A. 菸葉加工程序）\",\"notes\":[\"將各地送往煙廠的不同種類菸葉，分門別類存放於倉庫，並根據不同品牌需求取出製作。\",\"整捆菸葉在循環式原料調和設備中使菸葉柔軟、殺蟲滅菌後，將葉尖與葉根切開。\",\"送入除梗機將較粗的葉脈硬梗去除。\",\"為了防止菸葉不變質腐敗（教材原文），需經過乾燥過程。\",\"乾燥後裝入專用木桶發酵貯藏兩年，成為製造香菸的原料。\"]},{\"h\":\"香菸如何製作（B. 香菸製作程序）\",\"notes\":[\"(1) 原料加工：將菸葉濕潤、加味料、儲存調和，再經切絲、乾燥、冷卻。\",\"(1) 原料加工：依配方比例定量添加膨脹菸絲、菸骨絲及香料等混合均勻後，即調和成捲菸用菸絲。\",\"(2) 捲菸程序：菸絲通過捲在捲菸機上呈帶狀延展的菸紙時逐漸被捲成圓形，同時置入濾嘴、黏著膠水，形成連續的長菸捲。\",\"(2) 捲菸程序：同時在菸紙上印上品牌名稱；機器出口處長菸捲被高速裁刀切成一定長度。\",\"(2) 捲菸程序：一分鐘可以生產 2500 支香菸，並自動剔除軟捲不實、菸紙破損品相不良的香菸。\",\"(3) 包裝程序：捲好的香菸送至包裝機，依產品不同支數規格分裝。\",\"(3) 包裝程序：先用鋁箔紙包裝，再依序裝入盒中，最後包上一層玻璃紙，最後分條分箱包裝產品。\",\"教材以 MEVIUS（日本煙草公司）的製造過程作為示範。\"],\"table\":{\"head\":[\"程序\",\"內容\"],\"rows\":[[\"(1) 原料加工\",\"菸葉濕潤→加味料→儲存調和→切絲→乾燥→冷卻→加膨脹菸絲、菸骨絲及香料調和成捲菸用菸絲\"],[\"(2) 捲菸程序\",\"菸絲捲入菸紙成圓形、置入濾嘴、黏膠水、印品牌名稱、高速裁刀裁切；一分鐘可生產 2500 支\"],[\"(3) 包裝程序\",\"依支數規格分裝→鋁箔紙→裝盒→包玻璃紙→分條分箱\"]]}},{\"h\":\"香菸的結構（四層）\",\"notes\":[\"1. 95％醋酸纖維素或棉花的濾嘴。\",\"2. 包裏濾嘴的水松紙。\",\"3. 包裏菸草的捲菸紙（菸柱）。\",\"4. 菸草混合物。\",\"濾嘴、捲菸紙及濾嘴通風程度會影響香菸的濃淡和菸量。\"],\"table\":{\"head\":[\"順序\",\"結構\"],\"rows\":[[\"1\",\"95％醋酸纖維素或棉花的濾嘴\"],[\"2\",\"包裏濾嘴的水松紙\"],[\"3\",\"包裏菸草的捲菸紙（菸柱）\"],[\"4\",\"菸草混合物\"]]}},{\"h\":\"菸草種類與產區\",\"notes\":[\"菸葉的分布區域是最重要的因素，影響香菸的品質及味道。\",\"香菸的煙草是茄科一年生長之草本植物。\",\"菸草大約有 70 多種，但真正製作香菸的主要菸草為三種：維吉尼亞菸草、伯萊菸草、東方種菸草。\",\"維吉尼亞菸草亦稱火管烤製菸草，乃是根據美國最早種植的州命名。\",\"維吉尼亞菸草烤製時會出現黃色至橘色的顏色，故也稱為「淡色菸草」(bright tobacco)。\",\"維吉尼亞配方 (Virginia blend) 僅使用火管法烤製的維吉尼亞菸草。\",\"柏萊菸草顏色比維吉尼亞菸草顏色為淺，也比維吉尼亞菸草需要更豐腴的土壤及更多的肥料。\",\"柏萊菸草經過風乾後，菸草顏色由綠色變成褐色，菸葉內幾乎不含任何糖份，味道幾近雪茄。\",\"美式配方 (American blend) 除了維吉尼亞及東方種菸草之外，尚包括柏萊菸草。\",\"一般來說，利用氣乾法所烤製的菸草通常會添加糖蜜、甘草或其他香料。\",\"東方種菸草作物最小、耐力最強。\",\"東方種菸草貧瘠的生長條件加上高密度種植，帶來如傳統土耳其香菸的獨特香味，經日曬烤製後更添風味。\",\"東方配方 (Oriental blend) 百分之百使用日曬烤製的菸草。\",\"品牌間最重要的相異處便是不同的製作訣竅－調配混合各式等級菸草以創造出獨特味道的方法。\"],\"table\":{\"head\":[\"菸草種類\",\"別稱／烤製法\",\"主要產區\",\"特色\"],\"rows\":[[\"1. 維吉尼亞菸草\",\"亦稱火管烤製菸草；烤製時呈黃色至橘色，又稱「淡色菸草」(bright tobacco)\",\"常見於亞熱帶雨量較少地區，如美國喬治亞州、佛羅里達州及加州、巴西南部和辛巴威\",\"根據美國最早種植的州命名；維吉尼亞配方僅使用火管法烤製的維吉尼亞菸草\"],[\"2. 柏萊菸草\",\"氣乾法（風乾）；氣乾法烤製的菸草通常會添加糖蜜、甘草或其他香料\",\"美國馬里蘭州和肯塔基州、非洲中部、馬拉威、烏干達和印尼（品質最好者）\",\"顏色比維吉尼亞菸草淺，需要更豐腴的土壤及更多肥料；風乾後由綠變褐，幾乎不含糖份，味道幾近雪茄；美式配方成分之一\"],[\"3. 東方種菸草\",\"日曬烤製\",\"巴爾幹半島、土耳其及中東等夏季氣候炎熱地區\",\"作物最小、耐力最強；具傳統土耳其香菸的獨特香味；東方配方 100% 使用日曬烤製菸草\"]]}},{\"h\":\"尼古丁與焦油\",\"notes\":[\"尼古丁並非香菸製作的添加物，是存在於各式菸草植物中的天然物質。\",\"尼古丁（Nicotine）又稱菸鹼，是一種存在於茄科植物（茄屬）中的生物鹼，也是菸草的重要成分。\",\"香菸燃燒過程中會產生焦油。\",\"當物質燃燒時，會產生微小粒子與氣體結合，這就是菸霧。\",\"香菸濾嘴可吸附某些微粒。\",\"吸菸時，包括微粒及氣體在內的菸霧會透過菸絲柱和濾嘴吸入；氣體可通過濾嘴，但某些微粒被吸附。\",\"這些微粒物質在萃取尼古丁及水份後便是焦油。\"]},{\"h\":\"品牌對照總表（國家／特色／系列）\",\"notes\":[\"本表為教材各品牌頁的「品牌英文名稱／中文名稱／品牌特色」彙整，是筆試最常考的對照範圍。\",\"教材中另有部分商品單獨標示產地，與品牌國別不同，須分開記（例：KENT 產地韓國、VOGUE 產地韓國、555 產地韓國、P&S 產地台灣苗栗、VIRGINIA 產地印尼）。\"],\"table\":{\"head\":[\"品牌（英文）\",\"中文名稱\",\"國家／產地\",\"品牌特色\",\"教材列出系列／品名\"],\"rows\":[[\"BOHEM\",\"寶亨\",\"韓國品牌\",\"一款含有雪茄菸葉的香菸，特殊配方的煙草和晶球，菸草中加入 20%~30% 來自古巴雪茄葉精心調和\" 「2007 年，長壽菸正式改名為英文名稱『GENTLE』」。\"},{\"q\":\"依教材，捲菸機一分鐘可以生產多少支香菸？\",\"o\":[\"250 支\",\"2500 支\",\"1000 支\",\"25000 支\"],\"a\":1,\"why\":\"教材香菸製作程序（2.捲菸程序）：「一分鐘可以生產 2500 支香菸」。\"},{\"q\":\"香菸的結構中，濾嘴是由什麼材質構成？\",\"o\":[\"95％醋酸纖維素或棉花\",\"水松紙\",\"捲菸紙\",\"鋁箔紙\"],\"a\":0,\"why\":\"教材「香菸的結構」第 1 項：「95％醋酸纖維素或棉花的濾嘴」。\"},{\"q\":\"真正製作香菸的三種主要菸草為何？\",\"o\":[\"維吉尼亞、柏萊、東方種菸草\",\"維吉尼亞、淡色、雪茄菸草\",\"東方種、土耳其、馬里蘭菸草\",\"柏萊、茄科、膨脹菸草\"],\"a\":0,\"why\":\"教材「菸葉的分布區域」：菸草約 70 多種，真正製作香菸的三種主要菸草為維吉尼亞菸草、伯萊菸草、東方種菸草。\"},{\"q\":\"依教材，菸葉乾燥後需裝入專用木桶發酵貯藏多久，才成為製造香菸的原料？\",\"o\":[\"兩年\",\"半年\",\"一年\",\"三個月\"],\"a\":0,\"why\":\"教材菸葉加工程序：「裝入專用木桶發酵貯藏兩年，成為製造香菸的原料」。\"},{\"q\":\"Ploom 採用的加熱技術名稱為何？\",\"o\":[\"Reloc 保鮮技術\",\"氣旋濾嘴技術\",\"HeatFlow™ 熱對流加熱技術\",\"火管烤製技術\"],\"a\":2,\"why\":\"教材 Ploom 品牌故事：「用 HeatFlow™ 熱對流加熱技術，讓菸草在受控的溫度下均勻加熱」。\"}]}};\n<\/script>\n<script>\nconst $=id=>document.getElementById(id);\nconst SUBJECTS=Object.keys(DATA);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst numify=s=>esc(s).replace(/\\d+(?:[.,．]\\d+)*\\s*(?:%|％|度|年|℃|°C|ml|ML|L|公升|公里|個月|次|瓶|克|mg)?/g,m=>'<span class=\"nm\">'+m+'</span>');\n\nlet ST={subs:new Set(SUBJECTS), n:20, scope:\"all\", mask:false};\ntry{const r=JSON.parse(localStorage.getItem(\"advq\")||\"{}\");\n  if(r.subs&&r.subs.length) ST.subs=new Set(r.subs.filter(x=>SUBJECTS.includes(x)));\n  if(r.n!==undefined) ST.n=r.n; if(r.mask) ST.mask=r.mask;}catch(e){}\nlet BOOK=[]; try{BOOK=JSON.parse(localStorage.getItem(\"advbook\")||\"[]\");}catch(e){}\nconst saveST=()=>{try{localStorage.setItem(\"advq\",JSON.stringify({subs:[...ST.subs],n:ST.n,mask:ST.mask}));}catch(e){}};\nconst saveBook=()=>{try{localStorage.setItem(\"advbook\",JSON.stringify(BOOK));}catch(e){}};\n\n/* ---------- 科目列 ---------- */\nfunction paintSubs(){\n  $(\"subs\").innerHTML=SUBJECTS.map(s=>\n    '<button class=\"sub\" data-s=\"'+s+'\" aria-pressed=\"'+ST.subs.has(s)+'\">'+s+\n    '<span class=\"n\">'+DATA[s].quiz.length+'</span></button>').join(\"\")+\n    '<button class=\"sub\" data-s=\"__all\" aria-pressed=\"false\" style=\"margin-left:6px\">全選／全不選</button>';\n  $(\"subs\").querySelectorAll(\".sub\").forEach(b=>b.onclick=()=>{\n    const s=b.dataset.s;\n    if(s===\"__all\"){ if(ST.subs.size===SUBJECTS.length) ST.subs.clear(); else SUBJECTS.forEach(x=>ST.subs.add(x)); }\n    else { if(ST.subs.has(s)) ST.subs.delete(s); else ST.subs.add(s); }\n    if(!ST.subs.size) ST.subs.add(s===\"__all\"?SUBJECTS[0]:s);\n    saveST(); paintSubs(); renderRead(); updWrongN();\n  });\n}\n\n/* ---------- 速讀 ---------- */\nfunction renderRead(){\n  let html=\"\", n=0;\n  SUBJECTS.filter(s=>ST.subs.has(s)).forEach(s=>{\n    const d=DATA[s];\n    html+='<div class=\"subhead\"><h2>'+esc(s)+'</h2><span class=\"meta\">'+d.sections.length+' 節 ‧ '+d.quiz.length+' 題</span></div>';\n    d.sections.forEach(sec=>{\n      n++;\n      html+='<section class=\"sec\"><h3>'+esc(sec.h)+'</h3>';\n      if(sec.notes&&sec.notes.length) html+='<ul>'+sec.notes.map(x=>'<li>'+numify(x)+'</li>').join(\"\")+'</ul>';\n      if(sec.table&&sec.table.head){\n        html+='<div class=\"tbox\"><table><thead><tr>'+sec.table.head.map(h=>'<th>'+esc(h)+'</th>').join(\"\")+\n          '</tr></thead><tbody>'+sec.table.rows.map(r=>'<tr>'+r.map(c=>'<td>'+numify(c)+'</td>').join(\"\")+'</tr>').join(\"\")+\n          '</tbody></table></div>';\n      }\n      html+='</section>';\n    });\n  });\n  $(\"readBody\").innerHTML=html;\n  $(\"readBody\").classList.toggle(\"masked\",ST.mask);\n  $(\"readCount\").textContent=\"共 \"+n+\" 節\";\n}\n$(\"btnMask\").onclick=()=>{ ST.mask=!ST.mask; saveST();\n  $(\"btnMask\").setAttribute(\"aria-pressed\",ST.mask);\n  $(\"readBody\").classList.toggle(\"masked\",ST.mask);\n  if(!ST.mask) $(\"readBody\").querySelectorAll(\".nm.show\").forEach(e=>e.classList.remove(\"show\"));\n};\n$(\"btnTop\").onclick=()=>window.scrollTo({top:0,behavior:\"smooth\"});\n$(\"readBody\").addEventListener(\"click\",e=>{\n  const nm=e.target.closest(\".nm\"); if(nm&&ST.mask) nm.classList.toggle(\"show\");\n});\n\n/* ---------- 模式 ---------- */\nfunction setMode(q){\n  $(\"mRead\").setAttribute(\"aria-pressed\",!q); $(\"mQuiz\").setAttribute(\"aria-pressed\",q);\n  $(\"pRead\").classList.toggle(\"hide\",q); $(\"pQuiz\").classList.toggle(\"hide\",!q);\n  window.scrollTo({top:0});\n}\n$(\"mRead\").onclick=()=>setMode(false);\n$(\"mQuiz\").onclick=()=>setMode(true);\n\n/* ---------- 題庫 ---------- */\nconst ALL=[];\nSUBJECTS.forEach(s=>DATA[s].quiz.forEach((q,i)=>ALL.push(Object.assign({id:s+\"#\"+i,sub:s},q))));\nconst shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);\nfunction updWrongN(){ $(\"wrongN\").textContent=\"(\"+BOOK.length+\")\"; $(\"rBook\").textContent=BOOK.length; }\n\n$(\"qSetup\").querySelectorAll(\"[data-n]\").forEach(b=>b.onclick=()=>{\n  ST.n=Number(b.dataset.n); saveST();\n  $(\"qSetup\").querySelectorAll(\"[data-n]\").forEach(x=>x.setAttribute(\"aria-pressed\",String(x===b)));\n});\n$(\"qSetup\").querySelectorAll(\"[data-sc]\").forEach(b=>b.onclick=()=>{\n  ST.scope=b.dataset.sc;\n  $(\"qSetup\").querySelectorAll(\"[data-sc]\").forEach(x=>x.setAttribute(\"aria-pressed\",String(x===b)));\n});\n$(\"btnClearWrong\").onclick=()=>{ BOOK=[]; saveBook(); updWrongN(); };\n\nlet RUN=null;\nfunction startRun(list){\n  if(!list.length){ alert(\"這個範圍沒有題目，先選科目或換範圍。\"); return; }\n  RUN={qs:list, i:0, ok:0, wrong:[]};\n  $(\"qSetup\").classList.add(\"hide\"); $(\"qRes\").classList.add(\"hide\"); $(\"qCard\").classList.remove(\"hide\");\n  showQ();\n}\n$(\"btnStart\").onclick=()=>{\n  let pool = ST.scope===\"wrong\"\n    ? ALL.filter(q=>BOOK.includes(q.id))\n    : ALL.filter(q=>ST.subs.has(q.sub));\n  pool=shuffle(pool);\n  startRun(ST.n?pool.slice(0,ST.n):pool);\n};\nfunction showQ(){\n  const q=RUN.qs[RUN.i];\n  $(\"qIdx\").textContent=(RUN.i+1)+\" / \"+RUN.qs.length;\n  $(\"qTag\").textContent=q.sub;\n  $(\"qScore\").textContent=\"答對 \"+RUN.ok;\n  $(\"qBar\").style.width=(RUN.i/RUN.qs.length*100)+\"%\";\n  $(\"qText\").textContent=q.q;\n  $(\"qWhy\").innerHTML=\"\"; $(\"qNextRow\").classList.add(\"hide\");\n  $(\"qOpts\").innerHTML=q.o.map((t,i)=>\n    '<button class=\"opt\" data-i=\"'+i+'\"><span class=\"k\">'+\"ABCD\"[i]+'</span><span>'+esc(t)+'</span></button>').join(\"\");\n  $(\"qOpts\").querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));\n}\nfunction answer(pick){\n  const q=RUN.qs[RUN.i], right=q.a;\n  $(\"qOpts\").querySelectorAll(\".opt\").forEach((b,i)=>{\n    b.disabled=true;\n    if(i===right) b.dataset.r=\"ok\"; else if(i===pick) b.dataset.r=\"no\";\n  });\n  const good=pick===right;\n  if(good){ RUN.ok++; const k=BOOK.indexOf(q.id); if(k>=0){BOOK.splice(k,1); saveBook(); updWrongN();} }\n  else{\n    RUN.wrong.push({q:q, pick:pick});\n    if(!BOOK.includes(q.id)){ BOOK.push(q.id); saveBook(); updWrongN(); }\n  }\n  $(\"qScore\").textContent=\"答對 \"+RUN.ok;\n  $(\"qWhy\").innerHTML='<div class=\"why\"><div class=\"verdict '+(good?\"ok\":\"no\")+'\">'+\n    (good?\"答對\":\"答錯　正解：\"+\"ABCD\"[right]+\" \"+esc(q.o[right]))+'</div>'+esc(q.why)+'</div>';\n  $(\"qNextRow\").classList.remove(\"hide\");\n  $(\"btnNext\").textContent = RUN.i>=RUN.qs.length-1 ? \"看結果\" : \"下一題\";\n  $(\"btnNext\").focus();\n}\n$(\"btnNext\").onclick=()=>{\n  RUN.i++;\n  if(RUN.i>=RUN.qs.length) finish(); else showQ();\n};\nfunction finish(){\n  const tot=RUN.qs.length, ok=RUN.ok, pct=Math.round(ok/tot*100);\n  $(\"qCard\").classList.add(\"hide\"); $(\"qRes\").classList.remove(\"hide\");\n  $(\"rPct\").textContent=pct+\"%\"; $(\"rOk\").textContent=ok; $(\"rNo\").textContent=tot-ok;\n  updWrongN();\n  $(\"rWord\").textContent = pct>=90?\"這個範圍可以放著了，去練還沒考過的科目。\"\n    : pct>=75?\"主幹沒問題，錯的多半是數字與品牌細節，照下面清單補。\"\n    : pct>=60?\"觀念有了但細節不牢，建議回速讀開『數字挖空』再掃一次這幾科。\"\n    : \"先別急著刷題，回速讀把這幾科讀完一輪再回來。\";\n  $(\"rList\").innerHTML = RUN.wrong.length\n    ? RUN.wrong.map(w=>'<div class=\"wrong\"><div class=\"wt\">'+esc(w.q.sub)+'</div>'+\n        '<div class=\"wq\">'+esc(w.q.q)+'</div>'+\n        '<div class=\"wa\">你選 <span class=\"nope\">'+esc(w.q.o[w.pick])+'</span>　正解 <span class=\"yes\">'+esc(w.q.o[w.q.a])+'</span></div>'+\n        '<div class=\"wa\">'+esc(w.q.why)+'</div></div>').join(\"\")\n    : '<div class=\"wrong\"><div class=\"wq\">全對，沒有錯題。</div></div>';\n  window.scrollTo({top:0,behavior:\"smooth\"});\n}\n$(\"btnAgain\").onclick=()=>{ $(\"qRes\").classList.add(\"hide\"); $(\"qSetup\").classList.remove(\"hide\"); };\n$(\"btnRetryWrong\").onclick=()=>{\n  const list=RUN.wrong.map(w=>w.q);\n  if(!list.length){ $(\"btnAgain\").click(); return; }\n  startRun(shuffle(list));\n};\n\n/* ---------- init ---------- */\npaintSubs(); renderRead(); updWrongN();\n$(\"btnMask\").setAttribute(\"aria-pressed\",ST.mask);\n$(\"qSetup\").querySelectorAll(\"[data-n]\").forEach(x=>x.setAttribute(\"aria-pressed\",String(Number(x.dataset.n)===ST.n)));\n<\/script>\n\n</body></html>\n", "cards.html": "<!doctype html><html lang=\"zh-Hant\"><head>\n<meta name=\"robots\" content=\"noindex,nofollow,noarchive\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>\n</head><body>\n<title>進階評鑑速記小卡</title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap\">\n<style>\n:root{--ink:#17120E;--line:#C9BBA6;--wine:#7E2B34;--gold:#8A6A25;--bg:#FBF7F1}\n*{box-sizing:border-box}\nbody{margin:0;background:#E9E2D6;font-family:\"Noto Sans TC\",\"PingFang TC\",sans-serif;color:var(--ink)}\n.sheet{display:flex;flex-wrap:wrap;gap:6mm;padding:8mm;justify-content:center}\n.card{width:110mm;height:78mm;background:var(--bg);border:.3mm solid var(--line);border-radius:2mm;\n  padding:3mm 3.5mm;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1mm 3mm rgba(0,0,0,.12)}\n.hd{display:flex;align-items:baseline;gap:2mm;border-bottom:.5mm solid var(--wine);padding-bottom:1mm;flex:0 0 auto}\n.hd .t{font-family:\"Noto Serif TC\",serif;font-weight:900;font-size:11pt;color:var(--wine);letter-spacing:.02em}\n.hd .n{margin-left:auto;font-size:6pt;color:var(--gold);letter-spacing:.1em}\n.body{flex:1 1 auto;margin:1.5mm 0 0;padding:0;list-style:none;column-count:2;column-gap:3.5mm;\n  column-rule:.2mm dotted var(--line);font-size:var(--fs);line-height:1.5;overflow:hidden}\n.body li{break-inside:avoid;margin-bottom:.9mm;padding-left:2.6mm;position:relative}\n.body li::before{content:\"\";position:absolute;left:0;top:.42em;width:1.2mm;height:1.2mm;border-radius:50%;background:var(--gold)}\n.ft{flex:0 0 auto;font-size:5pt;color:#9A8E7C;letter-spacing:.06em;border-top:.2mm dotted var(--line);padding-top:.8mm}\n@page{size:A4;margin:8mm}\n@media print{\n  body{background:#fff}\n  .sheet{padding:0;gap:4mm}\n  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid}\n}\n</style>\n<div class=\"sheet\"><div class=\"card\" id=\"c0\" style=\"--fs:8.4pt\">\n  <div class=\"hd\"><span class=\"t\">葡萄酒</span><span class=\"n\">進階評鑑 ‧ 1/7</span></div>\n  <ul class=\"body\" id=\"b0\"><li>紅酒紅色來自葡萄皮花青素</li><li>紅酒酒精一般 12%～15%</li><li>單寧來自葡萄皮、籽與橡木桶</li><li>酸度主要是酒石酸與蘋果酸</li><li>波爾多：Cab. Sauvignon＋Merlot</li><li>勃根地＝Pinot Noir</li><li>隆河谷＝Syrah、Grenache</li><li>托斯卡納＝Sangiovese</li><li>Rioja＝Tempranillo；阿根廷＝Malbec</li><li>Barossa Valley＝Shiraz</li><li>AOC＝法定產區最高分級</li><li>IGP／Vin de Pays＝地區酒</li><li>Vin de France＝無產區標示</li><li>儲存 12–16°C，避光避溫差</li><li>採收→去梗破皮→帶皮發酵→壓榨→陳年→裝瓶</li><li>Grange 1951 首創，Max Schubert</li><li>Bin 389＝小葛蘭許 BABY GRANGE</li><li>Wente 1883 創立，Chardonnay 之父</li></ul>\n  <div class=\"ft\">昇恒昌營業部訓練教材 115 年度 · 數字照教材原文</div>\n</div><div class=\"card\" id=\"c1\" style=\"--fs:7.6pt\">\n  <div class=\"hd\"><span class=\"t\">香檳氣泡酒</span><span class=\"n\">進階評鑑 ‧ 2/7</span></div>\n  <ul class=\"body\" id=\"b1\"><li>只有法國香檳區的氣泡酒可稱香檳</li><li>香檳區在巴黎東北約200公里、全法最北</li><li>香檳區土質為優良白堊土</li><li>三品種：夏多內、黑皮諾、皮諾莫尼耶</li><li>最高級香檳只取第一次壓榨純汁Cuvee</li><li>黑中白100%黑葡萄；白中白100%夏多內</li><li>甜度：Extra Brut極不甜、Brut不甜</li><li>Sec略甜、Demi-Sec微甜、Doux甜</li><li>氣泡來自裝瓶後第二次發酵（加糖與酵母）</li><li>轉瓶師一天約轉動5萬瓶以上</li><li>除渣：瓶口插入-30℃鹽水凝結後噴出</li><li>非年份香檳佔總產量比例最高、較親民</li><li>年份香檳瓶中陳年約4-5年以上才上市</li><li>適飲溫度：非年份7～10℃、年份10～12℃</li><li>冰桶冰鎮約20～30分鐘即達適飲溫度</li><li>細長型或鬱金香高腳杯最襯香檳</li><li>750ml氣泡酒約5～6個大氣壓</li><li>所有香檳都是氣泡酒，但反之不然</li></ul>\n  <div class=\"ft\">昇恒昌營業部訓練教材 115 年度 · 數字照教材原文</div>\n</div><div class=\"card\" id=\"c2\" style=\"--fs:8pt\">\n  <div class=\"hd\"><span class=\"t\">白蘭地</span><span class=\"n\">進階評鑑 ‧ 3/7</span></div>\n  <ul class=\"body\" id=\"b2\"><li>Brandy＝荷蘭文「可燃燒的酒」</li><li>未陳年白蘭地無色，40-43度</li><li>至少陳年2年，否則標「未成熟」</li><li>香氣三來源：原料、蒸餾、橡木桶</li><li>釀酒白葡萄：低糖、高酸、低香、抗病</li><li>基酒酒精濃度8–10% ABV</li><li>Ugni Blanc白玉霓占干邑90%以上</li><li>Baco Blanc為雅馬邑獨有品種</li><li>VS≥2年、VSOP≥4年、XO≥10年</li><li>XXO≥14年（2018新增）、Hors d'Âge超30年</li><li>干邑在夏朗德，雙次壺式蒸餾</li><li>雅馬邑在加斯科涅，單次連續蒸餾</li><li>Fine Champagne大香檳≥50%</li><li>六大產區首位：Grande Champagne</li><li>Borderies最小，馬爹利核心風格</li><li>軒尼詩1765、馬爹利1715、人頭馬1724</li><li>Hennessy XO：1870年世界第一瓶XO</li><li>1909年法令定雅馬邑三大產區</li></ul>\n  <div class=\"ft\">昇恒昌營業部訓練教材 115 年度 · 數字照教材原文</div>\n</div><div class=\"card\" id=\"c3\" style=\"--fs:8pt\">\n  <div class=\"hd\"><span class=\"t\">其他酒</span><span class=\"n\">進階評鑑 ‧ 4/7</span></div>\n  <ul class=\"body\" id=\"b3\"><li>伏特加源俄國12世紀，VODA生命之水</li><li>伏特加連續蒸餾95%，淡化40~60%</li><li>木炭過濾≧8小時，每加侖≧1.5磅炭</li><li>ABSOLUT瑞典1895，100%冬小麥</li><li>Belvedere波蘭，4次蒸餾，黃金裸麥</li><li>Grey Goose法國干邑，5次蒸餾小麥</li><li>Tito's美國，非轉基因玉米，1997</li><li>蘭姆源巴貝多島，字首Rum-bullion</li><li>清淡型用連續式；厚重型用單式</li><li>BACARDI古巴1862，蝙蝠，銷售第一</li><li>Tequila限哈利司克州藍色龍舌蘭</li><li>Mezcal範圍廣，Tequila為其中一種</li><li>PATRON墨西哥1989，DeJoria創立</li><li>利口酒加糖，烈酒不加糖</li><li>Baileys愛爾蘭1971研製1974上市</li><li>CHOYA日本1914，紀州南高梅</li><li>琴酒17世紀荷蘭萊頓大學藥酒</li><li>Bombay英國10種草本，蒸餾3次</li><li>Botanist艾雷島22＋9種，2010年</li><li>Tanqueray英國1830，四植物四蒸餾</li></ul>\n  <div class=\"ft\">昇恒昌營業部訓練教材 115 年度 · 數字照教材原文</div>\n</div><div class=\"card\" id=\"c4\" style=\"--fs:7.6pt\">\n  <div class=\"hd\"><span class=\"t\">清酒</span><span class=\"n\">進階評鑑 ‧ 5/7</span></div>\n  <ul class=\"body\" id=\"b4\"><li>八海山＝新潟縣南魚沼市，1818年創立</li><li>八海山酒精度一般15%，主用山田錦</li><li>大吟釀：米精磨比例通常50%以下</li><li>八海山純米大吟釀精米步合45%</li><li>八海山三酒米：山田錦、美山錦、五百萬石</li><li>八海山AWA氣泡酒13%，瓶內二次發酵</li><li>雪室貯藏＝天然雪室低溫三年儲藏，17%</li><li>出羽櫻＝山形縣天童市，1892年明治25年</li><li>出羽櫻最早推廣吟釀文化，小批量手工</li><li>櫻花吟釀1980年問世，引領吟釀風潮</li><li>出羽櫻一路：兵庫縣山田錦、精米45%</li><li>一路獲2008年英國IWC冠軍清酒，15%</li><li>出羽櫻大吟釀原酒17%，負5度、愛山米</li><li>獺祭＝山口縣旭酒造，1948年創立</li><li>獺祭只做純米大吟釀，不加釀造酒精</li><li>獺祭精米：45→39→23，Beyond最高等級</li><li>獺祭命名源自地名「獺越」</li><li>centrifuge：遠心分離每分3000轉，2000年導入</li></ul>\n  <div class=\"ft\">昇恒昌營業部訓練教材 115 年度 · 數字照教材原文</div>\n</div><div class=\"card\" id=\"c5\" style=\"--fs:7.2pt\">\n  <div class=\"hd\"><span class=\"t\">白酒</span><span class=\"n\">進階評鑑 ‧ 6/7</span></div>\n  <ul class=\"body\" id=\"b5\"><li>白酒皆糧食釀造蒸餾酒，世界七大蒸餾酒之一</li><li>製麴用豆麥；發酵主用高粱；米香型用大米</li><li>大麥為製麴主要原料；小麥補充營養成分</li><li>台灣高粱酒創始民國39年11月嘉義酒廠</li><li>官田酒廠亦有生產；品種以West land為主</li><li>麴塊直徑25cm、厚9cm、重約5kg、培養27天</li><li>小麥磨碎加水達全量37-38%，中有1吋圓孔</li><li>蒸煮壓力1.5kg/cm2、約1.5小時</li><li>用麴量為高粱飯15-17%；醪溫25-30℃</li><li>三次發酵蒸餾；加麴6%、6%、5%</li><li>65%以上大麴酒；55-60%以上高粱酒；酒尾</li><li>蒸餾酒保存期限無限期，不含氨基酸糖分</li><li>金酒1952年胡璉上將創立；前身九龍江酒廠</li><li>民國45年改名金門酒廠；89年完成民營化</li><li>黃金釀酒線北緯23~28度；寶月神泉</li><li>四階段：製麴、釀酒、窖藏、包裝</li><li>三高二低一翻；一翻為翻糟工藝</li><li>坑道溫15-20度、濕85-90%；陶罈毛細管</li></ul>\n  <div class=\"ft\">昇恒昌營業部訓練教材 115 年度 · 數字照教材原文</div>\n</div><div class=\"card\" id=\"c6\" style=\"--fs:8pt\">\n  <div class=\"hd\"><span class=\"t\">香菸</span><span class=\"n\">進階評鑑 ‧ 7/7</span></div>\n  <ul class=\"body\" id=\"b6\"><li>韓國：BOHEM寶亨、ESSE愛喜</li><li>日本：Caster、MI-NE峰、Mevius七星</li><li>美國：MARLBORO萬寶路、KENT1952推出</li><li>德國：Davidoff大衛杜夫、P&amp;S寶仕</li><li>英國：DUNHILL登喜路，完封包設計</li><li>BOHEM加20~30%古巴雪茄葉</li><li>Bohem No.6含30%雪茄葉</li><li>Caster獨特VanillaFlavor香草</li><li>KENT：世界第一支帶過濾嘴捲菸</li><li>MI-NE：唯一漢字日文品牌名進口菸</li><li>七星日本第1、世界第2</li><li>Winston1954問世，全球第二大</li><li>Winston台灣市佔第二、中價位第一</li><li>P&amp;S原為BOSS，產地台灣苗栗</li><li>VIRGINIA產地印尼；VOGUE極細菸</li><li>555原100%維吉尼亞菸草，烤菸型</li><li>555源自111到999數字系列</li><li>長壽1958出品、2007改名GENTLE</li><li>三大菸草：維吉尼亞、柏萊、東方種</li><li>捲菸機一分鐘可生產2500支香菸</li></ul>\n  <div class=\"ft\">昇恒昌營業部訓練教材 115 年度 · 數字照教材原文</div>\n</div></div>\n</body></html>\n"};
const stage=document.getElementById("stage");
const tabs=[...document.querySelectorAll(".tb")];
const frames={};
const KEY="hub-tab";

function openTab(btn){
  tabs.forEach(t=>t.setAttribute("aria-selected",String(t===btn)));
  const src=btn.dataset.src;
  document.getElementById("pop").href=src;
  Object.values(frames).forEach(f=>f.classList.add("hidden"));
  if(!frames[src]){
    const f=document.createElement("iframe");
    f.title=btn.textContent;
    if(window.PAGES && PAGES[src]) f.srcdoc=PAGES[src]; else f.src=src;
    f.setAttribute("loading","eager");
    stage.appendChild(f);
    frames[src]=f;
    let ok=false;
    f.addEventListener("load",()=>{ ok=true; });
    f.addEventListener("error",showFallback);
    setTimeout(()=>{ if(!ok) showFallback(); },8000);
  }
  frames[src].classList.remove("hidden");
  try{ localStorage.setItem(KEY,src); }catch(e){}
}
function showFallback(){
  document.getElementById("fallback").classList.add("on");
  Object.values(frames).forEach(f=>f.classList.add("hidden"));
}
tabs.forEach(t=>t.addEventListener("click",()=>openTab(t)));

let start=tabs[0];
try{ const s=localStorage.getItem(KEY); const m=tabs.find(t=>t.dataset.src===s); if(m) start=m; }catch(e){}
openTab(start);
</script>
