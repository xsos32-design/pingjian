s:0 8px 8px 0; font-size:13.5px; color:var(--ink-2)}\n.why b{color:var(--ink)}\n.verdict{font-family:\"Noto Serif TC\",serif; font-weight:900; font-size:15px; margin-bottom:4px}\n.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}\n.nextrow{margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}\n\n/* result */\n.res-top{display:flex; gap:20px; align-items:center; flex-wrap:wrap}\n.score{font-family:\"Noto Serif TC\",serif; font-size:56px; font-weight:900; line-height:1; color:var(--wine)}\n.res-top .nums{font-family:\"IBM Plex Mono\",monospace; font-size:13px; color:var(--ink-3)}\n.res-top .nums b{display:block; font-size:22px; color:var(--ink)}\n.wrongs{margin-top:20px; border-top:1px solid var(--line)}\n.wrong{padding:12px 0; border-bottom:1px solid var(--line)}\n.wrong .wq{font-size:14.5px; font-weight:500}\n.wrong .wa{font-size:13.5px; color:var(--ink-2); margin-top:4px}\n.wrong .wa .yes{color:var(--ok); font-weight:700}\n.wrong .wa .nope{color:var(--no); text-decoration:line-through}\n.wrong .wt{font-family:\"IBM Plex Mono\",monospace; font-size:11.5px; color:var(--gold)}\n.hide{display:none}\n.note{border:1px solid var(--line); border-left:4px solid var(--gold); background:var(--surface); border-radius:0 8px 8px 0;\n  padding:12px 14px; margin-top:18px; font-size:13.5px; color:var(--ink-2)}\n.note b{color:var(--ink)}\n@media (max-width:480px){\n  .q{font-size:16.5px} .score{font-size:44px} .brand{font-size:15px}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n</style>\n\n<header class=\"top\">\n  <div class=\"top-in\">\n    <div class=\"brand\"><span class=\"kick\">昇恒昌營業部 · 訓練教材</span>進階評鑑<em>筆試題庫</em></div>\n    <div class=\"grow\"></div>\n    <div class=\"modes\">\n      <button class=\"mode\" id=\"mRead\" aria-pressed=\"true\">速讀</button>\n      <button class=\"mode\" id=\"mQuiz\" aria-pressed=\"false\">測驗</button>\n    </div>\n  </div>\n  <div class=\"subs\" id=\"subs\"></div>\n</header>\n\n<div class=\"wrap\">\n  <!-- 速讀 -->\n  <div id=\"pRead\">\n    <div class=\"toolbar\">\n      <button class=\"act\" id=\"btnMask\" aria-pressed=\"false\">數字挖空</button>\n      <button class=\"act\" id=\"btnTop\">回到最上面</button>\n      <span class=\"count\" id=\"readCount\"></span>\n    </div>\n    <div id=\"readBody\"></div>\n  </div>\n\n  <!-- 測驗 -->\n  <div id=\"pQuiz\" class=\"hide\">\n    <div class=\"setup\" id=\"qSetup\">\n      <h2>開始測驗</h2>\n      <p>題目全部出自上面那七份訓練教材，選項的誘答也都取自教材裡的其他品牌、產區與數字。答錯的題會自動進錯題本。</p>\n      <div class=\"row\">\n        <span class=\"lab\">題數</span>\n        <button class=\"act\" data-n=\"10\">10 題</button>\n        <button class=\"act\" data-n=\"20\" aria-pressed=\"true\">20 題</button>\n        <button class=\"act\" data-n=\"30\">30 題</button>\n        <button class=\"act\" data-n=\"0\">全部</button>\n      </div>\n      <div class=\"row\">\n        <span class=\"lab\">範圍</span>\n        <button class=\"act\" data-sc=\"all\" aria-pressed=\"true\">上面選的科目</button>\n        <button class=\"act\" data-sc=\"wrong\">只考錯題本 <span class=\"mono\" id=\"wrongN\">0</span></button>\n      </div>\n      <div class=\"nextrow\"><button class=\"go\" id=\"btnStart\">開始</button>\n        <button class=\"act\" id=\"btnClearWrong\">清空錯題本</button></div>\n    </div>\n\n    <div class=\"qcard hide\" id=\"qCard\">\n      <div class=\"qtop\">\n        <span id=\"qIdx\">1 / 20</span><span class=\"tag\" id=\"qTag\">葡萄酒</span>\n        <span class=\"sc\" id=\"qScore\">答對 0</span>\n      </div>\n      <div class=\"qbar\"><i id=\"qBar\"></i></div>\n      <div class=\"q\" id=\"qText\"></div>\n      <div class=\"opts\" id=\"qOpts\"></div>\n      <div id=\"qWhy\"></div>\n      <div class=\"nextrow hide\" id=\"qNextRow\"><button class=\"go\" id=\"btnNext\">下一題</button></div>\n    </div>\n\n    <div class=\"qcard hide\" id=\"qRes\">\n      <div class=\"res-top\">\n        <div class=\"score\" id=\"rPct\">0%</div>\n        <div class=\"nums\">答對<b id=\"rOk\">0</b></div>\n        <div class=\"nums\">答錯<b id=\"rNo\">0</b></div>\n        <div class=\"nums\">錯題本<b id=\"rBook\">0</b></div>\n      </div>\n      <p class=\"note\" id=\"rWord\"></p>\n      <div class=\"wrongs\" id=\"rList\"></div>\n      <div class=\"nextrow\"><button class=\"go\" id=\"btnAgain\">再考一輪</button>\n        <button class=\"act\" id=\"btnRetryWrong\">只重考這次錯的</button></div>\n    </div>\n  </div>\n\n  <div class=\"note\"><b>資料來源：</b>昇恒昌股份有限公司營業部訓練教材 115 年度——葡萄酒、香檳氣泡酒、白蘭地、其他酒、清酒、白酒、香菸共七科。內容與數字照教材原文登錄，教材本身有筆誤或前後不一的地方標了「（教材原文）」，沒有自行更正，考試以公司教材為準。</div>\n</div>\n\n<script>\nconst DATA={\"葡萄酒\":{\"subject\":\"葡萄酒\",\"sections\":[{\"h\":\"一、紅酒基礎知識\",\"notes\":[\"紅酒（Red Wine）是以深色葡萄品種釀造而成的葡萄酒。\",\"紅色來自葡萄皮中的天然色素——花青素（Anthocyanin）。\",\"紅酒發酵時會連皮發酵，與白酒不同。\",\"酒精：一般為 12%～15%。\",\"單寧（Tannin）：來自葡萄皮、籽與橡木桶，使紅酒有澀味與結構感。\",\"酸度（Acidity）：賦予清爽感，主要是酒石酸與蘋果酸。\",\"糖分（Sugar）：干型紅酒糖分極低；甜型則較高。\",\"香氣分子：包括果香、花香、香料、皮革、煙草等。\"]},{\"h\":\"二、主要紅葡萄品種與特色\",\"notes\":[\"教材列出七個主要紅葡萄品種：Cabernet Sauvignon、Merlot、Pinot Noir、Syrah / Shiraz、Malbec、Sangiovese、Tempranillo。\"],\"table\":{\"head\":[\"品種\",\"特性描述\",\"代表產區\"],\"rows\":[[\"Cabernet Sauvignon\",\"濃郁、單寧強、黑醋栗、雪松味\",\"法國波爾多、美國納帕\"],[\"Merlot\",\"柔順、果香濃、成熟李子味\",\"波爾多右岸、智利\"],[\"Pinot Noir\",\"精緻、酸度高、紅櫻桃、花香\",\"法國勃根地、俄勒岡\"],[\"Syrah / Shiraz\",\"濃烈、黑胡椒、黑莓\",\"法國隆河、澳洲 Barossa\"],[\"Malbec\",\"飽滿、深色水果、香料\",\"阿根廷\"],[\"Sangiovese\",\"酸度高、紅櫻桃、番茄味\",\"義大利托斯卡納\"],[\"Tempranillo\",\"皮革、煙草、紅果味\",\"西班牙 Rioja\"]]}},{\"h\":\"三、著名紅酒產區\",\"notes\":[\"法國－波爾多（Bordeaux）：Cabernet Sauvignon 與 Merlot 為主。\",\"法國－勃根地（Burgundy）：Pinot Noir。\",\"法國－隆河谷（Rhône）：Syrah、Grenache。\",\"義大利－托斯卡納（Tuscany）：以 Sangiovese 為主（如 Chianti, Brunello）。\",\"西班牙－Rioja、Ribera del Duero：Tempranillo 為主。\",\"新世界－美國加州（Napa Valley、Sonoma）。\",\"新世界－智利、阿根廷（Malbec）。\",\"新世界－澳洲（Barossa Valley 的 Shiraz）。\",\"新世界－南非。\"],\"table\":{\"head\":[\"國家／區塊\",\"產區\",\"主要品種\"],\"rows\":[[\"法國\",\"波爾多（Bordeaux）\",\"Cabernet Sauvignon 與 Merlot\"],[\"法國\",\"勃根地（Burgundy）\",\"Pinot Noir\"],[\"法國\",\"隆河谷（Rhône）\",\"Syrah、Grenache\"],[\"義大利\",\"托斯卡納（Tuscany）\",\"Sangiovese（如 Chianti, Brunello）\"],[\"西班牙\",\"Rioja、Ribera del Duero\",\"Tempranillo\"],[\"新世界\",\"美國加州（Napa Valley、Sonoma）\",\"教材未標示\"],[\"新世界\",\"智利、阿根廷\",\"Malbec\"],[\"新世界\",\"澳洲（Barossa Valley）\",\"Shiraz\"],[\"新世界\",\"南非\",\"教材未標示\"]]}},{\"h\":\"四、品酒基本步驟（五感）\",\"notes\":[\"看：觀察酒色、清澈度、酒腳（黏度）。\",\"聞：初香（果香）、第二香（發酵味）、第三香（陳年香）。\",\"嘗－酸度：在舌側感受。\",\"嘗－單寧：澀感，牙齦感受。\",\"嘗－酒體：厚重感。\",\"嘗－平衡度與餘韻：餘味長短。\",\"聞香杯：適合集中香氣（如波爾多杯、勃根地杯）。\",\"搭餐：紅酒多搭紅肉或重口味食物，根據酒體選擇。\"],\"table\":{\"head\":[\"步驟\",\"重點\"],\"rows\":[[\"看\",\"酒色、清澈度、酒腳（黏度）\"],[\"聞\",\"初香（果香）、第二香（發酵味）、第三香（陳年香）\"],[\"嘗\",\"酸度（舌側）、單寧（牙齦澀感）、酒體（厚重感）、平衡度與餘韻\"],[\"聞香杯\",\"集中香氣，如波爾多杯、勃根地杯\"],[\"搭餐\",\"紅肉或重口味食物，根據酒體選擇\"]]}},{\"h\":\"五、紅酒的釀造流程（簡略）\",\"notes\":[\"流程順序：採收 ➝ 去梗破皮 ➝ 帶皮發酵 ➝ 壓榨 ➝ 陳年（橡木桶／不鏽鋼）➝ 裝瓶。\"]},{\"h\":\"六、進階專業知識 A：紅酒分級制度（以法國為例）\",\"notes\":[\"AOC（Appellation d'Origine Contrôlée）－法定產區最高分級。\",\"IGP / Vin de Pays－地區酒。\",\"Vin de France－法國酒（無產區標示）。\"],\"table\":{\"head\":[\"等級\",\"說明\"],\"rows\":[[\"AOC（Appellation d'Origine Contrôlée）\",\"法定產區最高分級\"],[\"IGP / Vin de Pays\",\"地區酒\"],[\"Vin de France\",\"法國酒（無產區標示）\"]]}},{\"h\":\"六、進階專業知識 B：橡木桶的作用\",\"notes\":[\"提供香草、烘烤、椰子等香氣。\",\"幫助酒體柔化與複雜化。\",\"常見橡木來源：法國、美國。\"]},{\"h\":\"六、進階專業知識 C：儲存與醒酒\",\"notes\":[\"儲存溫度：12–16°C，避免光線與溫度變化。\",\"醒酒（Decanting）：幫助氧化、展現香氣。\",\"醒酒適用於年輕酒與沉澱物多的老酒。\"]},{\"h\":\"Penfolds（奔富）－品牌資料\",\"notes\":[\"品牌英文名稱：Penfolds；品牌中文名稱：奔富；產區：澳洲。\",\"品牌特色 1：澳洲最具代表性的傳奇酒莊，最國際化的葡萄酒品牌之一。\",\"品牌特色 2：結合傳統與現代，代表澳洲品質的國際級酒莊，Grange 是它的靈魂，多元混釀是它的核心。\"]},{\"h\":\"Penfolds（奔富）－品牌故事\",\"notes\":[\"1844 年，來自英國的醫生 Christopher Rawson Penfold 帶著妻子 Mary 踏上澳洲南方的土地。\",\"他們在阿德雷德近郊的 Magill Estate 上蓋起小酒莊，最初只是為了釀製藥用葡萄酒，幫助病患補血、療養。\",\"Mary 是幕後真正的靈魂人物，丈夫忙於行醫時，她親自管理葡萄園與釀造流程。\",\"1951 年，年輕釀酒師 Max Schubert 從法國學成歸來，決心為澳洲釀出能與波爾多媲美的「傳世之酒」。\",\"他釀出第一瓶 Grange，卻因風味過於前衛遭公司高層否決；Max 默默在地下室持續釀酒、陳放。\",\"數年後 Grange 在國際間獲得極高評價，公司才驚覺這是顆尚未打開的寶石。\",\"奔富首創「多產區混釀」風格，使每瓶酒都能超越氣候與地理限制，穩定呈現最佳風味。\",\"Penfolds 版圖從澳洲到美國 Napa、到中國寧夏、再到法國波爾多。\",\"酒款層級：從入門的 Koonunga Hill，到有「小 Grange」之稱的 Bin 389，再到旗艦酒款 Grange。\",\"奔富用超過 180 年的歷史與堅持，打造出兼具深度、廣度與國際地位的葡萄酒帝國。\"]},{\"h\":\"Penfolds（奔富）－酒款明細\",\"notes\":[\"教材列出的奔富酒款容量皆為 750ML、產地澳洲（Bin 707 教材寫「750MLL」）。（教材原文）\",\"Bin 2 希哈瑪塔羅：品種希哈、瑪塔羅，單寧細緻而略乾；兼具南澳新世界厚實果味與舊世界香料、橡木複雜感的中等酒體紅酒，是 Penfolds 系列中性價比極高且具歷史感的一支。\",\"Bin 8 希哈卡本內：品種希哈與卡本內蘇維翁，單寧柔順圓潤；起源是為因應全球追捧的卡本內希哈混釀需求，成為澳洲現代紅葡萄酒最典型的代表。建議搭配紅肉及乳酪類餐點。\",\"Bin 128 庫那瓦拉希哈：品種希哈，單寧柔順圓潤；來自寒冷的南澳 Coonawarra 紅土地區，混用全新與舊的法國大橡木桶熟陳 12 個月。\",\"Bin 128 獲得 James Suckling 93 分及 Robert Parker's Wine Advocate 92 分的肯定。建議搭配牛臀肉、鹹牛肉。\",\"Bin 150 希哈：品種希哈，單寧細緻而有力；置於美國橡木桶（25% 全新、25% 一年桶）與法國橡木桶（25% 全新、25% 一年桶）。\",\"Bin 150 來自澳洲頂級產區巴羅莎谷 Marananga 的 Shiraz，結構堅實，酸度和單寧平衡良好，具良好陳年潛力；適合搭配烤牛排、羊排或濃郁紅肉料理。\",\"Bin 389 卡本內希哈：品種希哈與卡本內蘇維翁，單寧柔順圓潤；是葛蘭許創始人麥克斯‧舒伯特的另一佳作。\",\"Bin 389 在葛蘭許紅葡萄酒用過的橡木桶中熟陳，因此被稱為「小葛蘭許」（BABY GRANGE）；美洲橡木桶熟成 12 個月（37% 新桶）。建議搭配牛五花肉、豬五花肉。\",\"Bin 407 卡本內蘇維翁：單寧柔順；以法國橡木（約 25–26% 新桶）和美國橡木（約 12% 新桶）陳年 12 個月，展現成熟果實與桶香平衡。\",\"Bin 407 話術另寫「使用法國與美國橡木桶混合陳年（約 12–25% 新桶）」，展現 Cabernet 的核心特色：黑果香、雪松、薄荷、礦物感。（教材原文）\",\"Bin 707 卡本內蘇維翁：單寧細緻有力；100% Cabernet Sauvignon，葡萄來自南澳多個優質產區（如 Coonawarra、Barossa、McLaren Vale）。\",\"Bin 707 是 Penfolds 酒莊最頂級的卡本內蘇維翁之一，有黑加侖、薄荷和雪松香氣，餘韻很長。\",\"Koonunga Hill：品種麗絲玲，單寧含量極低；具典型 Riesling 品種特徵，以酸度和礦物質感為主。（教材原文）\",\"Koonunga Hill Autumn Riesling 是帶有清新果香和微妙甜味的輕盈白葡萄酒。\",\"Grange（教材品名寫「奔富 Grange 希哈內蘇維翁紅葡萄酒」）：品種希哈與卡本內蘇維翁，單寧緊實卻平衡。（教材原文）\",\"Grange 是 Penfolds 的代表作，自 1951 年首創以來，每瓶皆代表澳洲「第一成長」等級的頂峰。\",\"Grange 2019 風格更濃郁集中、單寧結構更強，且全程使用新美國橡木桶熟成，陳年潛力遠超其他系列。\",\"ST HENRI SHIRAZ：品種希哈，單寧強而紮實；與 Grange 或 RWT 不同，St Henri 不依賴新橡木桶增添香氣。\",\"St Henri 使用大型舊橡木桶熟成，保留更多葡萄本身風味與自然結構，是純粹果味、礦物感與陳年表現路線。\"],\"table\":{\"head\":[\"酒款\",\"品種\",\"單寧\",\"橡木桶／關鍵數字\"],\"rows\":[[\"Bin 2 希哈瑪塔羅\",\"希哈、瑪塔羅\",\"細緻而略乾\",\"中等酒體，性價比極高\"],[\"Bin 8 希哈卡本內\",\"希哈與卡本內蘇維翁\",\"柔順圓潤\",\"因應卡本內希哈混釀需求\"],[\"Bin 128 庫那瓦拉希哈\",\"希哈\",\"柔順圓潤\",\"法國大橡木桶熟陳 12 個月；JS 93 分、RP 92 分\"],[\"Bin 150 希哈\",\"希哈\",\"細緻而有力\",\"美國橡木桶 25% 全新+25% 一年桶；法國橡木桶 25% 全新+25% 一年桶\"],[\"Bin 389 卡本內希哈\",\"希哈與卡本內蘇維翁\",\"柔順圓潤\",\"美洲橡木桶 12 個月（37% 新桶）；小葛蘭許\"],[\"Bin 407 卡本內蘇維翁\",\"卡本內蘇維翁\",\"單寧柔順\",\"法國橡木約 25–26% 新桶、美國橡木約 12% 新桶，陳年 12 個月\"],[\"Bin 707 卡本內蘇維翁\",\"卡本內蘇維翁\",\"細緻有力\",\"100% Cabernet Sauvignon；Coonawarra、Barossa、McLaren Vale\"],[\"Koonunga Hill\",\"麗絲玲\",\"單寧含量極低\",\"以酸度和礦物質感為主（教材原文）\"],[\"Grange\",\"希哈與卡本內蘇維翁\",\"緊實卻平衡\",\"1951 年首創；全程新美國橡木桶\"],[\"ST HENRI SHIRAZ\",\"希哈\",\"強而紮實\",\"大型舊橡木桶，不依賴新橡木桶\"]]}},{\"h\":\"Robert Mondavi（羅伯特.蒙岱維）－品牌資料與故事\",\"notes\":[\"品牌英文名稱：Robert Mondavi；品牌中文名稱：羅伯特.蒙岱維；產區：美國。\",\"品牌特色：是美國加州納帕谷（Napa alley）著名的高端葡萄酒品牌。（教材原文）\",\"品牌特色：是加州葡萄酒產業的先驅者，品牌風格中帶有創新與領導的元素。\",\"Robert Mondavi 被譽為「現代加州葡萄酒之父」。\",\"Robert Mondavi（1913–2008），出生於明尼蘇達州，父母為義大利移民，後隨家族移居至加州中央谷。\",\"他就讀於史丹佛大學，畢業後投身家族葡萄酒事業（Charles Krug Winery），1965 年與家人決裂自行創業。\",\"1966 年，Robert Mondavi 在納帕谷 Oakville 建立第一家以「世界級酒莊」為目標打造的加州酒廠：Robert Mondavi Winery。\",\"他是第一位在酒標上明確標示單一葡萄品種（Varietal Labeling）的美國酒商。\",\"改革與創新：採用不銹鋼發酵槽、冷溫控制發酵技術提升白酒品質。\",\"改革與創新：引入法國橡木桶熟成紅酒，提升風味複雜度。\",\"改革與創新：重視單一葡萄園（To Kalon）風土表現，成為美國首批重視「Terroir」概念的酒廠。\",\"改革與創新：是第一位設立「酒莊訪客中心」、開展葡萄酒與食物教育的美國釀酒師。\",\"改革與創新：開創結合美食、藝術、音樂的「Robert Mondavi Summer Concert Series」文化活動。\",\"2004 年 Robert Mondavi 酒莊被 Constellation Brands 收購，品牌精神依舊保留並持續創新。\",\"酒莊仍位於 Napa Valley 的核心產區 Oakville，並持續使用 Robert 親自挑選的 To Kalon 葡萄園出品其最高階系列。\",\"名言：「Wine to me is passion. It's family and friends.」；「To make wine is to capture sunlight in a bottle（釀酒，就是把陽光封存在瓶中）」。\"]},{\"h\":\"Robert Mondavi－酒款明細\",\"notes\":[\"RM Private Merlot 2021：容量 750ML、產地美國、品種梅洛、單寧柔順；使用蘭姆酒橡木桶陳年（rum barrel-aged）約 10 個月，賦予微妙的黑糖、太妃糖、楓糖及香料蛋糕香氣。\",\"RM Private Cab.Sau 2021：品種卡本內蘇維翁、單寧成熟柔順；桶陳 10 個月，比例為 60% 新橡木桶，混用法國與美國橡木。\",\"RM Private Cab.Sau 2021 葡萄主要來自加州中央海岸（Central Coast）與 Lodi 的涼爽葡萄園。\",\"RM Winery Pinot Noir 2021：教材品種欄寫「卡本內蘇維翁」，單寧細緻成熟；產品風格寫 100% Pinot Noir，來自納帕谷 Carneros 產區，受海霧與涼爽晚間影響。（教材原文）\"],\"table\":{\"head\":[\"酒款\",\"品種（教材欄位）\",\"單寧\",\"橡木桶／產地細節\"],\"rows\":[[\"RM Private Merlot 2021\",\"梅洛\",\"單寧柔順\",\"蘭姆酒橡木桶陳年約 10 個月\"],[\"RM Private Cab.Sau 2021\",\"卡本內蘇維翁\",\"成熟柔順\",\"桶陳 10 個月、60% 新橡木桶，法國與美國橡木混用\"],[\"RM Winery Pinot Noir 2021\",\"卡本內蘇維翁（教材原文）\",\"細緻成熟\",\"100% Pinot Noir，納帕谷 Carneros\"]]}},{\"h\":\"Louis Jadot（路易佳鐸）－品牌資料與故事\",\"notes\":[\"品牌英文名稱：Louis Jadot；品牌中文名稱：路易佳鐸；產區：法國。\",\"品牌特色 1：法國勃艮地區第一家知名的酒商和酒莊。\",\"品牌特色 2：重視葡萄品質，僅使用天然酵母，盡量減少人工干預，以確保葡萄酒的天然風味。\",\"Louis Jadot 於 1859 年創立於法國勃艮第（Bourgogne）地區，由 Louis Henry Denis Jadot 創立。\",\"家族早在 18 世紀中就已在博恩（Beaune）擁有葡萄園，最早的地塊之一是知名的 Beaune 1er Cru – Clos des Ursules。\",\"創立信念：「讓葡萄酒忠實反映風土（terroir）的特色與聲音」。\",\"酒標圖案為古希臘酒神巴克斯（Bacchus）的頭像，象徵酒神的精神、藝術與自然的結合。\",\"在勃艮第擁有龐大葡萄園，從夏布利到薄酒萊都有涉足，是勃艮第地區最大的酒莊之一，擁有眾多特級和一級葡萄園。\",\"被葡萄酒評論家 Robert Parker 先生收錄於其著作的 12 個勃艮第酒廠之一。\"]},{\"h\":\"Louis Jadot－酒款明細\",\"notes\":[\"Clos Vougeot Grand Cru 14：容量 750ML、產地法國；教材品種欄寫「卡本內蘇維翁」，單寧細緻成熟，產品風格寫 100% Pinot Noir、來自納帕谷 Carneros 產區。（教材原文）\",\"Nuits Saint Georges 2017：品種黑皮諾，單寧細緻且堅實；100% Pinot Noir，色澤明亮透紅至深石榴，散發櫻桃、草莓、黑醋栗等紅黑果香與紫羅蘭花香。\",\"Nuits Saint Georges 話術：Les Vaucrains 是 Nuits-Saint-Georges 最具代表性的一級園之一，結構紮實、礦香濃厚，儘管非 Grand Cru 卻具相當實力，適合搭配野味與重口菜餚。\",\"Santenay 2020：品種黑皮諾，單寧順滑；Pinot Noir 經 3~4 週開放發酵、18 個月橡木成熟（約三分之一新桶），適合即開或窖藏 5–8 年。\",\"Santenay 2020 話術：使用 100% Pinot Noir，香氣有紅櫻桃、覆盆子、香料與淡淡礦石；適合搭配烤牛排、炙鴨胸、野菇燉飯、風乾硬質起司。\",\"Beaune 1er Cru Cents Vi 2016：品種黑皮諾，絲滑單寧；同樣記載經 3~4 週開放發酵、18 個月橡木成熟（約三分之一新桶）。\",\"Beaune 1er Cru 話術：Les Cents Vignes 是 Beaune 最具代表性之一級園，香氣層次從紅莓延伸至礦物、花香與香料，擁有 10 年以上的陳年空間。\",\"Bourgogne P.Peties R 21：品種黑皮諾，單寧結構柔和；以 100% 黑皮諾釀造，帶有櫻桃、草莓等新鮮紅色水果香氣，並帶有微妙的礦物質風味。\",\"Bourgogne P.Peties R 21 話術：喝起來輕盈順口，酸度和單寧很平衡，很適合配烤肉或雞肉。\"],\"table\":{\"head\":[\"酒款\",\"品種（教材欄位）\",\"單寧\",\"關鍵資料\"],\"rows\":[[\"Clos Vougeot Grand Cru 14\",\"卡本內蘇維翁（教材原文）\",\"細緻成熟\",\"風格欄寫 100% Pinot Noir、納帕谷 Carneros（教材原文）\"],[\"Nuits Saint Georges 2017\",\"黑皮諾\",\"細緻且堅實\",\"100% Pinot Noir；Les Vaucrains 一級園，非 Grand Cru\"],[\"Santenay 2020\",\"黑皮諾\",\"順滑\",\"3~4 週開放發酵、18 個月橡木（約 1/3 新桶）、窖藏 5–8 年\"],[\"Beaune 1er Cru Cents Vi 2016\",\"黑皮諾\",\"絲滑單寧\",\"Les Cents Vignes 一級園；10 年以上陳年空間\"],[\"Bourgogne P.Peties R 21\",\"黑皮諾\",\"結構柔和\",\"100% 黑皮諾，櫻桃、草莓、礦物質\"]]}},{\"h\":\"Duclot（杜克洛）－品牌資料與故事\",\"notes\":[\"品牌英文名稱：Dulot；品牌中文名稱：杜克洛；產區：法國。（教材原文，標題處寫 Duclot）\",\"品牌特色 1：法國波爾多葡萄酒界重量級家族，擁有多家頂級酒莊，包括傳奇酒莊 Pétrus。\",\"品牌特色 2：不是傳統酒莊，而是波爾多頂級酒款的精選經銷商與收藏平台。\",\"Duclot 背後是法國波爾多葡萄酒界最具影響力的家族——Moueix 家族。\",\"Moueix 家族的葡萄酒故事可追溯到 20 世紀初，家族成員開始在波爾多及波美侯地區投資與經營酒莊。\",\"Duclot 酒商成立於 1982 年，位於法國波爾多，由 Moueix 家族所經營。\",\"Moueix 家族擁有多家頂級酒莊，其中最著名的是 Pétrus。\"]},{\"h\":\"Duclot－酒款明細\",\"notes\":[\"FILIA DE Grand Mayne 18：容量 750ML、產地法國，品種梅洛與卡本內蘇維翁，絲滑單寧；來自波爾多 Saint-Émilion（聖愛美濃）產區。\",\"FILIA DE Grand Mayne 18 風格：梅洛（Merlot）占比最高，帶來圓潤果味和柔順口感；卡本內蘇維翁（Cabernet Franc）增加酒的結構和香氣層次。（教材原文）\",\"FILIA DE Grand Mayne 18 話術：波爾多聖愛美濃的經典副牌酒，背後是知名酒商 Duclot 精心監製，酒體中等偏上，帶有紅莓和巧克力的味道。\",\"Les Hauts de Smith 2017：品種梅洛與卡本內蘇維翁，單寧柔順卻結實；是波爾多瑪歌（Margaux）著名酒莊 Château Smith Haut Lafitte 的副牌酒。（教材原文）\",\"Les Hauts de Smith 2017 話術：主打赤霞珠和梅洛，酒體飽滿，帶有濃郁的黑醋栗和香草味。\",\"CH. Moulin DeCanhaut 2015：品種梅洛與卡本內蘇維翁，質地細膩柔順；位於波爾多 Saint-Émilion Grand Cru 產區，這裡的酒以細膩優雅和豐富層次著稱。\",\"CH. Moulin DeCanhaut 2015 話術：由知名酒商 Duclot 代理，酒款以梅洛為主，搭配卡本內蘇維翁，帶有紅櫻桃和香料味。\"],\"table\":{\"head\":[\"酒款\",\"品種\",\"單寧\",\"產區\"],\"rows\":[[\"FILIA DE Grand Mayne 18\",\"梅洛與卡本內蘇維翁\",\"絲滑單寧\",\"波爾多 Saint-Émilion（聖愛美濃）\"],[\"Les Hauts de Smith 2017\",\"梅洛與卡本內蘇維翁\",\"柔順卻結實\",\"波爾多瑪歌（Margaux）；Château Smith Haut Lafitte 副牌（教材原文）\"],[\"CH. Moulin DeCanhaut 2015\",\"梅洛與卡本內蘇維翁\",\"質地細膩柔順\",\"波爾多 Saint-Émilion Grand Cru\"]]}},{\"h\":\"BELLEGRAVE（美麗礫石）－品牌資料與故事\",\"notes\":[\"品牌英文名稱：BELLEGRAVE；品牌中文名稱：美麗礫石；產區：法國。\",\"品牌特色 1：典型波爾多瑪歌左岸風格，酒體優雅且層次豐富，兼具果香與礦物質氣息。\",\"品牌特色 2：主要葡萄品種為卡本內蘇維翁（Cabernet Sauvignon）和梅洛（Merlot），比例調配均衡，呈現圓潤且結構穩健的口感。\",\"Château Bellegrave 位於法國波爾多著名的 Margaux（瑪歌）產區，是波爾多左岸最負盛名的葡萄酒產區之一。\",\"瑪歌產區的葡萄園土壤主要是砂礫石混合粘土，非常適合赤霞珠和梅洛等葡萄品種的生長。\",\"「Bellegrave」象徵「美麗的礫石」，指瑪歌產區葡萄園中典型的礫石土壤。\",\"礫石土壤為葡萄提供良好的排水與熱量儲存，促進葡萄的均衡成熟。\"]},{\"h\":\"BELLEGRAVE－酒款明細\",\"notes\":[\"CH.Bellisle Mond. 2008：容量 750ML、產地法國，品種梅洛與卡本內蘇維翁，單寧較緊實；瑪歌（Margaux）知名左岸產區，風格典雅。\",\"CH.Bellisle Mond. 2008 話術：年份較冷，酒款結構緊實，單寧較明顯，非常適合陳年收藏；搭紅燒牛肉、燉羊膝、濃郁蘑菇醬料理。\",\"CH.Bellegrave 2015：品種「梅洛與赤卡本內蘇維翁」，單寧細膩；主要以卡本內蘇維翁和梅洛為主，結構平衡。（教材原文）\",\"CH.Bellegrave 2015 話術：2015 年是波爾多的優秀年份，此款來自瑪歌產區，酒體飽滿，帶有黑醋栗和櫻桃香氣。\",\"CH.G.Pey Les 2016：品種梅洛為主，單寧細緻但有力；葡萄比例為 70% 梅洛、25% 卡本內蘇維翁、5% 卡本內弗朗，典型聖愛美濃配方。\",\"CH.G.Pey Les 2016 話術：來自聖愛美濃 Grand Cru 的精品紅酒，可以收藏 5–8 年。\"],\"table\":{\"head\":[\"酒款\",\"品種\",\"單寧\",\"產區／比例\"],\"rows\":[[\"CH.Bellisle Mond. 2008\",\"梅洛與卡本內蘇維翁\",\"較緊實\",\"瑪歌（Margaux）；年份較冷\"],[\"CH.Bellegrave 2015\",\"梅洛與赤卡本內蘇維翁（教材原文）\",\"單寧細膩\",\"瑪歌；2015 為波爾多優秀年份\"],[\"CH.G.Pey Les 2016\",\"梅洛為主\",\"細緻但有力\",\"聖愛美濃 Grand Cru；70% 梅洛、25% 卡本內蘇維翁、5% 卡本內弗朗\"]]}},{\"h\":\"WENTE（雲特）－品牌資料與故事\",\"notes\":[\"品牌英文名稱：WENTE；品牌中文名稱：雲特；產區：美國。\",\"品牌特色 1：有「美式 Chardonnay 之父」的美譽。\",\"品牌特色 2：加州最早通過「Certified Sustainable」認證的酒莊之一。\",\"Wente 酒莊創立於 1883 年，由德裔移民 C.H. Wente 在加州 Livermore Valley 創立。\",\"Wente 是美國歷史最悠久、持續由家族經營的釀酒廠之一；家族至今已傳承到第五代。\",\"第二代 Ernest Wente（1930s）從法國引入 Chardonnay 葡萄藤，並成功適應當地風土。\",\"這個品系後來成為加州 80% 以上 Chardonnay 種植的「Wente Clone」，被譽為「美國 Chardonnay 的祖源」。\",\"Wente 是美國第一家釀造 Chardonnay 並上市銷售的酒莊（1936 年）。\",\"Wente Clone 特性為芳香、果味濃郁、酸度明亮。\",\"國際地位：被《Wine Enthusiast》雜誌評為「年度美國酒莊」。\",\"國際地位：Wente 家族獲選為「美國酒業名人堂」（Wine Hall of Fame）成員。\",\"國際地位：旗下酒款連續多年獲得 Wine Spectator、Robert Parker 高分評價。\"]},{\"h\":\"WENTE－酒款明細\",\"notes\":[\"Wente Res Cab Sau 22：容量 750ML、產地美國，品種卡本內蘇維翁，單寧紮實卻不澀。\",\"產品風格：100% Cabernet Sauvignon 並於橡木桶中成熟 12–20 個月（每款年份略有差異）。\",\"產品風格：Wente 是美國最古老的家族酒莊之一，並且實踐可持續農藝，家族擁有 Clonal 品種傳承超過一世紀。\",\"建議話術：來自 Livermore Valley 的優質單一園區，100% 卡本內，展現典型黑色果實、香料與橡木香氣，適合陳年或與牛排搭配。\"]}],\"card\":[\"紅酒紅色來自葡萄皮花青素\",\"紅酒酒精一般 12%～15%\",\"單寧來自葡萄皮、籽與橡木桶\",\"酸度主要是酒石酸與蘋果酸\",\"波爾多：Cab. Sauvignon＋Merlot\",\"勃根地＝Pinot Noir\",\"隆河谷＝Syrah、Grenache\",\"托斯卡納＝Sangiovese\",\"Rioja＝Tempranillo；阿根廷＝Malbec\",\"Barossa Valley＝Shiraz\",\"AOC＝法定產區最高分級\",\"IGP／Vin de Pays＝地區酒\",\"Vin de France＝無產區標示\",\"儲存 12–16°C，避光避溫差\",\"採收→去梗破皮→帶皮發酵→壓榨→陳年→裝瓶\",\"Grange 1951 首創，Max Schubert\",\"Bin 389＝小葛蘭許 BABY GRANGE\",\"Wente 1883 創立，Chardonnay 之父\"],\"quiz\":[{\"q\":\"紅酒的紅色主要來自葡萄皮中的哪種天然色素？\",\"o\":[\"單寧（Tannin）\",\"花青素（Anthocyanin）\",\"酒石酸\",\"蘋果酸\"],\"a\":1,\"why\":\"教材一、1 寫明紅色來自葡萄皮中的天然色素——花青素（Anthocyanin）。\"},{\"q\":\"依教材，紅酒的酒精度一般為多少？\",\"o\":[\"8%～10%\",\"10%～12%\",\"12%～15%\",\"15%～18%\"],\"a\":2,\"why\":\"教材一、2 基本成分列「酒精：一般為 12%～15%」。\"},{\"q\":\"教材指出單寧（Tannin）來自下列哪些來源？\",\"o\":[\"葡萄汁與酵母\",\"葡萄皮、籽與橡木桶\",\"酒石酸與蘋果酸\",\"花青素與糖分\"],\"a\":1,\"why\":\"教材一、2 寫單寧來自葡萄皮、籽與橡木桶，使紅酒有澀味與結構感。\"},{\"q\":\"紅酒中的酸度主要是哪兩種酸？\",\"o\":[\"檸檬酸與醋酸\",\"乳酸與丁酸\",\"碳酸與硫酸\",\"酒石酸與蘋果酸\"],\"a\":3,\"why\":\"教材一、2 寫酸度賦予清爽感，主要是酒石酸與蘋果酸。\"},{\"q\":\"依教材的品種表，Cabernet Sauvignon 的代表產區是？\",\"o\":[\"法國勃根地、俄勒岡\",\"法國波爾多、美國納帕\",\"義大利托斯卡納\",\"西班牙 Rioja\"],\"a\":1,\"why\":\"教材二品種表列 Cabernet Sauvignon 代表產區為法國波爾多、美國納帕。\"},{\"q\":\"教材品種表中，特性為「精緻、酸度高、紅櫻桃、花香」的品種是？\",\"o\":[\"Merlot\",\"Malbec\",\"Pinot Noir\",\"Tempranillo\"],\"a\":2,\"why\":\"教材二品種表列 Pinot Noir 特性為精緻、酸度高、紅櫻桃、花香。\"},{\"q\":\"特性為「皮革、煙草、紅果味」，代表產區西班牙 Rioja 的品種是？\",\"o\":[\"Sangiovese\",\"Syrah / Shiraz\",\"Merlot\",\"Tempranillo\"],\"a\":3,\"why\":\"教材二品種表列 Tempranillo 特性為皮革、煙草、紅果味，代表產區西班牙 Rioja。\"},{\"q\":\"教材品種表中，特性含「番茄味」且代表產區為義大利托斯卡納的品種是？\",\"o\":[\"Sangiovese\",\"Pinot Noir\",\"Malbec\",\"Cabernet Sauvignon\"],\"a\":0,\"why\":\"教材二品種表列 Sangiovese 特性為酸度高、紅櫻桃、番茄味，代表產區義大利托斯卡納。\"},{\"q\":\"依教材的著名產區，法國隆河谷（Rhône）以哪些品種為代表？\",\"o\":[\"Pinot Noir\",\"Cabernet Sauvignon 與 Merlot\",\"Syrah、Grenache\",\"Sangiovese\"],\"a\":2,\"why\":\"教材三、1 列隆河谷（Rhône）：Syrah、Grenache。\"},{\"q\":\"依教材，義大利托斯卡納（Tuscany）以 Sangiovese 為主，代表酒款包括？\",\"o\":[\"Rioja 與 Ribera del Duero\",\"Chianti 與 Brunello\",\"Napa Valley 與 Sonoma\",\"Barossa 與 McLaren Vale\"],\"a\":1,\"why\":\"教材三、2 寫托斯卡納以 Sangiovese 為主（如 Chianti, Brunello）。\"},{\"q\":\"教材三的新世界產區中，澳洲 Barossa Valley 以哪個品種著名？\",\"o\":[\"Shiraz\",\"Malbec\",\"Tempranillo\",\"Pinot Noir\"],\"a\":0,\"why\":\"教材三、4 新世界列澳洲（Barossa Valley 的 Shiraz）。\"},{\"q\":\"依教材，品酒時「聞」的第三香指的是？\",\"o\":[\"果香\",\"發酵味\",\"陳年香\",\"橡木香\"],\"a\":2,\"why\":\"教材四、2 寫初香（果香）、第二香（發酵味）、第三香（陳年香）。\"},{\"q\":\"依教材，品嘗時單寧的澀感主要由哪個部位感受？\",\"o\":[\"牙齦\",\"舌側\",\"舌尖\",\"喉嚨\"],\"a\":0,\"why\":\"教材四、3 寫單寧（澀感，牙齦感受），酸度則在舌側。\"},{\"q\":\"教材列舉可集中香氣的聞香杯包括？\",\"o\":[\"笛型杯與鬱金香杯\",\"白蘭地杯與威士忌杯\",\"ISO 標準杯與香檳杯\",\"波爾多杯與勃根地杯\"],\"a\":3,\"why\":\"教材四、4 寫聞香杯適合集中香氣（如波爾多杯、勃根地杯）。\"},{\"q\":\"教材的紅酒釀造流程中，「帶皮發酵」的下一個步驟是？\",\"o\":[\"壓榨\",\"去梗破皮\",\"裝瓶\",\"採收\"],\"a\":0,\"why\":\"教材五流程為採收 ➝ 去梗破皮 ➝ 帶皮發酵 ➝ 壓榨 ➝ 陳年 ➝ 裝瓶。\"},{\"q\":\"法國紅酒分級制度中，法定產區最高分級是？\",\"o\":[\"Vin de France\",\"IGP\",\"AOC\",\"Vin de Pays\"],\"a\":2,\"why\":\"教材六、A 寫 AOC（Appellation d'Origine Contrôlée）－法定產區最高分級。\"},{\"q\":\"依教材，「Vin de France」代表的是？\",\"o\":[\"法國酒（無產區標示）\",\"地區酒\",\"法定產區最高分級\",\"特級葡萄園\"],\"a\":0,\"why\":\"教材六、A 寫 Vin de France－法國酒（無產區標示）。\"},{\"q\":\"依教材，法國分級中屬於「地區酒」的是？\",\"o\":[\"AOC\",\"Grand Cru\",\"IGP / Vin de Pays\",\"Vin de France\"],\"a\":2,\"why\":\"教材六、A 寫 IGP / Vin de Pays－地區酒。\"},{\"q\":\"教材列出的橡木桶作用不包含下列哪一項？\",\"o\":[\"提供香草、烘烤、椰子等香氣\",\"幫助酒體柔化與複雜化\",\"常見橡木來源為法國、美國\",\"降低酒的酒精度\"],\"a\":3,\"why\":\"教材六、B 只列香氣、柔化複雜化與橡木來源三項，未提降低酒精度。\"},{\"q\":\"依教材，紅酒的建議儲存溫度是？\",\"o\":[\"4–8°C\",\"12–16°C\",\"8–12°C\",\"16–20°C\"],\"a\":1,\"why\":\"教材六、C 寫儲存溫度 12–16°C，避免光線與溫度變化。\"},{\"q\":\"依教材，醒酒（Decanting）適用於哪類酒？\",\"o\":[\"只適用於甜型白酒\",\"年輕酒與沉澱物多的老酒\",\"只適用於氣泡酒\",\"只適用於未經橡木桶的酒\"],\"a\":1,\"why\":\"教材六、C 寫醒酒幫助氧化、展現香氣，適用於年輕酒與沉澱物多的老酒。\"},{\"q\":\"Penfolds（奔富）創立於哪一年、由誰帶著妻子 Mary 創立？\",\"o\":[\"1844 年，Christopher Rawson Penfold\",\"1859 年，Louis Henry Denis Jadot\",\"1883 年，C.H. Wente\",\"1966 年，Robert Mondavi\"],\"a\":0,\"why\":\"Penfolds 品牌故事寫 1844 年英國醫生 Christopher Rawson Penfold 帶著妻子 Mary 踏上澳洲南方的土地。\"},{\"q\":\"Penfolds 的 Grange 由哪位釀酒師在哪一年首創？\",\"o\":[\"Ernest Wente，1936 年\",\"Max Schubert，1951 年\",\"Max Schubert，1844 年\",\"Robert Parker，1982 年\"],\"a\":1,\"why\":\"教材寫 1951 年 Max Schubert 從法國學成歸來並釀出第一瓶 Grange；Grange 自 1951 年首創。\"},{\"q\":\"Penfolds 哪一款酒因在葛蘭許用過的橡木桶中熟陳而被稱為「小葛蘭許」（BABY GRANGE）？\",\"o\":[\"Bin 2\",\"Bin 128\",\"Bin 389\",\"Bin 707\"],\"a\":2,\"why\":\"教材 Bin 389 產品風格寫其在葛蘭許紅葡萄酒用過的橡木桶中熟陳，因此被稱為小葛蘭許。\"},{\"q\":\"Robert Mondavi 在哪一年、於納帕谷哪個產區建立 Robert Mondavi Winery？\",\"o\":[\"1965 年，Oakville\",\"1966 年，Carneros\",\"1966 年，Oakville\",\"1982 年，To Kalon\"],\"a\":2,\"why\":\"教材寫 1966 年 Robert Mondavi 在納帕谷 Oakville 建立 Robert Mondavi Winery。\"},{\"q\":\"教材稱 Robert Mondavi 是美國第一位在酒標上明確標示什麼的酒商？\",\"o\":[\"單一葡萄品種（Varietal Labeling）\",\"法定產區（AOC）\",\"年份與酒精度\",\"橡木桶新桶比例\"],\"a\":0,\"why\":\"教材寫他是第一位在酒標上明確標示單一葡萄品種（Varietal Labeling）的美國酒商。\"},{\"q\":\"Louis Jadot 於哪一年創立、創立者是誰？\",\"o\":[\"1844 年，Christopher Rawson Penfold\",\"1982 年，Moueix 家族\",\"1883 年，C.H. Wente\",\"1859 年，Louis Henry Denis Jadot\"],\"a\":3,\"why\":\"教材寫 Louis Jadot 於 1859 年創立於法國勃艮第，由 Louis Henry Denis Jadot 創立。\"},{\"q\":\"Duclot 酒商成立於哪一年、由哪個家族經營？\",\"o\":[\"1982 年，Moueix 家族\",\"1859 年，Jadot 家族\",\"1883 年，Wente 家族\",\"1844 年，Penfold 家族\"],\"a\":0,\"why\":\"教材寫 Duclot 酒商成立於 1982 年，位於法國波爾多，由 Moueix 家族所經營。\"},{\"q\":\"「Bellegrave」這個名稱象徵什麼？\",\"o\":[\"美麗的山丘\",\"美麗的礫石\",\"酒神之泉\",\"黃金之丘\"],\"a\":1,\"why\":\"教材寫名稱「Bellegrave」象徵「美麗的礫石」，指瑪歌產區典型的礫石土壤。\"},{\"q\":\"依教材，「Wente Clone」占加州 Chardonnay 種植的比例是？\",\"o\":[\"50% 以上\",\"60% 以上\",\"70% 以上\",\"80% 以上\"],\"a\":3,\"why\":\"教材寫這個品系後來成為加州 80% 以上 Chardonnay 種植的「Wente Clone」。\"}]},\"香檳氣泡酒\":{\"subject\":\"香檳氣泡酒\",\"sections\":[{\"h\":\"認識香檳\",\"notes\":[\"只有產自法國香檳區（Champange）內的氣泡葡萄酒才能使用「Champange」之名（教材原文，品牌/產區英文拼法照抄）。\",\"不是所有有氣泡的酒都可以稱為「香檳」。\",\"香檳依品牌、年份、陳年時間的不同，往往綻放出多樣多元的風格。\"]},{\"h\":\"法國香檳產區\",\"notes\":[\"香檳區位在巴黎東北方約 200 公里處。\",\"香檳區算是全法國位置最北的葡萄園。\",\"寒冷的氣候以及較短的生長季節，使葡萄的成熟略顯緩慢。\",\"分佈廣泛的優良白堊土質，令香檳區的葡萄格外能夠擁有恰到好處的熟度。\",\"成果是呈現出細膩的香味與酸度。\"]},{\"h\":\"製造香檳的過程\",\"notes\":[\"製作初期會輕輕壓榨葡萄使果汁與果皮迅速分離，果皮顏色並不會進入葡萄汁中。\",\"因此紅色葡萄也可以釀出金黃白色的香檳。\",\"一般葡萄約可壓汁三次，但最高級的香檳則皆僅取第一次壓榨的葡萄純汁（Cuvee）釀造。\",\"色澤成漂亮的淺紅色、一般稱為粉紅香檳或玫瑰香檳的「Rose」，是在既有的黑皮諾 Pinot Noir、夏多內 Chardonnay 與皮諾莫尼耶 Pinot Meunier 三種釀酒葡萄之外，再加入少許紅葡萄酒釀製調配而成。\"]},{\"h\":\"製造香檳的葡萄種類（三大品種）\",\"notes\":[\"香檳常以白色夏多內與紅色的黑皮諾兩種釀酒葡萄精心釀而成。\",\"除主要以夏多內及黑皮諾外，有些則會再多加入 Pinot Meunier 葡萄。\",\"有少數酒廠會特別推出純以單一品種如夏多內 Chardonnay 或黑皮諾 Pinot Noir 釀製的香檳。\"],\"table\":{\"head\":[\"品種（中）\",\"品種（英，教材原文拼法）\",\"風味特色\"],\"rows\":[[\"夏多內\",\"Chardonnay\",\"夏多內比例越高的，則風味越是清新爽口，帶有香濃的果香與蜂蜜香\"],[\"黑皮諾\",\"Pinot Moir（教材原文）\",\"為香檳注入嚴謹厚實的結構，口感傾向強勁醇郁\"],[\"皮諾莫尼耶\",\"Pinot Menuier（教材原文）\",\"散發些許甜美的果香氣息，並對其他混合酒發揮催化作用\"]]}},{\"h\":\"香檳以葡萄的比例可分為\",\"notes\":[\"粉紅香檳有二種製造方法：1、葡萄壓榨後，讓葡萄皮短時間浸潤在原汁中，使皮中的色素析出；2、更常見的方法是在調配時加入少量的 Pinot Noir 紅酒。\",\"因為壓榨過程一般比較輕柔，且葡萄原汁發酵時較少接觸葡萄皮，紅葡萄釀出的基酒顏色往往也較淺。\",\"粉紅香檳是少數可以用紅白基酒調配的粉紅葡萄酒，目的是讓每年出產同種的粉紅香檳顏色是持續可複製的。\"],\"table\":{\"head\":[\"名稱（中）\",\"名稱（英）\",\"定義\"],\"rows\":[[\"黑中白香檳\",\"Blanc de Noirs\",\"僅使用 100%黑葡萄像是黑皮諾 Pinot Noir 或是皮諾莫尼耶 Pinot Meunier 所釀製的香檳\"],[\"白中白香檳\",\"Blanc de Blancs\",\"僅用單一白葡萄夏多內 Chardonnay 所釀製的香檳\"],[\"粉紅香檳\",\"Rosé\",\"壓榨後短時間浸皮使色素析出，或更常見在調配時加入少量 Pinot Noir 紅酒\"]]}},{\"h\":\"香檳的甜度區分\",\"notes\":[\"香檳的甜度有分為幾種，在裝瓶之前做加糖（可能是蔗糖或葡萄糖）的舉動。\",\"因此讓它的類型從不甜到甜均有生產，也因此有多種的口味的變化。\",\"教材的甜度分級只列出 Extra Brut、Brut、Sec、Demi-Sec、Doux 五級，未列糖度（g/L）數字。\"],\"table\":{\"head\":[\"甜度分級\",\"中文\",\"建議搭配（教材原文）\"],\"rows\":[[\"Extra Brut\",\"極不甜\",\"搭配前菜或海鮮類，可讓您的海鮮得到更加的鮮美感，同時因為氣泡與酸度的關係讓您覺得十分開胃與爽口\"],[\"Brut\",\"不甜\",\"搭配前菜或海鮮類，可讓您的海鮮得到更加的鮮美感，同時因為氣泡與酸度的關係讓您覺得十分開胃與爽口\"],[\"Sec\",\"略甜\",\"搭配禽類、肉類菜肴\"],[\"Demi-Sec\",\"微甜\",\"超適合配泰國菜的又酸又辣\"],[\"Doux\",\"甜\",\"適宜搭配甜點、麻辣火鍋等\"]]}},{\"h\":\"香檳氣泡的秘密（傳統製法步驟與術語）\",\"notes\":[\"香檳酒用的葡萄與一般葡萄酒無異，但必須遵守瓶內發酵（Bottl Fermentted，教材原文）才是真正的法國香檳酒。\",\"香檳的氣泡，主要發生在裝瓶後的第二次發酵過程裡。\",\"在這個階段，釀酒者將糖和酵母添加入酒中，因此造成第二次發酵與二氧化碳的產生，這也就是氣泡的由來。\",\"發酵結束之後，死去的酵母會慢慢沈入瓶底而產生沈澱物。\",\"在之後漫長的陳年時間裡，需不時輕搖並轉動酒瓶，使沈澱物逐漸累積在瓶頸位置。\",\"目前優質香檳酒廠仍一律以人工擔任這種「轉瓶工作」。\",\"一位專業的「轉瓶師」一天約需轉動 5 萬瓶以上的香檳。\",\"除渣方法：將瓶口插入 -30℃ 的鹽水中使之凝結，然後暫時將瓶蓋除去，瓶中壓力會將凝結的沈澱物推擠噴飛出瓶外。\"]},{\"h\":\"香檳依有無標示年標可分為\",\"notes\":[\"混合與調配，是香檳的釀製過程中極其關鍵的一環，也是香檳的重要精神所在。\",\"並不是每一個年份都有「年份香檳」出產。\"],\"table\":{\"head\":[\"類別\",\"教材說明\"],\"rows\":[[\"非年份香檳\",\"大多數的香檳不標榜單一年份，而是擷取來自各年份、各莊園、各種品種的葡萄酒，在地位崇高的釀酒師掌控下細細調配；在香檳總產量中所佔比例最高，也最能反映各酒廠的特色與風格，加上價格較平易近人，故而最受一般消費者青睞\"],[\"年份香檳\",\"絕大多數的酒商，只有逢上當年氣候與收成特佳、葡萄品質極好的時候，才會決定釀製一律精選該年葡萄、完全不添加其他年份酒液的「年份香檳」；特選年份香檳通常要在瓶中陳年熟成約 4-5 年以上才能出廠上市，口感更為濃郁純厚，也更適合久存\"]]}},{\"h\":\"如何飲用香檳\",\"notes\":[\"非年份香檳最佳飲用溫度約在攝氏 7～10℃ 之間。\",\"年份香檳最佳飲用溫度約在 10～12℃ 之間。\",\"只要在飲用前將香檳瓶放入置了冰塊的冰桶中冰鎮約 20～30 分鐘即可達適飲溫度。\",\"細長型或鬱金香形狀的高腳香檳杯最能襯托出香檳的優雅，也較能保持香檳的氣泡與香氣。\",\"香檳經過搖晃後，氣泡與風味盡失；因此內行人開香檳時往往特別小心翼翼，以免太多空氣溢出。\"]},{\"h\":\"什麼是氣泡酒？\",\"notes\":[\"廣義定義：氣泡酒（Sparkling Wine）是指酒液中含有足夠二氧化碳（CO₂），開瓶後能持續釋放氣泡的葡萄酒。\",\"這些氣泡可由天然發酵產生，也可經人工充填二氧化碳形成。\",\"符合兩個條件就可稱為氣泡酒：1. 是以葡萄釀造的葡萄酒；2. 酒中含有二氧化碳，開瓶後會持續產生氣泡。\",\"狹義定義（高品質氣泡酒）：經由第二次發酵，使二氧化碳自然溶解於酒液中的葡萄酒。\"],\"table\":{\"head\":[\"氣泡來源\",\"說明\",\"常見酒款\"],\"rows\":[[\"天然二氧化碳\",\"第二次發酵自然產生並保留於酒中\",\"Champagne、Cava、Prosecco\"],[\"人工充填二氧化碳\",\"將二氧化碳直接注入酒液\",\"部分低價氣泡酒\"]]}},{\"h\":\"香檳與氣泡酒的關係\",\"notes\":[\"很多人會認為「氣泡酒 = 香檳」，其實並不正確。\",\"正確的概念是：所有香檳都是氣泡酒，但不是所有氣泡酒都是香檳。\",\"香檳只是氣泡酒的一個類別，必須符合特定產區、葡萄品種與釀造法規範，才能使用「香檳」這個名稱。\",\"延伸小知識：一瓶 750ml 的氣泡酒，大約含有 5～6 個大氣壓的壓力，接近汽車輪胎胎壓的 2～3 倍，因此開瓶時要特別注意安全。\"]},{\"h\":\"氣泡酒保存方式\",\"notes\":[\"氣泡酒最大的特色就是酒中溶解了大量二氧化碳（CO₂）。\",\"保存不當可能導致：氣泡流失，口感變得平淡。\",\"保存不當可能導致：香氣氧化，水果香減弱。\",\"保存不當可能導致：酒質老化，風味失去平衡。\",\"保存不當可能導致：軟木塞乾燥或受潮，影響密封性。\",\"因此除了保存葡萄酒本身的品質，也要盡可能保留細緻的氣泡。\"]},{\"h\":\"品牌總覽（品牌英文／中文／產區／特色對照）\",\"notes\":[\"教材共收錄 7 個品牌：ADB、BOTTEGA、KRUG、Veuve Clicquot Ponsardin、MOET&CHANDON（含 Dom Pérignon）、Perrier-Jouet、PELLER ESTATES。\"],\"table\":{\"head\":[\"品牌英文名稱\",\"品牌中文名稱\",\"產區\",\"品牌特色\"],\"rows\":[[\"ADB\",\"黑桃王香檳\",\"法國\",\"1. 香檳區最深的酒窖之一 2. 人工轉瓶 3. 手工雕刻、貼印酒標\"],[\"BOTTEGA\",\"寶緹嘉\",\"義大利 / 威尼托 (Veneto)\",\"1. 具辨識度的金色鏡面酒瓶 2. Prosecco DOC 氣泡酒 3. 100% Glera 葡萄釀造\"],[\"KRUG\",\"庫克\",\"法國\",\"1. 堅持以傳統方式釀酒 2. 使用小橡木桶進行首次發酵 3. 至少陳年 6 年以上\"],[\"Veuve Clicquot Ponsardin\",\"凱歌\",\"法國\",\"1. 世界公認的年份香檳專家 2. 使用高達 70%左右的紅葡萄比例 3. 高於法定陳年時間，至少 6 年以上\"],[\"MOET&CHANDON\",\"酩悅\",\"法國\",\"1. 有皇室香檳的美譽 2. 擁有 270 年釀酒傳統 3. 法國最具國際知名度的香檳\"],[\"Perrier-Jouet\",\"皮耶爵\",\"法國\",\"1. 1854 年推出史上第一款 BRUT（不甜）香檳 2. 有「花香檳」的美稱為歐洲皇室最愛 3. 坐擁歷史悠久且地段最佳的優質葡萄園，產的冰酒獲獎無數\"],[\"PELLER ESTATES\",\"培勒酒莊\",\"加拿大\",\"1. 又稱啄木鳥莊園 2. 產區中的頂級酒莊 3. 生產的冰酒獲獎無數\"]]}},{\"h\":\"ADB（黑桃王香檳）\",\"notes\":[\"由知名法國香檳廠 Cattier 釀造，Cattier 家族是世代相傳的香檳世家，美國公司經營口牌（教材原文），現在已是第 10 代傳人掌舵。\",\"位於香檳區馬恩河流域的心臟地帶一個叫做 Chigny Les Roses 的小村莊，擁有 20 公頃的一級園和特級園。\",\"從 1763 年便開始種植葡萄釀造香檳，50 年代初期即已將「Armand de Brignac」稱註冊（教材原文）。\",\"擁有香檳區最深的酒窖之一；從地表石階而下，經過 119 個階梯，到達香檳區歷史最悠久、地表距離最深的地下酒窖。\",\"酒窖分為 3 層，每一層分別按照新古典主義、哥特式和羅馬式 3 種建築風格來構造。\",\"每一瓶香檳均被倒置在古老的木架上，每一天靠人手的輕微轉動；緩慢的人工轉瓶需要整整一個月。\",\"搖瓶和除渣之後，Cattier 家族運用祖傳秘方進行補液，液體是 Cattier 私家葡萄園精選年份的美酒薈萃。\",\"香檳最後的貼標和修飾工作，也完全由人手細心地在瓶上雕刻、貼印酒標。\",\"從釀造到裝瓶，由 Cattier 家族一個僅 8 人的團隊純人手完成，走的是質高量少的精品路線。\",\"黑桃 A 系列有 3 款香檳：黃金香檳（由夏多內、黑皮諾和莫尼耶皮諾勾兌）、粉金香檳（由紅葡萄品種釀造，代表粉紅香檳的最高標準）、白金香檳（產量每年只有 5000 瓶，眾多酒評家眼中的五星級香檳）。\",\"ADB Gold 銷售話術：選自 40%夏多內、40%黑皮諾、20%皮諾曼尼，黃檸檬色澤，濃郁多層次，有蜜桃、梨子及花香，曾獲 2009 國際香檳大賽冠軍。\",\"ADB Pink 銷售話術：選自 50%黑皮諾、40%皮諾曼尼、10%夏多內，呈現優雅的鮭魚粉紅色；採用種植於 Montagne de Reims 的古老葡萄藤黑皮諾。\",\"ADB Silver 銷售話術：使用 100% Chardonnay 釀造，極為限量，酒體更加優雅細緻，有極佳陳年體質。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"年份\",\"甜度\"],\"rows\":[[\"ADB Gold 0.75L\",\"750ML\",\"12.5％\",\"無\",\"BRUT\"],[\"ADB Pink\",\"750ML\",\"12.5％\",\"無\",\"BRUT\"],[\"ADB Silver\",\"750ML\",\"12.5％\",\"無\",\"BRUT\"]]}},{\"h\":\"BOTTEGA（寶緹嘉）\",\"notes\":[\"四個世紀的葡萄酒傳承，歷史可追溯至 17 世紀（約西元 1600 年），祖先 Andrea 開始在義大利 Veneto（威尼托）丘陵種植葡萄。\",\"這片土地正是今日 Prosecco Superiore 的核心產區。\",\"20 世紀家族開始發展 Grappa（義大利葡萄渣白蘭地）的蒸餾技術。\",\"1977 年，擁有超過 30 年蒸餾經驗的 Aldo Bottega 與妻子 Rosina 正式創立 Distilleria Bottega。\",\"1983 年 Aldo Bottega 去世後，由兒子 Sandro Bottega 與家族成員接手經營。\",\"品牌成長後也開始釀造 Prosecco 氣泡酒、靜態葡萄酒、利口酒。\",\"目前產品已出口到全球超過 150 個國家。\",\"金色鏡面瓶身兩個目的：保護酒質（金屬塗層可減少光線照射，降低紫外線對酒液的影響）、展現義大利設計美學。\",\"Poeti Prosecco Gold：Prosecco DOC 氣泡酒，Poeti 在義大利文中意為「詩人」，採用 100% Glera 葡萄釀造，槽式法（Charmat Method）保留新鮮果香與細緻氣泡。\",\"Amore Petalo Rose Manzoni Moscato：採用珍稀的 Manzoni Moscato 葡萄釀造，酒精濃度只有約 7%，是旗下最受歡迎的甜型粉紅氣泡酒之一。\",\"Bottega Stardust：Prosecco DOC，瓶身鑲滿水晶般的裝飾宛如夜空星光故名 Stardust，來自義大利 Veneto Treviso 丘陵地帶，葡萄品種為 Glera。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"年份\",\"甜度（教材原文）\"],\"rows\":[[\"Poeti Prosecco Gold\",\"750ML\",\"11％\",\"無\",\"Sweet\"],[\"Amore Petalo Rose Manzoni Moscato\",\"750ML\",\"7％\",\"無\",\"BRUT（教材原文，產品風格敘述為甜型）\"],[\"Bottega Stardust\",\"750ML\",\"11.5％\",\"無\",\"BRUT\"]]}},{\"h\":\"KRUG（庫克）\",\"notes\":[\"KRUG 創立於 1843 年，由創辦人約瑟夫．庫克（Joseph Krug）在法國 Reims 創立。\",\"創辦理念：真正偉大的香檳，不應該受到年份好壞的限制，而是每一年都應該呈現最卓越的品質。\",\"不依賴單一年份，而是透過不同年份、不同葡萄園、不同品種的基酒調配，這就是今天 Grande Cuvée（庫克陳年特釀）的核心理念。\",\"名言：Every Krug Grande Cuvée is the fullest expression of Champagne.（每一瓶 Grande Cuvée 都代表香檳最完整的表現。）\",\"每年混調超過百種不同基酒，部分基酒甚至陳放超過 15 年以上。\",\"小木桶發酵是 KRUG 最有特色的地方；大部分香檳酒莊使用不鏽鋼槽，KRUG 很多基酒仍使用 225 公升法國橡木桶進行第一次發酵。\",\"小木桶發酵優點：讓酒業能有更多氧氣交換、增加酒體層次、提高陳年能力，還能保留葡萄園特色。\",\"庫克的酒窖裡儲存了約 150 種不同的陳釀，橫跨了 15 個不同的年份。\",\"調配無年份香檳時，庫克一般使用超過一百種存酒。\",\"每一瓶庫克香檳都至少要在酒窖耐心地等待六年，才能在眾人面前呈現。\",\"KRUG Grande Cuvee 產品風格：挑選 10 個以上不同年份且超過 150 種基酒混合釀，至少窖藏陳年 6 年以上才上市。\",\"Krug Rose：庫克最具代表性的粉紅香檳，由數十款基酒調和而成。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"年份\",\"甜度\"],\"rows\":[[\"KRUG Grande Cuvee\",\"750ML\",\"12.5％\",\"無\",\"BRUT\"],[\"Krug Rose\",\"750ML\",\"12.5％\",\"無\",\"BRUT\"]]}},{\"h\":\"Veuve Clicquot Ponsardin（凱歌）\",\"notes\":[\"歷史可追溯到 1772 年，銀行家出身的 Philippe Clicquot 在法國北部創辦以自己姓氏命名的釀酒廠，取名 Clicquot 凱歌酒莊。\",\"1798 年 Philippe Clicquot 之子 Francois 與 Barbe Nicole Ponsardin 結為連理。\",\"1805 年 Francois 英年早逝，年僅 27 歲的遺孀凱歌夫人毅然繼承先夫事業，創立了 Veuve Clicquot Ponsardin 酒莊。\",\"Veuve 在法語中為寡婦的意思。\",\"1775 年凱歌酒莊創造出世界第一款粉紅香檳（教材原文），從此成為粉紅香檳釀製的指標。\",\"在凱歌香檳酒莊裡，無年份香檳至少要陳年 30 個月，而年份香檳的陳年至少需要 6 年以上。\",\"凱歌香檳主要採用昂貴的黑皮諾葡萄，帶給香檳豐富的層次和濃郁口感，再與夏多內葡萄的精緻清新結合。\",\"凱歌夫人於 1816 年發明了有效去除沉澱的轉瓶法。\",\"她發明了用燦爛的金黃色作為凱歌香檳的標誌，在 200 年前大部分酒標都選用黯啞色調時是一項創舉。\",\"凱歌夫人被譽為「香檳貴婦」(Grand Dame of Champagne)。\",\"凱歌夫人名言：只有一種品質－最好的品質（Only one Quality, the finest!）。\",\"年份香檳三準則：1、只採用法國葡萄分級制度中頂級、一級葡萄園的葡萄；2、高達 70%左右的紅葡萄比例；3、高於法定陳年時間（凱歌年份香檳皆至少陳年 6 年以上）。\",\"VCP Yellow label：黑皮諾 50% 提供酒體與深度、夏多內 30% 帶來優雅與清新酸度、皮諾莫尼耶 20% 增添圓潤果香。\",\"VCP Rose：延續 Yellow Label 風格再加入自釀紅酒（Pinot Noir）；是香檳史上第一家於 1818 年以調和法（Blending）推出商業化粉紅香檳的酒莊，這項工藝至今仍是香檳區最普遍的 Rosé 製作方式。\",\"VCP La Grande Dame 2015：酒莊旗艦年份香檳（Prestige Cuvée），品牌最高等級代表作，以約 90% Pinot Noir 釀造。\",\"VCP La Grande Dame Rose 2012：旗艦年份粉紅香檳，同樣以約 90% Pinot Noir 為核心；2012 是香檳區公認近二十年最偉大的年份之一。\",\"La Grande Dame（偉大的女士）是為了紀念品牌靈魂人物 Barbe-Nicole Ponsardin（人稱 Madame Clicquot）。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"年份（教材原文）\",\"甜度\"],\"rows\":[[\"VCP Yellow label\",\"750ML\",\"12.5％\",\"無\",\"BRUT\"],[\"VCP Rose\",\"750ML\",\"12.5％\",\"無\",\"BRUT\"],[\"VCP La Grande Dame 2015\",\"750ML\",\"12.5％\",\"無（教材原文）\",\"BRUT\"],[\"VCP La Grande Dame Rose 2012\",\"750ML\",\"12.5％\",\"無（教材原文）\",\"BRUT\"]]}},{\"h\":\"MOET&CHANDON（酩悅）\",\"notes\":[\"擁有 270 年釀酒傳統的酩悅香檳，曾因法皇拿破崙的喜愛而贏得 Imperial（皇室香檳）的美譽。\",\"酩悅香檳已成為法國最具國際知名度的香檳。\",\"酒廠創始於 1743 年，創始人 Claude Moet；傳說中有「葡萄之父」之稱的 Dom Perigono（教材原文）發明了香檳之後，Claude Moet 即著手試釀。\",\"其孫子 Jean-Remy Moet 掌管時認識了一位青年軍官，就是後來的拿破崙一世，他也相當喜愛酩悅香檳，酒莊的名字才從此揚開。\",\"Jean-Remy Moe 死後，兒子 Victor Moet 與女婿 Pierre-Gabriel Chandon 共同繼承酒莊，因此將酒莊改名為 Moet & Chandon。\",\"酩悅酒莊所擁有的葡萄園約為 1000 多公頃，其中 50%為特級葡萄園，25%為一級葡萄園。\",\"M-C Res. Imperial：Imperial 是酩悅香檳酒廠的旗艦商品，完整呈現三種香檳葡萄品種所代表的多樣性；調配 30%至 40%黑皮諾、30%至 40%皮諾蔓尼、20%至 30%夏多內，並使用 20%~30% 珍貴典藏酒。\",\"M-C Res. Im. Rose：黑皮諾 40%至 50%（其中 10%為紅酒）、皮諾曼尼 30%至 40%（其中 10%為紅酒）、夏多內 20%至 30%，並使用比例 20%以上的珍貴窖藏酒。\",\"Moet-Chandon Vintage 2016：2016 年是香檳區的優秀年份，春季溫暖、夏季涼爽且乾燥；比例為黑皮諾約 40-45%、皮諾曼尼約 10-15%、夏多內 40-45%。\",\"M-C ICE Imperial：全球首款專為加入冰塊飲用而設計的香檳，甜度 Demi-Sec；Pinot Noir 約 40–50%、Meunier 約 30–40%、Chardonnay 約 10–20%。\",\"M-C ICE Res. Im. Rose：甜度 Demi-Sec；Pinot Noir 約 45–55%、Pinot Meunier 約 35–45%、Chardonnay 約 5–10%，加 10% 的紅葡萄酒自然染色。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"年份\",\"甜度\"],\"rows\":[[\"M-C Res. Imperial I 0.75\",\"750ML\",\"12％\",\"無\",\"BRUT\"],[\"M-C Res. Im. Rose\",\"750ML\",\"12％\",\"無\",\"BRUT\"],[\"Moet-Chandon Vintage2016\",\"750ML\",\"12％\",\"無（教材原文）\",\"BRUT\"],[\"M-C ICE Imperial\",\"750ML\",\"12％\",\"無\",\"Demi-Sec\"],[\"M-C ICE Res. Im. Rose\",\"750ML\",\"12％\",\"無\",\"Demi-Sec\"]]}},{\"h\":\"Dom Pérignon（唐培里儂）\",\"notes\":[\"Dom Pérignon 隸屬於 Moët & Chandon，酒名取自 17 世紀法國修道士 Dom Pierre Pérignon。\",\"這位法國修道士並不是 Dom Pérignon 香檳品牌的創辦人；1668 年他被任命為 Abbey of Hautvillers 的酒窖管理者，負責管理葡萄園與釀酒工作。\",\"很多人以為 Dom Pérignon「發明了香檳」，其實這是一個流傳已久的誤解；他並沒有發明瓶中氣泡，而是在提升葡萄品質、混釀技術與釀造管理方面做出重大貢獻，因此被尊稱為「香檳之父」。\",\"它不是一個獨立酒莊，而是 Moët & Chandon 最頂級的 Prestige Cuvée（旗艦香檳）。\",\"唐培里儂特色：1. 所有旗下香檳酒都是年份葡萄酒；2. 經過獨特調配製成；3. 將白香檳與粉紅香檳進行調配，使黑、白葡萄達到完美平衡；4. 原料選用法國香檳區葡萄；5. 每個流程都嚴格遵循傳統；6. 保證長達 7 年的醞釀過程。\",\"Dom Perignon Vintage 2013：葡萄比例約 51% Pinot Noir 和 49% Chardonnay；2013 年收成較晚（10 月），葡萄成熟度高卻仍保留酸度；獲得 Wine Spectator 96、Parker 95 的高評價。\",\"Dom Perignon P2 2006：葡萄比例約 52% Pinot Noir、48% Chardonnay；P2 = Plénitude 2，在酒糟中再熟成約 15–16 年，是所謂「第二巔峰」酒款，摘得多家 97 分頂級評價。\",\"Dom Perignon ROSE 2009：葡萄比例約 56% Pinot Noir、44% Chardonnay，另含約 15% 靜態紅酒以增加色澤與結構，獲得多項 95–98 分高分肯定。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"年份（教材原文）\",\"甜度\",\"葡萄比例\"],\"rows\":[[\"Dom Perignon Vintage 2013\",\"750ML\",\"12.5％\",\"無（教材原文）\",\"BRUT\",\"約 51% Pinot Noir、49% Chardonnay\"],[\"Dom Perignon P2 2006\",\"750ML\",\"12.5％\",\"無（教材原文）\",\"BRUT\",\"約 52% Pinot Noir、48% Chardonnay\"],[\"Dom Perignon ROSE 2009\",\"750ML\",\"12.5％\",\"無（教材原文）\",\"BRUT\",\"約 56% Pinot Noir、44% Chardonnay，另含約 15% 靜態紅酒\"]]}},{\"h\":\"Perrier-Jouet（皮耶爵）\",\"notes\":[\"皮耶爵香檳酒莊於 1811 年創建於艾伯內的香檳大道。\",\"1847 年開始決定大幅減少添加於特釀中的糖分，為了凸顯混釀的精緻品質。\",\"1854 年成功推出第一支正統的 Brut 香檳。\",\"1902 年酒廠負責人 Henri Gallice 邀請新藝術運動的大師級人物 Emile Galle 為皮耶爵設計酒瓶，華麗高雅的秋牡丹圖騰加上金色的上釉藤蔓花紋裝飾，成為日後「花樣年華」香檳瓶身設計的藝術創作靈感。\",\"1969 年成功上市的「花樣年華 Belle Epoque」香檳，以花香檳的暱名廣受美國市場喜愛。\",\"皮耶爵成為歐洲皇室的最愛，包括英國維多利亞女王、法國拿破崙三世，及摩納哥王妃葛莉絲凱莉。\",\"2011 年更成為摩納哥親王亞爾伯特二世的婚宴御用香檳。\",\"Perrier Jouet Blason Rose：精選 50%夏多內加上 45%黑皮諾及 5%皮諾曼尼混釀而成，窖藏熟成 6 年以上；試飲溫度 10~12 度，可搭配紅肉料理及甜點。\",\"Perrier Jouet Belle Epoque Rose：50%選自優質葡萄產區的特級黑皮諾葡萄，及 25%皮諾曼尼、25%夏多內白葡萄混釀；鮭魚色澤；適飲溫度 10~12 度，適合搭配雞鴨、鵝等各式排餐。\",\"Perrier Jouet Belle Epoque Brut：40%特級黑皮諾、40%皮諾曼尼、20%夏多內白葡萄混釀；酒體呈淡金黃色帶點辛香料香氣；適飲溫度 7~10 度。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"甜度\",\"葡萄比例\",\"適飲溫度\"],\"rows\":[[\"Perrier Jouet Blason Rose\",\"750ML\",\"12％\",\"BRUT\",\"50%夏多內、45%黑皮諾、5%皮諾曼尼\",\"10~12 度\"],[\"Perrier Jouet Belle Epoque Rose\",\"750ML\",\"12％\",\"BRUT\",\"50%特級黑皮諾、25%皮諾曼尼、25%夏多內\",\"10~12 度\"],[\"Perrier Jouet Belle Epoque Brut\",\"750ML\",\"12％\",\"BRUT\",\"40%特級黑皮諾、40%皮諾曼尼、20%夏多內\",\"7~10 度\"]]}},{\"h\":\"PELLER ESTATES（培勒酒莊）\",\"notes\":[\"培勒酒莊（Peller Estates）又譯名為啄木鳥莊園，位於加拿大安大略產區（Ontario）的尼亞加拉半島（Niagara Peninsula），是該產區的頂級酒莊。\",\"1927 年，安德魯．培勒從匈牙利遠渡重洋來到了加拿大。\",\"他決定在英屬哥倫比亞產區（British Columbia）的「Okanagan」山谷種植他的第一片葡萄園。\",\"安德魯培勒和他的兒子喬伊（Joe）於 1969 年在安大略省購得一個酒廠並獲得了釀酒執照。\",\"如今酒莊由家族第三代約翰培勒（John Peller）掌管。\",\"冰酒釀酒方法：生產冰酒的葡萄在十月份已經完全成熟，被罩上一層保護網，原封不動地留在葡萄樹上，直到加拿大冬天的第一次冰凍期。\",\"在這期間葡萄被自然脫水，使葡萄汁中的風味、香氣、糖和酸度得到濃縮。\",\"加拿大十二月和一月零下 10℃以下的低溫把葡萄凍成固體，使手工採摘壓榨的難度大大增加。\",\"濃縮葡萄汁的產量也只有正常產量的五分之一，因為大多數的水分在壓榨過程中都以冰晶的形式析出。\",\"VQA 對冰酒（icewine）的定義是：利用在零下 8℃以下，在葡萄樹上自然冰凍的葡萄釀造的葡萄酒；葡萄在被凍成固體狀時才壓榨，在壓榨過程中外界溫度必須保持在零下 8℃以下。\",\"「Katie Dickieson」是酒莊的首席釀酒師，曾在倫敦的國際葡萄酒與烈酒（International Wine & Spirit）競賽中獲得加拿大最佳釀酒師的稱號。\",\"ICE Cuvee Classic：手工挑選夏多內及黑皮諾葡萄釀製的氣泡酒，除渣時加入 Vidal Icewine(110ml) 增強風味；適飲溫度為 8 至 10 度。\",\"ICE Cuvee Roes：粉紅氣泡酒，手工挑選夏多內和黑皮諾所釀製的基酒，加入 Vidal Icewine(110ml) 供給甜度，採用法國香檳傳統瓶中二次發酵的天然氣泡酒。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度數\",\"年份\",\"甜度\"],\"rows\":[[\"ICE Cuvee Classic\",\"750ML\",\"12％\",\"無\",\"DOLCE\"],[\"ICE Cuvee Roes\",\"750ML\",\"12％\",\"無\",\"DOLCE\"]]}}],\"card\":[\"只有法國香檳區的氣泡酒可稱香檳\",\"香檳區在巴黎東北約200公里、全法最北\",\"香檳區土質為優良白堊土\",\"三品種：夏多內、黑皮諾、皮諾莫尼耶\",\"最高級香檳只取第一次壓榨純汁Cuvee\",\"黑中白100%黑葡萄；白中白100%夏多內\",\"甜度：Extra Brut極不甜、Brut不甜\",\"Sec略甜、Demi-Sec微甜、Doux甜\",\"氣泡來自裝瓶後第二次發酵（加糖與酵母）\",\"轉瓶師一天約轉動5萬瓶以上\",\"除渣：瓶口插入-30℃鹽水凝結後噴出\",\"非年份香檳佔總產量比例最高、較親民\",\"年份香檳瓶中陳年約4-5年以上才上市\",\"適飲溫度：非年份7～10℃、年份10～12℃\",\"冰桶冰鎮約20～30分鐘即達適飲溫度\",\"細長型或鬱金香高腳杯最襯香檳\",\"750ml氣泡酒約5～6個大氣壓\",\"所有香檳都是氣泡酒，但反之不然\"],\"quiz\":[{\"q\":\"依教材，只有產自哪裡的氣泡葡萄酒才能使用「Champange」之名？\",\"o\":[\"義大利威尼托\",\"法國香檳區\",\"西班牙加泰隆尼亞\",\"加拿大安大略\"],\"a\":1,\"why\":\"教材「認識香檳」：只有產自法國香檳區（Champange）內的氣泡葡萄酒才能使用該名。\"},{\"q\":\"教材中香檳區的地理位置為？\",\"o\":[\"巴黎東北方約 200 公里處\",\"巴黎西南方約 200 公里處\",\"巴黎東北方約 100 公里處\",\"巴黎正北方約 500 公里處\"],\"a\":0,\"why\":\"教材「法國香檳產區」：位在巴黎東北方約 200 公里處，算是全法國位置最北的葡萄園。\"},{\"q\":\"教材提到香檳區分佈廣泛的優良土質是哪一種？\",\"o\":[\"花崗岩土\",\"火山灰土\",\"白堊土\",\"礫石土\"],\"a\":2,\"why\":\"教材「法國香檳產區」：分佈廣泛的優良白堊土質令葡萄擁有恰到好處的熟度。\"},{\"q\":\"依教材，最高級的香檳使用哪一道壓榨的葡萄汁釀造？\",\"o\":[\"第三次壓榨\",\"第二次壓榨\",\"混合三次壓榨汁\",\"僅第一次壓榨的葡萄純汁（Cuvee）\"],\"a\":3,\"why\":\"教材「製造香檳的過程」：一般葡萄約可壓汁三次，最高級香檳皆僅取第一次壓榨的葡萄純汁（Cuvee）。\"},{\"q\":\"下列哪一項是教材所列製造香檳的三種釀酒葡萄之一？\",\"o\":[\"皮諾莫尼耶 Pinot Meunier\",\"Glera\",\"Vidal\",\"Manzoni Moscato\"],\"a\":0,\"why\":\"教材「製造香檳的葡萄種類」：夏多內、黑皮諾、皮諾莫尼耶三種；Glera、Vidal、Manzoni Moscato 在教材中屬氣泡酒／冰酒品種。\"},{\"q\":\"依教材，夏多內比例越高的香檳風味為何？\",\"o\":[\"嚴謹厚實的結構、強勁醇郁\",\"越是清新爽口，帶有香濃的果香與蜂蜜香\",\"甜美果香並發揮催化作用\",\"辛香料香氣明顯\"],\"a\":1,\"why\":\"教材葡萄品種表：夏多內比例越高，風味越清新爽口，帶有香濃的果香與蜂蜜香。\"},{\"q\":\"「Blanc de Blancs（白中白香檳）」依教材的定義是？\",\"o\":[\"100%黑葡萄釀製\",\"紅白基酒調配\",\"加入少量紅酒調配\",\"僅用單一白葡萄夏多內 Chardonnay 所釀製\"],\"a\":3,\"why\":\"教材「香檳以葡萄的比例可分為」：白中白香檳僅用單一白葡萄夏多內所釀製。\"},{\"q\":\"教材所列香檳甜度分級中，「極不甜」是哪一級？\",\"o\":[\"Brut\",\"Sec\",\"Extra Brut\",\"Demi-Sec\"],\"a\":2,\"why\":\"教材「香檳的甜度區分」：Extra Brut 為極不甜，Brut 為不甜。\"},{\"q\":\"依教材甜度表，「Demi-Sec」的中文對應與建議搭配為？\",\"o\":[\"略甜；搭配禽類、肉類菜肴\",\"微甜；超適合配泰國菜的又酸又辣\",\"甜；適宜搭配甜點、麻辣火鍋\",\"不甜；搭配前菜或海鮮類\"],\"a\":1,\"why\":\"教材甜度表：Demi-Sec 微甜，超適合配泰國菜的又酸又辣。\"},{\"q\":\"依教材甜度表，「適宜搭配甜點、麻辣火鍋等」的是哪一級？\",\"o\":[\"Doux（甜）\",\"Sec（略甜）\",\"Brut（不甜）\",\"Extra Brut（極不甜）\"],\"a\":0,\"why\":\"教材甜度表：Doux 為甜，適宜搭配甜點、麻辣火鍋等。\"},{\"q\":\"依教材，香檳的氣泡主要發生在哪個階段？\",\"o\":[\"壓榨果汁時\",\"除渣補液時\",\"人工充填二氧化碳時\",\"裝瓶後的第二次發酵過程裡\"],\"a\":3,\"why\":\"教材「香檳氣泡的秘密」：氣泡主要發生在裝瓶後的第二次發酵，釀酒者將糖和酵母添加入酒中。\"},{\"q\":\"依教材，一位專業的「轉瓶師」一天約需轉動多少瓶香檳？\",\"o\":[\"5 千瓶以上\",\"1 萬瓶以上\",\"5 萬瓶以上\",\"10 萬瓶以上\"],\"a\":2,\"why\":\"教材「香檳氣泡的秘密」：一位專業的轉瓶師一天約需轉動 5 萬瓶以上的香檳。\"},{\"q\":\"依教材，目前普遍採用的除渣（去除沈澱渣滓）方法是？\",\"o\":[\"以離心機分離\",\"過濾後重新裝瓶\",\"加入澄清劑沉降\",\"將瓶口插入 -30℃ 的鹽水中使之凝結，再以瓶中壓力噴出\"],\"a\":3,\"why\":\"教材「香檳氣泡的秘密」：瓶口插入 -30℃ 鹽水凝結，暫時除去瓶蓋，瓶中壓力將凝結沈澱物推擠噴飛出瓶外。\"},{\"q\":\"依教材，必須遵守什麼才是真正的法國香檳酒？\",\"o\":[\"槽式法（Charmat Method）\",\"瓶內發酵（Bottl Fermentted，教材原文）\",\"人工充填二氧化碳\",\"橡木桶陳年\"],\"a\":1,\"why\":\"教材「香檳氣泡的秘密」：必須遵守瓶內發酵（Bottl Fermentted）才是真正的法國香檳酒。\"},{\"q\":\"依教材，特選年份香檳通常要在瓶中陳年熟成多久以上才出廠上市？\",\"o\":[\"約 4-5 年以上\",\"約 30 個月\",\"約 7 年\",\"約 15 年\"],\"a\":0,\"why\":\"教材「香檳依有無標示年標可分為」：年份香檳通常要在瓶中陳年熟成約 4-5 年以上。\"},{\"q\":\"依教材，在香檳總產量中所佔比例最高、價格較平易近人的是？\",\"o\":[\"年份香檳\",\"白中白香檳\",\"非年份香檳\",\"粉紅香檳\"],\"a\":2,\"why\":\"教材：非年份香檳在香檳總產量中所佔比例最高，價格較平易近人，最受一般消費者青睞。\"},{\"q\":\"依教材，非年份香檳與年份香檳的最佳飲用溫度分別為？\",\"o\":[\"5～7℃ 與 7～10℃\",\"10～12℃ 與 12～15℃\",\"8～10℃ 與 10～12℃\",\"7～10℃ 與 10～12℃\"],\"a\":3,\"why\":\"教材「如何飲用香檳？」：非年份約 7～10℃，年份約 10～12℃。\"},{\"q\":\"依教材，飲用前將香檳瓶放入置了冰塊的冰桶中冰鎮多久即可達適飲溫度？\",\"o\":[\"約 20～30 分鐘\",\"約 5～10 分鐘\",\"約 45～60 分鐘\",\"約 2 小時\"],\"a\":0,\"why\":\"教材「如何飲用香檳？」：冰桶中冰鎮約 20～30 分鐘即可達適飲溫度。\"},{\"q\":\"依教材狹義定義，氣泡來源為「天然二氧化碳」的常見酒款為下列哪一組？\",\"o\":[\"部分低價氣泡酒\",\"Grappa、利口酒、靜態酒\",\"Champagne、Cava、Prosecco\",\"Icewine、Vidal、Dolce\"],\"a\":2,\"why\":\"教材氣泡來源表：天然二氧化碳（第二次發酵自然產生並保留於酒中）常見酒款為 Champagne、Cava、Prosecco。\"},{\"q\":\"依教材，一瓶 750ml 的氣泡酒大約含有多少大氣壓？\",\"o\":[\"2～3 個大氣壓\",\"1～2 個大氣壓\",\"8～10 個大氣壓\",\"5～6 個大氣壓\"],\"a\":3,\"why\":\"教材延伸小知識：一瓶 750ml 氣泡酒約含 5～6 個大氣壓，接近汽車輪胎胎壓的 2～3 倍。\"},{\"q\":\"依教材，關於香檳與氣泡酒的正確概念是？\",\"o\":[\"所有氣泡酒都是香檳\",\"所有香檳都是氣泡酒，但不是所有氣泡酒都是香檳\",\"香檳與氣泡酒是兩種不相關的酒\",\"只有人工充填二氧化碳的才叫氣泡酒\"],\"a\":1,\"why\":\"教材「香檳與氣泡酒的關係」：所有香檳都是氣泡酒，但不是所有氣泡酒都是香檳。\"},{\"q\":\"依教材，ADB（黑桃王香檳）由哪個家族的酒廠釀造？\",\"o\":[\"Bottega 家族\",\"Clicquot 家族\",\"Peller 家族\",\"Cattier 家族\"],\"a\":3,\"why\":\"教材 ADB 品牌故事：由知名法國香檳廠 Cattier 釀造，現已是第 10 代傳人掌舵。\"},{\"q\":\"依教材，BOTTEGA 的 Poeti Prosecco Gold 使用什麼葡萄與製法？\",\"o\":[\"100% Glera、瓶中二次發酵\",\"100% Chardonnay、槽式法\",\"100% Glera、槽式法（Charmat Method）\",\"100% Pinot Noir、槽式法\"],\"a\":2,\"why\":\"教材 BOTTEGA 品項：採用 100% Glera 葡萄釀造，以槽式法（Charmat Method）保留新鮮果香與細緻氣泡。\"},{\"q\":\"依教材，KRUG 的品牌特色包含使用多大的法國橡木桶進行第一次發酵、以及至少陳年幾年？\",\"o\":[\"500 公升橡木桶、至少 4 年\",\"225 公升橡木桶、至少 6 年以上\",\"225 公升橡木桶、至少 15 年\",\"不鏽鋼槽、至少 30 個月\"],\"a\":1,\"why\":\"教材 KRUG：很多基酒使用 225 公升法國橡木桶進行第一次發酵，每一瓶至少在酒窖等待六年。\"},{\"q\":\"依教材，凱歌夫人於哪一年發明了有效去除沉澱的轉瓶法？\",\"o\":[\"1772 年\",\"1805 年\",\"1818 年\",\"1816 年\"],\"a\":3,\"why\":\"教材 Veuve Clicquot：凱歌夫人於 1816 年發明了有效去除沉澱的轉瓶法。\"},{\"q\":\"依教材，凱歌酒莊的無年份香檳至少要陳年多久？\",\"o\":[\"至少 30 個月\",\"至少 6 年\",\"至少 4-5 年\",\"至少 7 年\"],\"a\":0,\"why\":\"教材 Veuve Clicquot：無年份香檳至少要陳年 30 個月，年份香檳至少需要 6 年以上。\"},{\"q\":\"依教材，酩悅（MOET&CHANDON）酒廠創始於哪一年、擁有多少年釀酒傳統？\",\"o\":[\"1811 年、200 年\",\"1843 年、180 年\",\"1743 年、270 年\",\"1763 年、250 年\"],\"a\":2,\"why\":\"教材 MOET&CHANDON：酒廠創始於 1743 年，擁有 270 年釀酒傳統。\"},{\"q\":\"依教材，Dom Pérignon 的定位與醞釀時間為？\",\"o\":[\"獨立酒莊，醞釀 4-5 年\",\"Moët & Chandon 最頂級的 Prestige Cuvée，保證長達 7 年的醞釀過程\",\"Veuve Clicquot 的旗艦款，陳年 6 年\",\"KRUG 的旗艦款，陳年 15 年\"],\"a\":1,\"why\":\"教材 Dom Pérignon：不是獨立酒莊，而是 Moët & Chandon 最頂級的 Prestige Cuvée，保證長達 7 年的醞釀過程。\"},{\"q\":\"依教材，Perrier-Jouet（皮耶爵）在哪一年推出史上第一款 BRUT（不甜）香檳？\",\"o\":[\"1854 年\",\"1847 年\",\"1811 年\",\"1902 年\"],\"a\":0,\"why\":\"教材 Perrier-Jouet 品牌特色：1854 年推出史上第一款 BRUT（不甜）香檳。\"},{\"q\":\"依教材，VQA 對冰酒（icewine）的定義是在幾度以下、於葡萄樹上自然冰凍的葡萄所釀造？\",\"o\":[\"零下 10℃以下\",\"零下 8℃以下\",\"零下 30℃以下\",\"零下 5℃以下\"],\"a\":1,\"why\":\"教材 PELLER ESTATES：VQA 定義為利用零下 8℃以下在葡萄樹上自然冰凍的葡萄釀造，壓榨過程外界溫度須保持零下 8℃以下。\"}]},\"白蘭地\":{\"subject\":\"白蘭地\",\"sections\":[{\"h\":\"白蘭地的定義與基本概念\",\"notes\":[\"白蘭地是英文「Brandy」一詞的中文譯音，該詞由荷蘭文演化而來，意思是「可燃燒的酒」。\",\"白蘭地是以水果為原料，經過發酵、蒸餾、儲藏後釀造而成的蒸餾酒。\",\"新蒸餾出來未經陳年的白蘭地是無色的，酒精濃度在 40-43 度之間，香氣低、味道辛辣。\",\"要經過在橡木桶中陳年來提高品質，一般至少要儲存兩年以上，否則白蘭地的名稱上要註明「未成熟」。\",\"現今所說的白蘭地均是指以葡萄為原料釀成的白蘭地。\",\"其他水果原料釀成的白蘭地應加上水果的名稱，例如「桃子白蘭地」、「草莓白蘭地」。\",\"除非有明確的定義，否則『白蘭地』即代表葡萄白蘭地。\"]},{\"h\":\"白蘭地香氣的三大來源\",\"notes\":[\"白蘭地獨特且優雅的香氣源於三大方面：一是原料（葡萄或水果）、二是蒸餾工藝、三是橡木桶熟成（Maturation）。\",\"葡萄品種的芳香是白蘭地香氣的主要來源，不是所有的葡萄品種都適合加工為白蘭地。\",\"釀製白蘭地一般採用白葡萄，特點為：糖分低、酸度高、香度低，抗病害性強。\"]},{\"h\":\"釀酒葡萄的四大特性要求\",\"notes\":[\"高酸度（High Acidity）：酸度有助於在蒸餾過程中保留果香與清爽感，也有助於成品穩定熟成，高酸的酒液能延長白蘭地的陳年潛力。\",\"低糖度（Low Sugar）：天然糖分含量較低，發酵後產出的基酒酒精濃度較低，通常在 8–10% ABV 之間，讓蒸餾後的風味更細緻集中，避免產生強烈醇味或雜味。\",\"香氣中性、不過度奔放：香氣較「內斂」的品種，如 Ugni Blanc，不會與蒸餾或橡木桶的香氣發生衝突，反而能提升整體複雜度與融合感。\",\"高產量與強健性（耐病、耐旱）：白蘭地用葡萄多種植於廣大產區，如法國西南部，其品種須具有穩定、高產與抗病蟲的特性。\"],\"table\":{\"head\":[\"特性\",\"說明重點\"],\"rows\":[[\"高酸度 High Acidity\",\"保留果香與清爽感、穩定熟成、延長陳年潛力\"],[\"低糖度 Low Sugar\",\"基酒酒精濃度較低，通常 8–10% ABV\"],[\"香氣中性、不過度奔放\",\"如 Ugni Blanc，不與蒸餾或橡木桶香氣衝突\"],[\"高產量與強健性\",\"耐病、耐旱，適合法國西南部等廣大產區\"]]}},{\"h\":\"釀製白蘭地的主要葡萄品種\",\"notes\":[\"由於白福爾（Folle Blanche）的種植時間較長，現今逐漸被品質與產量皆穩定的白玉霓（Ugni Blanc）取代。\",\"Baco Blanc 為 Folle Blanche × Noah 混種，是雅馬邑獨有品種之一。\"],\"table\":{\"head\":[\"品種\",\"特色\"],\"rows\":[[\"白福爾 Folle Blanche\",\"原始干邑品種，香氣較豐富、口感柔和，但對病害敏感，現多用於雅馬邑與小規模生產\"],[\"白玉霓 Ugni Blanc\",\"最主流品種（占干邑 90% 以上），高酸低糖，香氣乾淨，釀造基酒清新，適合長時間熟成\"],[\"哥倫白 Colombard\",\"香氣較強，帶花香與果香，增添白蘭地的香氣複雜度，常與 Ugni Blanc 混釀\"],[\"Baco Blanc（僅雅馬邑）\",\"Folle Blanche × Noah 混種，帶濃郁果香與結構感，雅馬邑獨有品種之一\"]]}},{\"h\":\"少量飲用白蘭地對人體的益處\",\"notes\":[\"促進血液循環與心血管健康：白蘭地含有來自葡萄皮的多酚類，具抗氧化作用，有助於減少血管硬化風險、改善微血管循環、抑制壞膽固醇（LDL）氧化。\",\"有助消化：作為餐後酒，可刺激胃酸分泌與腸胃蠕動，傳統上常被用於減緩脹氣、協助油膩食物的消化吸收、提高食慾（尤其在年長者）。\",\"放鬆與減壓效果：白蘭地中的酒精及其香氣能促進血清素釋放，對輕微壓力與焦慮有鎮定效果；品飲本身也能成為儀式感的一部分。\",\"天然抗氧化物的輕微作用：熟成於橡木桶中會釋出微量天然單寧、香草素等抗氧化物質，雖然濃度低，但與紅酒相似，可能具自由基中和能力。\",\"適量飲用白蘭地能促進消化、幫助放鬆，並可能提供輕微的抗氧化益處，但其營養價值遠不如葡萄本身，應以節制為前提。\"],\"table\":{\"head\":[\"項目\",\"說明\"],\"rows\":[[\"建議飲用量\",\"「適量品飲、理性飲酒」，避免過量傷肝、增加心血管風險\"],[\"禁忌人群\",\"孕婦、慢性肝病患者、服用精神藥物者應避免飲用\"],[\"與葡萄營養不同\",\"蒸餾後的白蘭地幾乎不含膳食纖維與維生素 C 等葡萄中的主要營養素\"]]}},{\"h\":\"干邑 Cognac：世界最知名的葡萄白蘭地之都\",\"notes\":[\"干邑位於法國西南部的夏朗德地區（Charente），以「Cognac」這座小鎮為命名中心，是全球最具指標性的白蘭地產區。\",\"只有在這個地區、且依循法定規範釀製的葡萄蒸餾酒，才能稱為 Cognac。\",\"此地氣候溫和、土壤富含石灰質，特別適合栽種 Ugni Blanc 葡萄。\",\"干邑的釀製方式採雙次壺式蒸餾，蒸餾後酒精濃度較高，風味清澈純淨。\",\"干邑的風格以優雅、圓潤、果香平衡著稱，橡木桶熟成賦予其香草、橡木、榛果與蜜餞果乾等細緻香氣。\",\"依照熟成年限可區分為 VS、VSOP、XO、XXO 與 Hors d'Âge 等級，並有六大產區細分，尤以「大香檳區」出品的酒款最為珍貴。\",\"干邑（Cognac）原是法國南部的一個小鎮，土壤、氣候、雨水等自然條件都非常適合葡萄的生長，干邑區的葡萄品質也是釀酒葡萄中的極品。（教材原文）\",\"干邑白蘭地採用壺式鍋二次蒸餾法，然後經法國著名的利穆贊（Limousin）與特朗賽（Troncais）地區所出產的橡樹製成橡木桶儲存，使酒質更加細膩爽滑、馥郁悠遠。\",\"影響干邑地區成為現今「白蘭地之王」的因素很多，其中富含白堊質土壤的地質讓其生產優質葡萄名聞國際。\",\"白堊質地層土不僅提供了極佳的排水系統，而且儲存了大量的水分讓葡萄樹的根部可以任意汲取。\",\"干邑生產和銷售的每一個環節，包括蒸餾的數量、白蘭地的品質及其年份都受到嚴格的控制。\"],\"table\":{\"head\":[\"標示\",\"規定\"],\"rows\":[[\"香檳干邑 Fine Champagne\",\"必須內含至少 50% 來自大香檳區的干邑，其餘則來自小香檳區\"],[\"特優香檳干邑 Grande Fine Champagne\",\"100% 出產於大香檳區的干邑所稱\"]]}},{\"h\":\"干邑白蘭地品級（法國政府嚴格規定）\",\"notes\":[\"「最年輕生命之水」指的是調和中年紀最小的那一批酒所需達到的最低桶陳年限。\",\"實際多數酒款使用遠超此年限的生命之水。\",\"XO 的年限於 2018 年起由 6 年提高到至少 10 年。\",\"XXO 為 2018 年新增等級，最年輕生命之水至少 14 年。\"],\"table\":{\"head\":[\"標示\",\"說明\",\"最年輕生命之水熟成年限（現行干邑年分標示）\",\"風格\"],\"rows\":[[\"VS\",\"Very Special\",\"至少 2 年\",\"年輕果香明顯，酒感強烈，常用於調酒\"],[\"VSOP\",\"Very Superior Old Pale\",\"至少 4 年\",\"香氣更成熟、口感較圓潤，可純飲或加冰\"],[\"XO\",\"Extra Old\",\"至少 10 年（2018 年起由 6 年提高）\",\"複雜度高，尾韻綿長，適合高階純飲\"],[\"XXO\",\"Extra Extra Old\",\"至少 14 年（2018 年新增等級）\",\"極致陳年、濃郁層次感，具收藏價值\"],[\"Hors d'Âge\",\"超越年份\",\"通常超過 30 年或更久\",\"最頂級干邑，常見於酒莊特釀與限量作品\"]]}},{\"h\":\"干邑六大產區分級\",\"notes\":[\"一級 Grande Champagne（大香檳區）：位於干邑核心地帶，以高含量白堊石灰岩土壤聞名，擁有良好的排水性與保水性，有利於葡萄緩慢成熟，產生高酸度與細緻芳香；生命之水以優雅、集中、陳年潛力極高著稱，是製作頂級 XO 和 Hors d'Âge 的核心來源。\",\"二級 Petite Champagne（小香檳區）：環繞在大香檳區周邊，地質與氣候條件相近，但石灰岩層稍薄，成熟略快；所釀生命之水結構紮實、香氣柔和，常與大香檳混合調製成「Fine Champagne」干邑。\",\"三級 Borderies（邊林區 or 布特妮區）：為干邑中最小的法定產區，擁有獨特的矽質黏土與紅棕土壤；氣候溫和，熟成速度快，風味柔順圓潤，常帶有紫羅蘭與鳶尾花香；Martell 馬爹利以此為其品牌標誌性風格來源。\",\"四級 Fins Bois（優林區）：面積最大，分布廣泛，土壤以黏土、石灰岩與部分砂質混合為主；帶有濃郁果香與適中的結構感，熟成速度適中，主要作為 VS 或 VSOP 等級酒的調和基礎，是干邑產區中的「中堅力量」。\",\"五級 Bons Bois（良林區）：地理位置更接近外圍，土壤以沙地和黏土混合為主，風味較直接粗獷；氣候更接近海洋型，生命之水發展快速但缺乏陳年潛力，多用於年輕款干邑或調和中的酒體補強，單獨使用較少。\",\"六級 Bois Ordinaires（普通林區）：位於最外圈，涵蓋干邑地區沿海與島嶼，土壤以沙質為主，受海風影響明顯；風味輕盈單薄、帶有些許鹹感，缺乏複雜度與陳年潛力，多用於工業酒精、入門干邑或調和用量稀少。\"],\"table\":{\"head\":[\"品質\",\"產區\",\"風格風味\",\"主要用途\"],\"rows\":[[\"一級\",\"Grande Champagne（大香檳區）\",\"優雅、花香、極高陳年潛力\",\"XO / 高級干邑核心\"],[\"二級\",\"Petite Champagne（小香檳區）\",\"結構佳、略柔和\",\"高階干邑組合成分\"],[\"三級\",\"Borderies（邊林區 or 布特妮區）\",\"紫羅蘭香、滑順圓潤\",\"馬爹利核心風格\"],[\"四級\",\"Fins Bois（優林區）\",\"果香濃郁、溫潤易飲\",\"VS / VSOP 基酒\"],[\"五級\",\"Bons Bois（良林區）\",\"質樸、成熟快\",\"入門款或基底\"],[\"六級\",\"Bois Ordinaires（普通林區）\",\"清淡、帶鹹感、簡單香氣\",\"基酒或不標產區產品\"]]}},{\"h\":\"雅馬邑 Armagnac：歷史更悠久的白蘭地起源地\",\"notes\":[\"雅馬邑位於法國西南部的加斯科涅地區（Gascony），歷史甚至早於干邑，是法國最古老的葡萄白蘭地產區。\",\"雅馬邑的氣候較內陸，土壤多樣，葡萄品種較為豐富，包括 Ugni Blanc、Folle Blanche、Colombard 和 Baco Blanc 等。\",\"與干邑不同的是，雅馬邑多採用單次連續式蒸餾，產出的基酒酒精濃度略低，保留更多果香與風土特質。\",\"雅馬邑的風格相較於干邑更為濃郁、樸實、有深度與鄉土感，橡木桶熟成會展現出濃厚的香料、乾果、煙燻與木質調。\",\"雖然國際知名度不如干邑，但在法國當地與白蘭地行家之間，雅馬邑被視為風格獨特且極具文化深度的珍寶。\",\"雅馬邑（Armagnac）是在法國的南部，跟溫暖的干邑相比無論是氣候還是水土都大有不同。（教材原文）\",\"雅瑪邑白蘭地獨特的香味含有成熟的水果香、野花香味，被公認為干邑之外法國出產最好的白蘭地。\",\"1909 年政府頒布法令規定，只有雅馬邑的上雅馬邑區（Haut Armagnac）、拿瑞茲區（Tenareza）、下雅馬邑區（Bas Armagnac）這三個地區才可以生產雅馬邑白蘭地。\",\"下馬雅邑區的產量最大，佔總數的 50% 以上，又稱為黑雅馬邑（Armagnac Noir）。（教材原文）\",\"黑雅馬邑因使用當地生產的黑橡木（Black Monlexum Oak）所製成的橡木桶儲存白蘭地而得名。\",\"黑橡木的強烈花香味、甜味及單寧酸會快速被酒所吸收，使酒加快成熟。\",\"雅馬邑白蘭地是在連續蒸餾過程後儲放於橡木桶中，長期在桶中熟化，將陳年木桶放置於溫度控制的地窖中。\",\"在整個過程中，白蘭地的顏色及單寧從木桶中吸收，酒精濃度逐漸減少而香味逐漸加強。\",\"釀製雅馬邑白蘭地所使用的葡萄品種與干邑基本相同，也是以白玉霓、白福爾及哥倫白為主。\",\"干邑是採用兩次蒸餾的方法，而雅馬邑採用的是一次蒸餾的方法，蒸餾時間較長、較慢。\",\"干邑更加醇厚、雅馬邑則清淡怡人，因此有雅邑「女士的風采」、干邑「男士的風範」的說法。\"],\"table\":{\"head\":[\"1909 年法令指定三大產區\",\"說明\"],\"rows\":[[\"上雅馬邑區 Haut Armagnac\",\"法令規定可生產雅馬邑白蘭地的三個地區之一\"],[\"拿瑞茲區 Tenareza\",\"法令規定可生產雅馬邑白蘭地的三個地區之一\"],[\"下雅馬邑區 Bas Armagnac\",\"產量最大，佔總數的 50% 以上，又稱黑雅馬邑（Armagnac Noir）\"]]}},{\"h\":\"干邑 vs 雅馬邑 對照\",\"notes\":[\"兩者葡萄品種基本相同，主要差異在產地、蒸餾法與風格。\"],\"table\":{\"head\":[\"比較項目\",\"干邑 Cognac\",\"雅馬邑 Armagnac\"],\"rows\":[[\"地區\",\"法國西南部夏朗德地區（Charente）\",\"法國西南部加斯科涅地區（Gascony）\"],[\"歷史\",\"全球最具指標性的白蘭地產區\",\"歷史甚至早於干邑，法國最古老的葡萄白蘭地產區\"],[\"蒸餾\",\"雙次壺式蒸餾（兩次蒸餾）\",\"單次連續式蒸餾（一次蒸餾），時間較長、較慢\"],[\"蒸餾後酒精濃度\",\"較高，風味清澈純淨\",\"基酒酒精濃度略低，保留更多果香與風土特質\"],[\"風格\",\"優雅、圓潤、果香平衡；更加醇厚；「男士的風範」\",\"濃郁、樸實、有深度與鄉土感；清淡怡人；「女士的風采」\"],[\"葡萄品種\",\"Ugni Blanc 為主（占 90% 以上）\",\"Ugni Blanc、Folle Blanche、Colombard、Baco Blanc 等較豐富\"]]}},{\"h\":\"HENNESSY 軒尼詩\",\"notes\":[\"品牌英文名稱 HENNESSY、品牌中文名稱 軒尼詩，產區為法國（干邑區）。\",\"品牌特色：1、首開先例將白蘭地置入木桶中儲存；2、首創 X.O 分類標準；3、只選取四大產區的白蘭地混釀；4、干邑區產量最大的酒廠。\",\"軒尼詩從 1765 年開始創立酒廠，為全球最大的干邑白蘭地酒廠，成功行銷全球兩百多個國家，是世界干邑白蘭地生產與銷售的第一品牌。\",\"軒尼詩建立星級制度來鑑定干邑白蘭地的品質。\",\"經過同一家族傳承七個世代的優良傳統，賦予軒尼詩綿延不絕的穩定品質。\",\"軒尼詩使用白玉霓葡萄（Ugni Blanc），一種味道清淡、果香濃郁的品種，特別適合在軒尼詩酒廠的巨大銅質蒸餾壺中進行重蒸餾。\",\"為確保酒香馥郁多變，只選取產自四大產區（大香檳區、小香檳區、邊緣區及上林區）的白蘭地，混釀出極品軒尼詩干邑。（教材原文）\",\"軒尼詩干邑白蘭地從不膚淺地標明釀酒年份。\",\"軒尼詩的四十座酒窖中存放了二十萬桶的「生命之水」（Eaux-de-vie，即用來調製干邑的原酒），許多生命之水的酒齡已經超過百年。\",\"一瓶軒尼詩干邑白蘭地的「生命之水」可多達兩百多種。\",\"陳年的「生命之水」經過橡木桶悠悠歲月的養育，漸漸散發出香草和肉桂的醇香；酒齡淺的則顯得朝氣勃勃。\",\"軒尼詩是干邑區產量最大的酒廠，先於 1971 年與酩悅香檳（Moet&Chandon）合併，之後更與路易威登組成全世界最大的精品集團 LVMH。\"]},{\"h\":\"HENNESSY 軒尼詩 產品線\",\"notes\":[\"Hennessy VSOP：採用法國干邑區四大產區調和 60 多種生命之水而成，香氣中透露出淡雅清香、微帶胡椒、丁香及肉桂味，口感香醇順口略含蜜糖風味及微妙甘草味，適合味道豐富的中、西式料理。\",\"Hennessy XO：1870 年誕生的世界第一瓶 XO 級干邑，歷經 150 年的傳承；深琥珀色帶紅寶石般光澤；果乾、焦糖、肉豆蔻、雪茄盒香氣；調和超過百種生命之水，其中部分熟成超過 30 年。\",\"Hennessy X.X.O：法規規定熟成至少 14 年以上，實際使用的生命之水超過 50 種，部分更達 30 年以上陳年；深沉紅銅色帶微光金澤；賽維亞柑橘、烘烤榛果及乾雪茄葉。\",\"Hennessy Paradis（軒尼詩百樂廷）：軒尼詩家族的「液體珠寶」，藝術品等級的高年份調和干邑，調和超過 100 種生命之水，其中最老可追溯至 19 世紀末。\",\"Hennessy James：以創辦人 Richard Hennessy 之子 James 命名，是旅遊通路限定版；介於 VSOP 與 XO 之間，風格現代、滑順柔和；瓶身由 Marc Newson 設計。\",\"HSY MBS5（軒尼詩大師精選 No.5）：Master Blender's Selection 系列第五號作品，屬限量單一批次調和干邑，永不復刻；由第八代調配大師 Renaud 精選 18 間家族酒廠的生命之水。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精濃度\",\"等級\"],\"rows\":[[\"Hennessy VSOP 1L\",\"1L、1.5L、3L\",\"40% ABV\",\"VSOP\"],[\"Hennessy XO 1L\",\"1L、1.5L、3L\",\"40% ABV\",\"XO\"],[\"Hennessy X.X.O 1L\",\"1L\",\"40% ABV\",\"XXO（Extra Extra Old）\"],[\"Hennessy Paradis（軒尼詩百樂廷）\",\"0.05L、0.35L、0.7L\",\"40% ABV\",\"（教材未標示）\"],[\"Hennessy James\",\"1L\",\"40%\",\"（教材未標示；介於 VSOP 與 XO 之間）\"],[\"HSY MBS5（軒尼詩大師精選 No.5）\",\"0.5L\",\"40%\",\"（教材未標示；限量單一批次）\"]]}},{\"h\":\"MARTELL 馬爹利\",\"notes\":[\"品牌英文名稱 MARTELL、品牌中文名稱 馬爹利，產區為法國。\",\"品牌特色：1、歷史最悠久的頂級干邑酒廠；2、使用邊緣區的葡萄（Borderies）；3、唯一蒸餾後去除沉積物與雜質的酒廠。\",\"源自 1715 年由貴族尚．馬爹利來到干邑鎮創建了馬爹利干邑酒廠，為歷史最悠久的頂級干邑酒廠。\",\"至今歷經八代傳承，現任總裁是派屈克．馬爹利先生（Mr. Patrick Martell）。\",\"地點、精準度和時間是馬爹利精湛工藝的三大主軸。\",\"邊緣區為最優質的馬爹利干邑白蘭地奠定優雅和細緻的核心風格；它是干邑區中面積最小卻最受歡迎的葡萄產區。\",\"種植在邊緣區二氧化矽粘土上的優布朗葡萄，賦予生命之水獨特花香與滑順的口感。（教材原文）\",\"馬爹利使用傳統銅製蒸餾器加熱葡萄酒；蒸氣升起至蒸餾器的頂部，通過天鵝頸進入盤管後冷凝並形成清澈溫熱的酒液。\",\"在眾多出色的干邑酒莊中，只有馬爹利是蒸餾去除所有沉積物和雜質後的清澈葡萄酒，以釀製極其細緻純淨的生命之水。\",\"馬爹利堅持只選用由柔軟、緊密年輪橡木製成的酒桶，散發出香草、乾果、紅果、酸甜醬和乾燥花的香味。\",\"馬爹利使用的是托塞橡木桶；托塞橡樹緊密相依而生，每一株樹苗接受較少的陽光，減緩生長速度，造成年輪較為緊密。\",\"採用年輪較緊密的橡木所製作的酒桶，讓生命之水散發更輕柔、細緻的木香。\",\"如果採用全新木桶，會賦予酒體強烈的木香；若木桶在之前已陳年過生命之水，則其所散發的木香就會比較淡。\",\"馬爹利現任酒窖大師為 Christophe Valtaud。\"]},{\"h\":\"MARTELL 馬爹利 產品線\",\"notes\":[\"Martell Noblige（馬爹利名仕）：名稱 Noblige 取自「Noblesse oblige」（貴族的義務），象徵高尚、責任與風範；焦糖梨子、蜂蜜、香草、橡木、榛果與微妙辛香料。\",\"Martell Noblige Noir（名仕黑耀限量版）：採用焦化橡木桶熟成，呈現濃厚煙韻與豐富果香；瓶身以黑金設計，僅在機場免稅與精品旅店販售，全球限量。\",\"Martell VSOP Red BRL：採用 Tronçais 細緻紅橡木桶（Red Barrels）熟成，增加木質與辛香；溫暖銅紅色澤帶金色光芒。\",\"Martell Cordon Bleu（馬爹利藍帶）：以來自 Borderies 區為主的生命之水調和，並使用 Tronçais 法國橡木桶熟成；自 1912 年推出以來堪稱 Martell 的經典代表作，被廣泛視為「真正品味者的干邑」；瓶身靈感來自波爾多酒瓶設計，搭配藍色與金色綢帶。\",\"Martell XO：比 Cordon Bleu 更強烈、更複雜、更具結構感；結合 Grande Champagne 的複雜度與 Borderies 的圓潤花香；瓶身拱門造型象徵勝利門（靈感來自巴黎凱旋門）。\",\"MCB Extra（Martell Cordon Bleu Extra）：延續 Cordon Bleu 經典，以大量 Borderies 區生命之水調和，進一步加強舊桶熟成年份；深銅金琥珀色，香料（肉桂、丁香）與花香（紫羅蘭）。\",\"Martell Chanteloup XXO：取名自干邑歷史地標「Château de Chanteloup」，象徵家族九代釀藝；融合大香檳、小香檳、邊林區與優林區共四大產區約 450 批高年份生命之水，調和最少 14 年熟成。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精濃度\",\"等級\"],\"rows\":[[\"Martell Noblige（馬爹利名仕）\",\"1L\",\"40% ABV\",\"VSOP 等級以上（實際為高於 VSOP、低於 XO 的中高端干邑）\"],[\"Martell Noblige Noir（名仕黑耀限量版）\",\"1L\",\"40% ABV\",\"不屬於傳統 VSOP/XO 等級分類，定位高於標準 Noblige\"],[\"Martell VSOP Red BRL\",\"1L\",\"40% ABV\",\"VSOP\"],[\"Martell Cordon Bleu（馬爹利藍帶）\",\"0.7L、1L、1.5L、3L\",\"40% ABV\",\"生命之水年齡介於 VSOP 至 XO 之間（約 10–25 年），實質屬於 XO 等級\"],[\"Martell XO\",\"0.7L、1L、1.5L、3L\",\"40% ABV\",\"XO（Martell 實際多使用 10–35 年的生命之水）\"],[\"MCB Extra（Martell Cordon Bleu Extra）\",\"1L\",\"40% ABV\",\"Extra\"],[\"Martell Chanteloup XXO 1L\",\"1L\",\"40% ABV\",\"XXO（Extra Extra Old）\"]]}},{\"h\":\"REMY MARTIN 人頭馬\",\"notes\":[\"品牌英文名稱 REMY MARTIN、品牌中文名稱 人頭馬，產區為法國。\",\"品牌特色：1、完全採用大、小香檳區的葡萄；2、遵循古法採用傳統的小型銅製蒸餾器；3、特選（Limousin）的百年老橡木。\",\"1724 年，雷米·馬丁（Moniseur Remy Martin）創立了人頭馬釀酒廠。（教材原文）\",\"是世界四大白蘭地品牌中唯一一個由干邑省本地人所創建的品牌，也是四大白蘭地品牌中唯一一家自己種植葡萄的公司。\",\"產自法國西部夏朗德葡萄種植區的「生命之水」，由於品位獨特卓越，受到世界各地評酒家的賞識，特優香檳干邑的超卓美譽得以公認。\",\"「生命之水」是用以形容葡萄經雙重蒸餾後所形成的葡萄原酒，色澤如清水般清澈通透，然後再被存放在小橡木桶內經長期陳釀成干邑。\",\"釀製「人頭馬」的原料必須是產自夏朗德省科涅克地區的優質葡萄。\",\"等葡萄成熟後，要盡可能晚點採摘，以便使其儘量飽滿，香味更濃郁。\",\"採摘下來的葡萄經過去籽、壓榨、發酵，釀成葡萄酒；為避免其變質，必須在來年 3 月底之前將葡萄酒兩次蒸餾，使之成為酒精含量達 70% 的燒酒。\",\"然後把沒有顏色的燒酒注入橡木桶內，放入酒窖蘊藏，儲存若干年後，等其變成金黃琥珀色。\",\"目前只有人頭馬釀酒廠完全採用干邑區中兩個最優秀的葡萄區——大香檳區和小香檳區的極品葡萄。\",\"遵循古法採用傳統的小型銅製蒸餾器，透過完全而均勻的加熱，充份催化香氣，和酒渣一併蒸餾。\",\"特選林茂山（Limousin）的百年老橡木，經三年以上風乾、製造過程不用任何鐵釘或黏膠所製成的小容量橡木桶來貯存佳釀。\",\"這種木頭有豐富的香草味道，並且這種香草味能與白蘭地融合得非常充分。\",\"並建造以石塊作牆壁、以泥土為地面的酒窖，使「生命之水」得以在最佳環境下陳年。\",\"酒瓶瓶頸上都各自刻有編號，外型有如藝術雕刻；酒澤呈現自然淡桃紅色調。\",\"飲後餘香能在喉間縈繞超過 15 分鐘，最適合超越完美、品味卓越的成功人士。\"],\"table\":{\"head\":[\"法國法律規定之干邑商標標示\",\"規定內容\"],\"rows\":[[\"Fine Champagne Cognac（特優香檳干邑）\",\"必須以大小香檳區所生產的葡萄來釀製，其中大香檳區的葡萄必須超過 50% 以上才能標示\"],[\"Grande Champagne Cognac（極品香檳干邑）\",\"百分之百大香檳區之干邑才可於其商標冠上\"]]}},{\"h\":\"REMY MARTIN 人頭馬 產品線\",\"notes\":[\"Rémy Martin VSOP：該酒款為 Fine Champagne Cognac，調和自大香檳與小香檳產區，至少 50% 來自 Grande Champagne；香草、乾杏（apricot）、蜜餞梨、甘草（licorice）與花香；榮獲 San Francisco 世界烈酒競賽、Cognac Masters 2024 大賽金牌；VSOP 是 1927 年由酒莊創辦「Cellar Master 精選」而成。\",\"Remy Club Exception：旅行零售專屬的特別版（Exception），調和生命之水更高年份；由酒窖大師 Baptiste Loiseau 精選特級生命之水，融合 Fine Champagne 精髓；帶有榛果、肉桂、乾杏，進一步散發丁香、無花果、烘杏仁、橙皮與烘焙咖啡風味。\",\"Rémy Martin Club：無花果乾、核桃、榛果、橡木、雪茄盒、丁香、肉桂等；酒體厚實強勁、結構明顯，屬於較陽剛、成熟男性的風格；八角瓶象徵八種香氣層次。\",\"Remy XO Reach for the Stars LE（摘星限定版）：「Reach for the Stars」意為「攀向星辰」；瓶身以金色人馬座（品牌象徵）搭配銀紅星際風格禮盒；年度限量款，僅於特定精品與機場通路發行。\",\"Rémy Martin XO Excellence：品牌旗艦代表之作，Fine Champagne Cognac 結合 Grande Champagne 的複雜度與 Petite Champagne 的細緻感；採用超過 400 種不同年份的生命之水調和。\",\"Rémy Martin Louis XIII（路易十三）：每一滴酒液都來自大香檳區最珍貴的生命之水；所有生命之水皆在法國橡木桶中熟成數十年，部分超過百年；使用超過 1,200 種生命之水，熟成超過 40 至 100 年；手工打造的 Baccarat 水晶瓶，每一瓶均編號；尾韻超過 1 小時以上。\",\"Rémy Martin Petit Louis XIII 迷你版：50 mL 迷你瓶裝，續承經典水晶瓶造型；融合上千款 100% Grande Champagne 的生命之水，酒液來自 100% 大香檳 40–100 年熟成年份；蜜餞、李子乾、松露、雪茄盒與細緻香料氣息。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精濃度\",\"等級\"],\"rows\":[[\"REMY MARTIN VSOP\",\"1L\",\"40% ABV\",\"VSOP（Very Superior Old Pale）\"],[\"Remy Club Exception\",\"1L\",\"40% ABV\",\"VSOP 等級以上（實際高於 VSOP、接近 XO）\"],[\"Remy Martin Club\",\"1L\",\"40% ABV\",\"VSOP 等級以上（實際高於 VSOP、接近 XO）\"],[\"Remy XO Reach for the Stars LE（摘星限定版）\",\"0.7L\",\"40% ABV\",\"XO（Extra Old）\"],[\"Remy Martin XO Excellence 1L\",\"0.05L、0.7L\",\"40% ABV\",\"XO（Extra Old）\"],[\"Remy Martin Louis XIII 0.7L（路易十三）\",\"0.7L、1.5L\",\"40% ABV\",\"Hors d'Âge（超越年份等級）\"],[\"Rémy Martin Petit Louis XIII 迷你版\",\"0.05L\",\"40% ABV\",\"Hors d'Âge（超越年份等級）\"]]}},{\"h\":\"三大品牌特色速記對照\",\"notes\":[\"三大品牌的品牌特色為教材明列之條目，建議整組背熟。\"],\"table\":{\"head\":[\"品牌\",\"創立年份\",\"品牌特色（教材條列）\"],\"rows\":[[\"HENNESSY 軒尼詩\",\"1765 年\",\"1、首開先例將白蘭地置入木桶中儲存；2、首創 X.O 分類標準；3、只選取四大產區的白蘭地混釀；4、干邑區產量最大的酒廠\"],[\"MARTELL 馬爹利\",\"1715 年\",\"1、歷史最悠久的頂級干邑酒廠；2、使用邊緣區的葡萄（Borderies）；3、唯一蒸餾後去除沉積物與雜質的酒廠\"],[\"REMY MARTIN 人頭馬\",\"1724 年\",\"1、完全採用大、小香檳區的葡萄；2、遵循古法採用傳統的小型銅製蒸餾器；3、特選（Limousin）的百年老橡木\"]]}}],\"card\":[\"Brandy＝荷蘭文「可燃燒的酒」\",\"未陳年白蘭地無色，40-43度\",\"至少陳年2年，否則標「未成熟」\",\"香氣三來源：原料、蒸餾、橡木桶\",\"釀酒白葡萄：低糖、高酸、低香、抗病\",\"基酒酒精濃度8–10% ABV\",\"Ugni Blanc白玉霓占干邑90%以上\",\"Baco Blanc為雅馬邑獨有品種\",\"VS≥2年、VSOP≥4年、XO≥10年\",\"XXO≥14年（2018新增）、Hors d'Âge超30年\",\"干邑在夏朗德，雙次壺式蒸餾\",\"雅馬邑在加斯科涅，單次連續蒸餾\",\"Fine Champagne大香檳≥50%\",\"六大產區首位：Grande Champagne\",\"Borderies最小，馬爹利核心風格\",\"軒尼詩1765、馬爹利1715、人頭馬1724\",\"Hennessy XO：1870年世界第一瓶XO\",\"1909年法令定雅馬邑三大產區\"],\"quiz\":[{\"q\":\"「Brandy」一詞由荷蘭文演化而來，其意思是什麼？\",\"o\":[\"可燃燒的酒\",\"生命之水\",\"太陽之酒\",\"橡木之酒\"],\"a\":0,\"why\":\"教材開頭即寫 Brandy 由荷蘭文演化而來，意思是「可燃燒的酒」。\"},{\"q\":\"新蒸餾出來、未經陳年的白蘭地酒精濃度約在多少度之間？\",\"o\":[\"30-35 度\",\"40-43 度\",\"36-39 度\",\"68-70 度\"],\"a\":1,\"why\":\"教材：新蒸餾出來未經陳年的白蘭地是無色的，酒精濃度在 40-43 度之間。\"},{\"q\":\"白蘭地一般至少要在橡木桶中儲存多久，否則名稱上要註明「未成熟」？\",\"o\":[\"半年以上\",\"一年以上\",\"兩年以上\",\"四年以上\"],\"a\":2,\"why\":\"教材：一般至少要儲存兩年以上，否則白蘭地的名稱上要註明「未成熟」。\"},{\"q\":\"釀製白蘭地一般採用白葡萄，其特點為下列哪一組？\",\"o\":[\"糖分高、酸度低、香度高\",\"糖分高、酸度高、香度高\",\"糖分低、酸度低、香度高\",\"糖分低、酸度高、香度低，抗病害性強\"],\"a\":3,\"why\":\"教材：釀製白蘭地一般採用白葡萄，特點為糖分低、酸度高、香度低，抗病害性強。\"},{\"q\":\"下列哪一個葡萄品種占干邑 90% 以上，是最主流品種？\",\"o\":[\"白福爾 Folle Blanche\",\"白玉霓 Ugni Blanc\",\"哥倫白 Colombard\",\"Baco Blanc\"],\"a\":1,\"why\":\"教材：白玉霓（Ugni Blanc）為最主流品種（占干邑 90% 以上），高酸低糖。\"},{\"q\":\"Baco Blanc 是由哪兩者混種而來，且為雅馬邑獨有品種之一？\",\"o\":[\"Ugni Blanc × Colombard\",\"Colombard × Noah\",\"Ugni Blanc × Folle Blanche\",\"Folle Blanche × Noah\"],\"a\":3,\"why\":\"教材：Baco Blanc（僅雅馬邑）為 Folle Blanche × Noah 混種。\"},{\"q\":\"干邑（Cognac）位於法國西南部的哪一個地區？\",\"o\":[\"夏朗德地區（Charente）\",\"加斯科涅地區（Gascony）\",\"利穆贊地區（Limousin）\",\"特朗賽地區（Troncais）\"],\"a\":0,\"why\":\"教材：干邑位於法國西南部的夏朗德地區（Charente）。\"},{\"q\":\"雅馬邑（Armagnac）位於法國西南部的哪一個地區？\",\"o\":[\"夏朗德地區（Charente）\",\"波爾多地區\",\"加斯科涅地區（Gascony）\",\"香檳區\"],\"a\":2,\"why\":\"教材：雅馬邑位於法國西南部的加斯科涅地區（Gascony）。\"},{\"q\":\"干邑與雅馬邑的蒸餾方式差異為何？\",\"o\":[\"干邑單次連續式、雅馬邑雙次壺式\",\"兩者皆為雙次壺式蒸餾\",\"兩者皆為單次連續式蒸餾\",\"干邑雙次壺式、雅馬邑單次連續式\"],\"a\":3,\"why\":\"教材：干邑採雙次壺式蒸餾（兩次蒸餾），雅馬邑多採用單次連續式蒸餾（一次蒸餾）。\"},{\"q\":\"干邑白蘭地等級 VS（Very Special）的最年輕生命之水熟成年限為多久？\",\"o\":[\"至少 2 年\",\"至少 4 年\",\"至少 10 年\",\"至少 14 年\"],\"a\":0,\"why\":\"教材品級表：VS（Very Special）至少 2 年。\"},{\"q\":\"VSOP 的英文全稱與最年輕生命之水熟成年限為？\",\"o\":[\"Very Superior Old Pale／至少 2 年\",\"Very Special Old Pale／至少 6 年\",\"Very Superior Old Pale／至少 4 年\",\"Very Special Original Pale／至少 10 年\"],\"a\":2,\"why\":\"教材品級表：VSOP 為 Very Superior Old Pale，至少 4 年。\"},{\"q\":\"依教材現行干邑年分標示，XO 的最年輕生命之水熟成年限為多久？\",\"o\":[\"至少 6 年\",\"至少 10 年（2018 年起由 6 年提高）\",\"至少 14 年\",\"至少 30 年\"],\"a\":1,\"why\":\"教材品級表：XO（Extra Old）至少 10 年，2018 年起由 6 年提高。\"},{\"q\":\"XXO（Extra Extra Old）是哪一年新增的等級，最年輕生命之水須熟成多久？\",\"o\":[\"2018 年新增／至少 10 年\",\"1909 年新增／至少 14 年\",\"2018 年新增／至少 14 年\",\"1870 年新增／至少 30 年\"],\"a\":2,\"why\":\"教材品級表：XXO 為 2018 年新增等級，最年輕生命之水至少 14 年。\"},{\"q\":\"Hors d'Âge 等級在教材中的熟成描述為？\",\"o\":[\"通常超過 30 年或更久\",\"至少 14 年\",\"至少 10 年\",\"至少 4 年\"],\"a\":0,\"why\":\"教材品級表：Hors d'Âge（超越年份）通常超過 30 年或更久，為最頂級干邑。\"},{\"q\":\"「香檳干邑（Fine Champagne）」的規定為何？\",\"o\":[\"100% 出產於大香檳區\",\"必須內含至少 50% 來自小香檳區\",\"必須來自邊林區與優林區\",\"必須內含至少 50% 來自大香檳區的干邑，其餘則來自小香檳區\"],\"a\":3,\"why\":\"教材：「香檳干邑（Fine Champagne）」必須內含至少 50% 來自大香檳區的干邑，其餘則來自小香檳區。\"},{\"q\":\"干邑六大產區中屬於一級、以極高陳年潛力著稱的是哪一區？\",\"o\":[\"Petite Champagne（小香檳區）\",\"Grande Champagne（大香檳區）\",\"Borderies（邊林區）\",\"Fins Bois（優林區）\"],\"a\":1,\"why\":\"教材六大產區表：一級為 Grande Champagne（大香檳區），風格優雅、花香、極高陳年潛力。\"},{\"q\":\"干邑中面積最小的法定產區，風味帶紫羅蘭香、滑順圓潤，是哪一區？\",\"o\":[\"Borderies（邊林區 or 布特妮區）\",\"Bons Bois（良林區）\",\"Bois Ordinaires（普通林區）\",\"Petite Champagne（小香檳區）\"],\"a\":0,\"why\":\"教材：Borderies 為干邑中最小的法定產區，常帶紫羅蘭與鳶尾花香，是馬爹利核心風格。\"},{\"q\":\"干邑六大產區中面積最大、主要作為 VS 或 VSOP 等級酒調和基礎的是哪一區？\",\"o\":[\"Grande Champagne（大香檳區）\",\"Bons Bois（良林區）\",\"Borderies（邊林區）\",\"Fins Bois（優林區）\"],\"a\":3,\"why\":\"教材：Fins Bois（優林區）面積最大，主要作為 VS 或 VSOP 等級酒的調和基礎，是干邑產區中的「中堅力量」。\"},{\"q\":\"干邑白蘭地蒸餾後，是以法國哪兩個地區出產的橡樹製成橡木桶儲存？\",\"o\":[\"加斯科涅與夏朗德\",\"利穆贊（Limousin）與特朗賽（Troncais）\",\"大香檳區與小香檳區\",\"波爾多與勃根地\"],\"a\":1,\"why\":\"教材：干邑白蘭地經法國著名的利穆贊（Limousin）與特朗賽（Troncais）地區所出產的橡樹製成橡木桶儲存。\"},{\"q\":\"哪一年政府頒布法令，規定只有上雅馬邑區、拿瑞茲區、下雅馬邑區三個地區才可生產雅馬邑白蘭地？\",\"o\":[\"1715 年\",\"1870 年\",\"1909 年\",\"2018 年\"],\"a\":2,\"why\":\"教材：1909 年政府頒布法令規定，只有上雅馬邑區（Haut Armagnac）、拿瑞茲區（Tenareza）、下雅馬邑區（Bas Armagnac）這三個地區才可生產雅馬邑白蘭地。\"},{\"q\":\"雅馬邑三大產區中產量最大、佔總數 50% 以上，又稱「黑雅馬邑」的是哪一區？\",\"o\":[\"上雅馬邑區（Haut Armagnac）\",\"拿瑞茲區（Tenareza）\",\"加斯科涅區（Gascony）\",\"下雅馬邑區（Bas Armagnac）\"],\"a\":3,\"why\":\"教材：下馬雅邑區產量最大，佔總數的 50% 以上，又稱為黑雅馬邑（Armagnac Noir）。\"},{\"q\":\"軒尼詩（HENNESSY）創立酒廠的年份為？\",\"o\":[\"1715 年\",\"1765 年\",\"1724 年\",\"1912 年\"],\"a\":1,\"why\":\"教材：軒尼詩從 1765 年開始創立酒廠，為全球最大的干邑白蘭地酒廠。\"},{\"q\":\"軒尼詩只選取哪四大產區的白蘭地混釀？\",\"o\":[\"大香檳區、小香檳區、邊緣區及上林區\",\"大香檳區、小香檳區、優林區及良林區\",\"大香檳區、邊林區、優林區及普通林區\",\"小香檳區、邊緣區、優林區及良林區\"],\"a\":0,\"why\":\"教材：軒尼詩只選取產自四大產區（大香檳區、小香檳區、邊緣區及上林區）的白蘭地混釀。\"},{\"q\":\"依教材，Hennessy XO 是哪一年誕生的世界第一瓶 XO 級干邑？\",\"o\":[\"1715 年\",\"1912 年\",\"1870 年\",\"1927 年\"],\"a\":2,\"why\":\"教材：Hennessy XO 是 1870 年誕生的世界第一瓶 XO 級干邑，歷經 150 年的傳承。\"},{\"q\":\"馬爹利（MARTELL）酒廠由貴族尚．馬爹利創建於哪一年？\",\"o\":[\"1724 年\",\"1715 年\",\"1765 年\",\"1912 年\"],\"a\":1,\"why\":\"教材：源自 1715 年由貴族尚．馬爹利來到干邑鎮創建了馬爹利干邑酒廠，為歷史最悠久的頂級干邑酒廠。\"},{\"q\":\"依教材，馬爹利在眾多干邑酒莊中獨特之處是什麼？\",\"o\":[\"唯一蒸餾去除所有沉積物和雜質後的清澈葡萄酒\",\"唯一自己種植葡萄的公司\",\"唯一採用一次蒸餾法\",\"唯一完全採用大、小香檳區葡萄\"],\"a\":0,\"why\":\"教材：在眾多出色的干邑酒莊中，只有馬爹利是蒸餾去除所有沉積物和雜質後的清澈葡萄酒。\"},{\"q\":\"Martell Cordon Bleu（馬爹利藍帶）自哪一年推出，使用的生命之水年齡約為多少？\",\"o\":[\"1715 年／約 10–35 年\",\"1870 年／約 14 年以上\",\"1927 年／約 40–100 年\",\"1912 年／約 10–25 年\"],\"a\":3,\"why\":\"教材：Cordon Bleu 自 1912 年推出，生命之水年齡介於 VSOP 至 XO 之間（約 10–25 年），實質屬於 XO 等級。\"},{\"q\":\"人頭馬（REMY MARTIN）釀酒廠創立於哪一年？\",\"o\":[\"1715 年\",\"1765 年\",\"1724 年\",\"1909 年\"],\"a\":2,\"why\":\"教材：1724 年，雷米·馬丁（Moniseur Remy Martin）創立了人頭馬釀酒廠。\"},{\"q\":\"依教材，人頭馬在世界四大白蘭地品牌中的獨特地位為？\",\"o\":[\"唯一首創 X.O 分類標準的品牌\",\"唯一歷史最悠久的頂級干邑酒廠\",\"唯一採用一次蒸餾法的品牌\",\"唯一由干邑省本地人所創建、也是唯一一家自己種植葡萄的公司\"],\"a\":3,\"why\":\"教材：人頭馬是世界四大白蘭地品牌中唯一一個由干邑省本地人所創建的品牌，也是唯一一家自己種植葡萄的公司。\"},{\"q\":\"Rémy Martin Louis XIII（路易十三）使用多少種生命之水、熟成多少年？\",\"o\":[\"超過 1,200 種／40 至 100 年\",\"超過 400 種／10–35 年\",\"超過 450 種／14 年以上\",\"超過 100 種／30 年以上\"],\"a\":0,\"why\":\"教材：Louis XIII 使用超過 1,200 種生命之水，熟成超過 40 至 100 年。\"}]},\"其他酒\":{\"subject\":\"其他酒\",\"sections\":[{\"h\":\"伏特加 VODKA 介紹\",\"notes\":[\"起源於12世紀前後的俄國，約14世紀開始成為俄羅斯傳統飲用的蒸餾酒。\",\"「VODKA」據說是由俄語「生命之水」中的「水（VODA）」發音而來。\",\"在俄羅斯，伏特加酒被看作是上帝；俄羅斯人每人每年平均要喝掉67瓶伏特加酒。\",\"清酒釀造了日本人的含蓄、葡萄酒釀造了法國人的浪漫，伏特加酒則釀造了俄羅斯人的豪放、勇猛。\",\"各種調製雞尾酒的基酒之中，伏特加是最具有靈活性、適應性和變通性的一種酒。\",\"主要原料是穀物（大麥、小麥、裸麥、玉米）及甜菜、馬鈴薯。\",\"以連續蒸餾方式製成酒精度95%以上的烈酒，再用蒸餾水淡化至40%~60%。\",\"蒸餾出的酒流入收集器時要經過木炭過濾：每加侖酒至少用一磅半的木炭。\",\"過濾時間不可少於8小時；每40小時至少有10%的木炭要換成新的。\",\"在美國，即使原料不是穀物，只要將中性烈酒通過活性炭等處理，消除其氣味、色澤的皆可視之為伏特加。\",\"歐盟（EU）對伏特加的定義是「由農作物製取的酒精，通過活性炭過濾，能去除五官刺激特性的酒」。\",\"原味伏特加（Neutral Vodka）俗稱鑽石酒，以活性碳過濾成為無色無味以確保純度，可純飲或作為調製雞尾酒的基酒。\",\"加味伏特加（Flavoured Vodka）可添加香料、藥草、水果等成分，不再無色無味，而有了甜味與顏色；常見的有加檸檬、野牛草、辣椒等。\"],\"table\":{\"head\":[\"項目\",\"教材內容\"],\"rows\":[[\"起源\",\"12世紀前後的俄國，14世紀起成為俄羅斯傳統蒸餾酒\"],[\"字源\",\"俄語「生命之水」中的「水（VODA）」發音\"],[\"主要原料\",\"穀物（大麥、小麥、裸麥、玉米）及甜菜、馬鈴薯\"],[\"蒸餾\",\"連續蒸餾製成95%以上烈酒\"],[\"稀釋\",\"用蒸餾水淡化至40%~60%\"],[\"木炭用量\",\"每加侖酒至少一磅半木炭\"],[\"過濾時間\",\"不可少於8小時\"],[\"木炭更換\",\"每40小時至少10%換新\"],[\"俄國人均年飲\",\"67瓶\"]]}},{\"h\":\"ABSOLUT（絕對）\",\"notes\":[\"品牌中文名稱：絕對；產區：瑞典。\",\"西元1895年創始於瑞典，至今仍採用100%當地優質冬小麥，依古法精釀而成，充滿迷人的穀物芬芳。\",\"品牌特色：1.採用100%當地優質冬小麥 2.連續蒸餾法 3.酒的說明直接印刷在全透明的玻璃瓶上 4.創立者奧爾森·史密斯被稱為「伏特加酒之王」。\",\"絕對伏特加於1979年首度從瑞典引入美國市場。\",\"是世界第三大國際性烈酒品牌，在126個國家和地區銷售，並成為全世界第二大頂級伏特加酒品牌。\",\"酒瓶圓肩短頸，是受一種瑞典藥瓶的啟發設計成的。\",\"創新之處在於將酒的說明直接印刷在全透明的玻璃瓶上，而不像之前的酒瓶用紙標籤貼在瓶身上。\",\"每一瓶瓶身上還貼著 Olsson Smith（奧爾松·史密斯）的頭像徽章。\",\"被稱為「伏特加酒之王」的 Lars Olsson Smith（拉爾斯·奧爾森·史密斯），在19世紀成功將連續蒸餾法運用到絕對伏特加的釀製過程中。\",\"這種獨特的蒸餾方法將伏特加酒連續蒸餾上百次，直到祛除酒裡所有的雜質。\",\"ABSOLUT 的核心價值—純淨、簡單和完美。\",\"多年來邀集各方藝術工作者設計獨樹一幟的瓶身意象與平面廣告，與流行時尚趨勢緊密結合。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Absolut 100\",\"1L\",\"50%\",\"無\",\"百分百天然成份，絕對不含任何糖分；熱辣並極其順滑；免稅獨賣商品\"],[\"Absolut Apeach\",\"1L\",\"38%\",\"無\",\"水蜜桃口味，天然成分，不含添加糖\"],[\"Absolut Mango\",\"1L\",\"38%\",\"無\",\"天然芒果風味萃取，沒有添加糖\"],[\"Absolut Vodka\",\"750ML\",\"40%\",\"無\",\"創新、現代、藝術性和高端精緻；100%天然成分\"]]}},{\"h\":\"Belvedere（雪樹）\",\"notes\":[\"品牌中文名稱：雪樹；產區：波蘭。\",\"品牌特色：1.4次蒸餾 2.採用100%黃金裸麥 3.以波蘭著名的總統官邸為瓶身設計 4.使用獨家的逆滲透水質淨化系統。\",\"來自波蘭 Mazovia（馬佐夫舍省），所種植的 Dankowskie 黃金裸麥，這種裸麥只有波蘭的 Mazovia 地區能成功種植。\",\"沿用五百年前的古法釀酒，採用四次蒸餾和小批人手的方法以提升細膩的質感。\",\"四次蒸餾是達到獨特風味的最佳程序：蒸餾三次會留下些許的不完美，而蒸餾五次又會剝奪其美味。\",\"酒廠使用獨家的逆滲透水質淨化系統；水與酒汁混合後，再經過特製的木炭與機械濾紙加以過濾。\",\"使用獨立專用的水源確保口感精醇，使用雪樹專用的瓶塞確保品質穩定。\",\"風味伏特加使用浸潤法製造香檸與橙橘伏特加：原味伏特加運送到法國浸泡香檸或橙橘菁華，吸收果味，經由與軒尼詩公司合作的調酒師調配後，才送回波蘭裝瓶，不同於一般伏特加使用人工調味料加味。\",\"以波蘭著名的總統官邸 Belvedere House 為瓶身設計，霧面瓶身且細長、軟木塞瓶蓋；高級伏特加，適合純飲。\",\"於1996年在美國上市以來，成功創造了頂級伏特加（Luxury Vodka）的消費市場。\",\"愛好者包括：艾爾頓強 Elton John、貝克漢 David Beckham、裘德洛 Jude Law 及喬治克隆尼 George Clooney。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Belvedere\",\"1L\",\"40%\",\"無\",\"100%波蘭黃金裸麥、四次蒸餾與二次過濾；逆滲透水質淨化系統；隱約香草芬芳\"]]}},{\"h\":\"GREY GOOSE（灰雁）\",\"notes\":[\"品牌中文名稱：灰雁；產區：法國。\",\"品牌特色：1.5次蒸餾 2.採用100%法國純淨優質小麥 3.源自於法國干邑區的自然泉水 4.色澤如水晶透明與光淨，口感雅致細膩。\",\"釀製於法國最著名的干邑區，100%採用法國穀物最佳產區「La Beauce」（博斯）的純淨優質小麥。\",\"在專業伏特加調配師的監製下，經過5次蒸餾釀製精萃而成，每一次蒸餾都使 Grey Goose 更滑順、柔和、更加精緻。\",\"使用源自於法國中央高原山脈並流經干邑區的自然泉水，經過香檳區石灰層的自然過濾。\",\"顏色如水晶般透明與純淨，口感相當雅致細膩。\",\"在1998年 Beverage Testing Institute（飲料測試研究所）公佈的資料顯示，經過盲目測試後發表 Grey Goose Vodka 是世界上最好的伏特加。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Grey Goose (Original)\",\"1L\",\"40%\",\"無\",\"優質小麥純淨品質微甜，圓潤香氣，令人聯想起法國杏仁餅；五次蒸餾，石灰層自然過濾的香檳區活泉水；國內市場稀少\"]]}},{\"h\":\"Tito's（蒂托）\",\"notes\":[\"品牌英文名稱：Tito's Handmade Vodka；品牌中文名稱：蒂托；產區：美國。\",\"品牌特色：1.美國本土高端品牌 2.代表美國「手工釀造伏特加」的象徵，注重平易近人和真實性 3.合理的價格享受到頂級的手工釀造酒。\",\"創造人 Tito Beveridge 是一位熱愛釀酒的自學成才釀酒師，本身並沒有酒精釀造的專業背景。\",\"他曾在德州大學學習地質學，並有著從事石油工程的職業生涯。\",\"20世紀90年代中期，Tito 決定轉行從事釀酒行業。\",\"他自學釀酒技術，在德州的一間小工廠裡親自釀製伏特加。\",\"選用非轉基因玉米，並使用傳統的銅製蒸餾器精釀伏特加。\",\"1997年，Tito 於德州的一個小酒廠開始推出自己的伏特加品牌 Tito's Handmade Vodka。\",\"不使用人工添加物和人工香料，原料包括非轉基因玉米，口感純淨且沒有雜味。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Tito's\",\"1L\",\"40%\",\"無\",\"美國高端伏特加，手工釀造與精細工藝，秉持「質量至上」理念\"]]}},{\"h\":\"蘭姆酒介紹\",\"notes\":[\"蘭姆酒發源於西印度群島。\",\"十七世紀初葉，擁有蒸餾技術的英國人移民到小安地列斯群島的巴貝多（Barbados）島，利用此地盛產的甘蔗製造蒸餾酒，即蘭姆酒的起源。\",\"初次飲用這種酒的當地土著因酒醉而「興奮」，當時的英語稱為 Rum-bullion；字首 Rum 保留下來，成了該酒的名稱。\",\"按色澤分：白色蘭姆酒、金色蘭姆酒和深色蘭姆酒三大類。\",\"按風味分：清淡型蘭姆酒、中間型蘭姆酒和厚重型蘭姆酒。\",\"清淡型：顏色呈淡黃色或無色透明，讓蜜糖充分發酵後用連續式蒸餾機製成，酒香柔和、口味乾爽；傳統上產於西班牙語系的島嶼，如波多黎各。\",\"淡蘭姆酒不甜且無強烈味道，幾乎所有用琴酒、伏特加調配的雞尾酒都可用它替代，而且愈淡的蘭姆酒愈佳。\",\"厚重型：顏色從琥珀色到褐色皆有，蜜糖經複雜發酵、用單式蒸餾機蒸餾後，再以木桶成熟出濃厚香味；大多產自熱帶地區，如牙買加、海地、馬丁尼克島等。\",\"厚重型適用於調製以新鮮水果為主的 Punch，也能像白蘭地一樣品嚐。\",\"中間型：介乎前二者之間的製法製造，香味也介乎前二者之間。\",\"蘭姆酒具有兩個極端的個性：一種是白色、口感柔順、酒精度三十五度，主要用來調製 Daiquir（教材原文）及其他性質相近的現代雞尾酒；另一種是深色、口味濃重，酒精度可高達六十五度。\",\"近年來白色蘭姆酒尤其受歡迎，因為清淡的口味容易和其他材料調配，且非常適合年輕人飲用。\",\"18世紀蘭姆酒成為英國海軍的配給品。\",\"海軍上將愛德華·弗農在1740年決定在將士們喝的蘭姆酒裡摻水以避免他們喝醉；部下把這種摻了水的蘭姆酒以弗農的外號「Old Grog」命名為「Grog」。\",\"1805年在特拉法爾加海戰中陣亡的霍雷肖·納爾通中將（教材原文），為了防腐遺體以蘭姆酒浸漬著運返本國，故蘭姆酒也被稱為納爾遜之血。\"],\"table\":{\"head\":[\"分類方式\",\"類型\",\"教材內容\"],\"rows\":[[\"按色澤\",\"三大類\",\"白色、金色、深色蘭姆酒\"],[\"按風味\",\"三大類\",\"清淡型、中間型、厚重型\"],[\"清淡型\",\"蒸餾機／產地\",\"連續式蒸餾機；西班牙語系島嶼，如波多黎各\"],[\"厚重型\",\"蒸餾機／產地\",\"單式蒸餾機、木桶成熟；牙買加、海地、馬丁尼克島\"],[\"白色蘭姆\",\"酒精度\",\"三十五度，調製 Daiquir（教材原文）\"],[\"深色蘭姆\",\"酒精度\",\"可高達六十五度\"]]}},{\"h\":\"BACARDI（百加地）\",\"notes\":[\"品牌中文名稱：百加地；產區：古巴聖地牙哥。\",\"品牌特色：1.方坎多·百加地·馬索先生研發出煤炭濾法，使蘭姆酒變得更加香醇厚實 2.世界上銷售第一的蘭姆酒 3.蝙蝠標誌風行全球 4.發酵、蒸餾、熟成、過濾、調和，五步驟釀製。\",\"起源自1862年，方坎多·百加地·馬索先生（Facundo Bacardi Masso）買下位於古巴聖地牙哥釀酒場城的釀酒廠。\",\"在方坎多先生採用新的蒸餾技術前，蘭姆酒的顏色是深色／棕色。\",\"方坎多先生研發出煤炭過濾法，使蘭姆酒變得更加香醇厚實，並在蘭姆酒類裡創造了白色的新品。\",\"發酵：先混合蔗糖蜜、Bacardi 酵母、純水及其他重要營養成份製成原漿；在嚴格控制的狀態下置放發酵30至35小時。\",\"蒸餾：將發酵過的蘭姆原漿持續加溫，再導入由不銹鋼及銅製的蒸餾器中，可將水、酒精及最微細的殘渣分離開來。\",\"過濾：Facundo 先生獨創用木炭過濾，使蘭姆更加純淨並具有獨特醇順口感；不同的木材被選成燒炭。\",\"裝桶及陳年儲存：Bacardi 只選用美洲白橡木為儲酒桶原料，將桶內部用火烘烤，使其具有炭香味。\",\"空氣的溫度、濕度以及地域高度，甚至於海風吹拂，亦受到嚴謹的控制。\",\"再次混合及過濾：全部的蘭姆酒出桶時最初會是呈琥珀般的淡金黃色；Bacardi Superior 系列會再經過一次木炭過濾，使其成為透明無色。\",\"裝瓶：半成品在不銹鋼桶內靜待數日，等候品質管制部門的試喝檢驗，最後才放入附有蝙蝠標籤的 Bacardi。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Bacardi Superior\",\"1L\",\"40%\",\"無\",\"由西班牙裔創立者 Don Facundo Bacardi Masso 於1862在古巴創立；除去雜質，口感柔和、無色清淡\"],[\"Bacardi Mojito\",\"1L\",\"教材未標示酒精度\",\"無\",\"基本原料有新鮮薄荷、蘇打水以及百加地蘭姆酒，完美的即飲產品\"],[\"BACARDI RUM 8\",\"1L\",\"教材未標示酒精度\",\"小桶裝\",\"橡木小桶中存放精釀8年，世上最精緻醇美的高級蘭姆酒，味道烈濃，最適搭配雪茄\"]]}},{\"h\":\"龍舌蘭酒 TEQUILA 介紹\",\"notes\":[\"龍舌蘭酒是墨西哥的特產，原料是龍舌蘭的一種，在墨西哥稱為 Maguey 的植物。\",\"製造流程：等它成長收割後，先將葉片除去，收集根部約70-80公分的部份，用蒸汽鍋加熱，榨汁之後取其甜味的汁液，再經過發酵和蒸餾的處理。\",\"未經過木桶成熟的酒是白色 Tequila，味道較辛辣；黃色的是經木桶成熟的，味道較圓潤。\",\"只有在墨西哥中央高原北部的哈利司克州所栽培的 Maguey 最優良，出產地名叫特吉拉 Tequila，所以只有在這個村莊生產的才能稱做 Tequila，其他區所生產的只能稱 Mezcal。\",\"Pulque：用龍舌蘭草的心為原料，經過發酵而造出的發酵酒類，最早由古代印地安文明發現，在宗教上有不少用途，也是所有龍舌蘭酒的基礎原型；由於沒有經過蒸餾處理，酒精度不高。\",\"Mezcal：所有以龍舌蘭草心為原料所製造出的蒸餾酒之總稱；Tequila 可說是 Mezcal 的一種，但並不是所有的 Mezcal 都能稱作 Tequila。\",\"Mezcal 在製造地點、原料或作法上都較 Tequila 的範圍來得廣泛、規定不嚴謹，但近年來也漸漸有了較為確定的產品規範。\",\"Tequila 是龍舌蘭酒一族的頂峰，只有在某些特定地區、使用一種稱為藍色龍舌草（Blue Agave）的植物做為原料所製造的產品，才有資格冠上 Tequila 之名。\",\"Sotol：奇瓦瓦州生產，原植物原料並非正統的藍色龍舌蘭草，而是一種調羹花屬（Dasylirion）沙漠植物，因與藍色龍舌蘭同屬天門冬科，所製酒類仍分類於龍舌蘭酒。\",\"認定單位：國際知名且具中南美16國家政府相關組織聯合成立的中南美洲龍舌蘭產物學會。\",\"在墨西哥本土，Tequila 是所有酒類之中受到法規限制最嚴格的一種產品；世界上大部分市場（例如歐盟）也普遍遵循墨西哥的相關法令規範。\",\"根據法規 Tequila 酒裡面不允許放入蝶類幼蟲這類額外的添加物，其原料也並非是仙人掌的汁液製造而成，這兩點是一般對 Tequila 酒最容易產生誤解的地方。\",\"Tequila 是墨西哥重要的外銷商品與經濟支柱，受到極為嚴格的政府法規限制與保護。\"],\"table\":{\"head\":[\"名稱\",\"原料／製法\",\"教材重點\"],\"rows\":[[\"Pulque\",\"龍舌蘭草的心，僅發酵\",\"最早由古代印地安文明發現，所有龍舌蘭酒的基礎原型，酒精度不高\"],[\"Mezcal\",\"龍舌蘭草心的蒸餾酒總稱\",\"範圍較廣、規定不嚴謹；Tequila 是 Mezcal 的一種\"],[\"Tequila\",\"特定地區＋藍色龍舌草 Blue Agave\",\"龍舌蘭酒一族的頂峰；僅特吉拉村莊生產者可稱 Tequila\"],[\"Sotol\",\"調羹花屬（Dasylirion）沙漠植物\",\"奇瓦瓦州生產；與藍色龍舌蘭同屬天門冬科，仍分類於龍舌蘭酒\"],[\"白色 Tequila\",\"未經木桶成熟\",\"味道較辛辣\"],[\"黃色 Tequila\",\"經木桶成熟\",\"味道較圓潤\"]]}},{\"h\":\"PATRON（培恩）\",\"notes\":[\"品牌中文名稱：培恩；產區：墨西哥。\",\"品牌特色：1.製作過程的每一個步驟都是用細膩完美的手工完成 2.從在墨西哥 Jalicso 高地採收特級的藍色龍舌蘭到百年相傳的蒸餾方式（教材原文 Jalicso）3.每一瓶的標籤、包裝與最後的品質檢查，都是由墨西哥工廠中數以百計的工人慢慢經由手工完成 4.目前世界上銷售第一的特級龍舌蘭酒出口商。\",\"1989年由 John Paul DeJoria 創立，公司位於拉斯維加斯·內華達州。\",\"在美國，PATRON 所製造的龍舌蘭酒主要銷售對象是年收入4萬元美金以上的高所得群。\",\"常見其廣告刊登於 Sports Illustrated、Playboy、Wine Spectator、Vogue 等時尚或運動期刊上。\",\"每一瓶的瓶身皆由回收玻璃手工打造。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"年份\",\"桶型\",\"重點\"],\"rows\":[[\"Patron Anejo\",\"1L\",\"40%\",\"1年\",\"小橡木桶\",\"橡木香氣伴香草、葡萄乾及蜂蜜，尾韻焦糖香甜及煙薰；白色橡木桶保存，陳年至少12個月後裝瓶\"],[\"Patron Reposado\",\"1L\",\"40%\",\"2個月\",\"小橡木桶\",\"橡木香氣伴柑橘及蜂蜜，尾韻花香與香草；橡木桶存放至少2個月，融合 silver 的清新及 anejo 的橡木風味\"],[\"Patron Silver\",\"1L\",\"40%\",\"無年份\",\"不鏽鋼桶\",\"尾韻辛辣胡椒氣息；以百分百藍色龍舌蘭釀製，帶有淡淡柑橘香氣\"]]}},{\"h\":\"利口酒介紹\",\"notes\":[\"利口酒是一種使用水果、堅果、草藥、香料、花朵以及奶油增強酒水風味的酒精飲料。\",\"裝瓶前通常會添加糖，一般非常甜。\",\"利口酒通常不會陳釀很長時間，但生產過程中會放一段時間來使酒中的香料與酒液融合。\",\"現今利口酒與烈酒之間越來越難區分，因為許多烈酒都會做成不同風味的版本，比如各種口味的伏特加酒。\",\"可能唯一可靠的區分方法就是：利口酒會添加糖，而烈酒則不會。\",\"幾乎90%的雞尾酒都和這些香甜酒脫不了關係。\",\"常見香甜酒：Kahlua 咖啡酒、Baileys 愛爾蘭奶酒、Bottega Limoncino 檸檬酒、CHOYA 梅酒等。\"],\"table\":{\"head\":[\"比較項目\",\"利口酒\",\"烈酒\"],\"rows\":[[\"是否加糖\",\"會添加糖\",\"不會添加糖\"],[\"陳釀\",\"通常不會陳釀很長時間\",\"—\"],[\"雞尾酒占比\",\"幾乎90%的雞尾酒都和香甜酒有關\",\"—\"]]}},{\"h\":\"Baileys（貝詩禮）\",\"notes\":[\"品牌中文名稱：貝詩禮（教材原文，內文另作「貝禮詩」）；產區：愛爾蘭。\",\"品牌特色：全球第一支將「鮮奶油＋威士忌」完美融合的利口酒，奠定奶酒類型的標準，被譽為「奶酒之王」。\",\"採用愛爾蘭原產優質乳源與當地威士忌製作；每瓶含有高比例的純淨鮮奶油，天然濃郁，不含人工防腐劑。\",\"貝禮詩奶酒是國際釀酒集團（現在的帝亞吉歐集團）子公司愛爾蘭 Gilbeys，於1971年開始研製的一款酒。\",\"原為愛爾蘭乳製品是否適用於酒精飲料的嘗試，添加了糖跟巧克力可可粉後味道卻出奇的好。\",\"1974年在愛爾蘭都柏林生產，首次將愛爾蘭奶油利口酒推向市場。\",\"在愛爾蘭的1,500個農場中的40,000頭乳牛，隨時為 Baileys 提供純淨鮮乳。\",\"在極精密的真空霧化方式下提煉出高品質鮮奶油，混調愛爾蘭優質威士忌，全天然成份，絕不加任何添加物。\",\"依靠愛爾蘭威士忌本身的酒精濃度來達到天然防腐的效果，讓鮮奶油與威士忌能長期穩定融合。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Baileys\",\"1L\",\"17%\",\"無\",\"鮮奶油為主軸，搭配愛爾蘭威士忌與可可香氣，香濃巧克力奶油口感\"],[\"Baileys Espresso Crème\",\"1L\",\"17%\",\"無\",\"搭配深烘焙咖啡精華，甜潤滑順的咖啡酒口感\"],[\"Baileys Strawberry\",\"0.7L\",\"17%\",\"無\",\"草莓與香草風味融合，香甜草莓蛋糕口感\"]]}},{\"h\":\"BOTTEGA（波特嘉）\",\"notes\":[\"品牌中文名稱：波特嘉；產區：義大利。\",\"品牌特色：1.以高品質 Grappa 為基酒 2.優質且精選的天然原料 3.絲滑醇厚的口感 4.特色化的多樣口味 5.藝術化的瓶身設計。\",\"1977年有著超過30年蒸餾酒經驗的阿爾多波特嘉（Aldo Bottega），在威尼斯北部約45公里處成立了波帖卡蒸餾酒廠（Distilleria Bottega）。\",\"酒廠位置鄰近世界知名藝術與文化古都威尼斯，是義大利最有名的「葛拉巴」（Grappa）渣釀白蘭地生產酒廠之一。\",\"波特嘉酒廠以釀製義大利葡萄酒白蘭地、手工製高貴典雅的酒瓶，及迷人的氣泡酒著名。\",\"Limone Natura 製法：採用西西里最優質的檸檬，手工洗淨去皮，去除白色苦味層只保留富含精油的黃色果皮，將檸檬皮放入 Grappa 基酒中浸泡約30天，再分離過濾，添加糖和優質格拉巴酒。\",\"Pistacchio 原料來自西西里島著名的活火山埃特納火山（Mount Etna）精選的優質開心果和最高品質的奶油。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Bottega Limone Natura\",\"1L\",\"30%\",\"無\",\"西西里檸檬皮浸泡 Grappa 基酒約30天；去除白色苦味層\"],[\"Bottega Pistacchio\",\"0.5L\",\"17%\",\"無\",\"西西里島埃特納火山（Mount Etna）優質開心果＋最高品質奶油\"]]}},{\"h\":\"YAMASAKI（山崎蒸餾所）\",\"notes\":[\"品牌中文名稱：山崎蒸餾所；產區：日本。\",\"品牌特色：山崎蒸餾所是日本威士忌的發源地，核心特色在於完美融合蘇格蘭工藝與日本風土。\",\"1923年山崎蒸餾廠誕生，它是日本第一座威士忌蒸餾廠，也是日本威士忌的故鄉。\",\"「由日本的風土、氣候與纖細感官所釀製的威士忌」是創辦人鳥井信治郎建造山崎蒸餾廠時的期望與熱情。\",\"60年前三得利開始用自己製造西式蒸餾酒的知識來做梅酒，開始用熟成和蒸餾技術帶來「革新梅酒製程」。\",\"由山崎蒸餾所推出的「山崎蒸餾所儲藏梅酒」非常受歡迎，是當家明星產品。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Suntory Umeshu RichAmber\",\"0.75L\",\"17%\",\"美國白橡木桶\",\"嚴選日本國產南高梅；使用儲藏過30年以上穀物威士忌的美國白橡木桶，以火槍焙煎木桶內部增加風味\"]]}},{\"h\":\"CHOYA（蝶矢梅酒）\",\"notes\":[\"品牌中文名稱：蝶矢梅酒；產區：日本。\",\"品牌特色：1.天然純粹的釀造工藝 2.優質原料—南高梅 3.以「天然無添加」為核心理念，堅持不使用人工香料、色素及酸味料。\",\"CHOYA 是全球銷售第一的日本梅酒品牌，創立於1914年。\",\"最初以種植葡萄等水果為主，後來於1924年成立釀酒廠，把自家種植的葡萄等植物釀成葡萄酒、白蘭地。\",\"到了1959年，公司改以製造梅酒為主。\",\"以生產高品質、天然、無添加（無人工香料、色素、酸味劑）自然風味呈現的梅酒聞名，也稱之為本格梅酒。\",\"主打嚴選日本「紀州南高梅」等在地品種；產品線包括經典梅酒、熟成梅酒、優質的「The CHOYA」系列，以及近年流行的氣泡酒與跨界茶梅酒。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"熟成／重點\"],\"rows\":[[\"Choya UmeEx.Years\",\"0.7L\",\"17%\",\"無\",\"100%紀州南高梅，靜置熟成2-3年；酸甜平衡與果核香氣\"],[\"Choya UmeEx.ShisoHer\",\"0.7L\",\"教材未標示酒精度\",\"無\",\"熟成2-3年後加入日本國產紫蘇萃取液；甜度較低、帶輕微鹹味\"],[\"Choya UmeRoyalHoney\",\"0.7L\",\"教材未標示酒精度\",\"無\",\"以蜂蜜取代糖、完全不使用砂糖，熟成2-3年後加入蜂王乳（蜂王漿）\"],[\"Choya Premium Ume\",\"0.72L\",\"教材未標示酒精度\",\"無\",\"日本頂級梅酒代表，經3年以上低溫熟成\"],[\"Choya Extra Fruits\",\"0.72L\",\"教材未標示酒精度\",\"無\",\"本格三年果泥梅酒，陳釀至少3年，加入細緻研磨的梅子果泥\"],[\"CHOYA French Oak\",\"0.7L\",\"教材未標示酒精度\",\"法國橡木桶\",\"3年熟成梅酒原液再入法國橡木桶沉睡2年，共5年；混合日本燒酌與橡木香味\"],[\"Choya Gold Edition\",\"0.5L\",\"教材未標示酒精度\",\"無\",\"日本和歌山南高梅，以干邑白蘭地作為基底；加入大量食用金箔\"],[\"CHOYA UTAGE\",\"0.7L\",\"教材未標示酒精度\",\"無\",\"和歌山南高梅，歷經五年靜置熟成；外盒引用日本和服概念，純白簡約\"],[\"CHOYA YUZU\",\"0.75L\",\"教材未標示酒精度\",\"無\",\"嚴選日本四國柚子，一瓶有16%豐富的柚子汁；冷凍不加熱的調和方式\"]]}},{\"h\":\"木內酒造（Kiuchi Brewery）\",\"notes\":[\"品牌中文名稱：木內酒造；產區：日本茨城縣。\",\"品牌特色：1.二百年傳承的清酒根基 2.常陸野貓頭鷹啤酒的轉型 3.品牌精神：以傳統技術傳承與熱情追求完美。\",\"木內酒造創立於1823年，源自日本茨城縣，由木內儀兵衛創立。\",\"專注於釀造傳統日本清酒「菊盛」超過200年，歷經九代傳承。\",\"以「常陸野貓頭鷹啤酒」享譽國際，近年更致力於開發「Hinomaru 日之丸」在地威士忌與琴酒。\",\"木內梅酒以日立野巢啤酒為基底（教材原文），經蒸餾純化後，加入高品質白加賀梅子浸泡而成。\",\"啤酒花風味與梅子的甜美口感完美融合，並添加了健康的果糖。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"木內梅酒\",\"0.72L\",\"14.5%\",\"無\",\"手工白啤酒蒸餾為基底＋日本白加賀梅；草本與啤酒花香氣\"]]}},{\"h\":\"Jack Daniel's（傑克丹尼）\",\"notes\":[\"品牌中文名稱：傑克丹尼；產區：美國。\",\"品牌特色：1.使用全新橡木桶，經過糖楓木炭過濾，喝起香醇不辛辣，這是田納西威士忌與波本威士忌最大不同處 2.自1866年成立以來，採用方形瓶身與獨特的黑色標籤，辨識度高。\",\"Jack Daniel's 是美國最古老的註冊蒸餾廠，創立於1866年，位於田納西州林奇堡。\",\"酒廠挑選最上等的玉米、黑麥及麥芽等全天然穀物，配合高山泉水釀製，不含人造成份。\",\"採用獨特的楓木過濾方法，採用新燒製的美國白橡木桶儲存。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Jack Daniel Honey\",\"1L\",\"35%\",\"美國白橡木桶\",\"以經典7號為風味基底，融合田納西州當地特產野生蜂蜜；基酒經糖楓木炭過濾\"]]}},{\"h\":\"台灣菸酒公司（TTL）\",\"notes\":[\"品牌英文名稱：TTL；品牌中文名稱：台灣菸酒公司；產區：台灣。\",\"品牌特色：1.低溫發酵 2.勁道強，沒有高濃度酒品的辛辣感 3.酒齡至少六個月以上 4.屬於清香型大麴高粱酒。\",\"玉山高粱是台灣菸酒股份有限公司（TTL）旗下的核心高粱酒品牌，創始於1953年。\",\"由嘉義酒廠釀酒團隊研發，以台灣最高峰玉山為名，主打高 CP 值的優質清香型高粱。\",\"承襲「固態發酵、三蒸三釀」技術，產品系列包含玉山台灣原窖、陳年高粱、大曲酒等。\",\"玉山樽藏梅酒是南投酒廠生產的精品梅酒。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"桶型\",\"重點\"],\"rows\":[[\"玉山樽藏梅酒\",\"0.7L\",\"20%\",\"波本桶\",\"新鮮優質青梅釀製後裝入 OMAR 原桶強度的波本桶（梅子酒桶）長時間熟陳；南投酒廠生產，深琥珀色\"]]}},{\"h\":\"霧峰農會\",\"notes\":[\"品牌英文名稱：Wu-Feng Farmer's Association Distillery；品牌中文名稱：霧峰農會；產區：台灣。\",\"品牌特色：嚴選霧峰在地栽種的「台農71號」益全香米釀造。\",\"遠赴日本酒造學習釀造技術，承襲日本杜氏「心魂傾注」精神，致力將在地農產品轉化為特色美酒。\",\"結合台灣埔里清冽甘甜的山泉水源釀製，譜寫台灣清酒的篇章。\",\"提供「酒藏見學」參訪體驗。\",\"荔枝蜂蜜酒榮獲2014年比利時布魯塞爾世界酒類評鑑金牌等多項大獎。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"橡木桶\",\"重點\"],\"rows\":[[\"荔枝蜂蜜酒\",\"0.5L\",\"無\",\"當地荔枝與龍眼蜜，100%純蜜低溫發酵並結合荔枝原汁；2014年比利時布魯塞爾世界酒類評鑑金牌\"],[\"檸檬蜂蜜酒\",\"0.5L\",\"無\",\"在地優質蜂蜜與國產檸檬原汁調製的特色再製酒；常溫保存，冷藏飲用風味更佳\"]]}},{\"h\":\"琴酒介紹\",\"notes\":[\"琴酒的誕生在17世紀中葉，原為藥酒。\",\"由荷蘭 Leiden（萊頓）大學 Franciscus Srlvius（席爾華斯）教授（教材原文）為保護荷蘭人免於感染熱帶疾病所調製。\",\"他把杜松子浸泡在酒精中予以蒸餾後，作為解熱劑有利尿解熱的效用，這就是杜松子酒的由來。\",\"琴酒的名稱是 Geniever（教材原文），後由英國人縮寫為 Gin 而得名。\",\"琴酒無色透明，清香爽口；是近百年來調製雞尾酒時最常使用的基酒，其配方多達千種以上，故有「琴酒是雞尾酒心臟」之說。\",\"原料是玉米、大麥、裸麥等，再將這些原料以連續式蒸餾機製造出95度以上的穀物蒸餾酒。\",\"加進一些植物性成分後，再用單式蒸餾機蒸餾，以溶合出各成分的香味。\",\"植物性成分中除了杜松子外，還使用胡姜、葛縷子、肉桂、當歸、桔子或檸檬皮，以及其他各種藥草、香草等（教材原文）。\",\"至於各成分比例多少，則是各廠家的秘密。\"],\"table\":{\"head\":[\"項目\",\"教材內容\"],\"rows\":[[\"誕生時間\",\"17世紀中葉，原為藥酒\"],[\"發明者\",\"荷蘭 Leiden（萊頓）大學 Franciscus Srlvius（席爾華斯）教授\"],[\"原始用途\",\"解熱劑，有利尿解熱的效用\"],[\"原名\",\"Geniever，後由英國人縮寫為 Gin\"],[\"原料\",\"玉米、大麥、裸麥等\"],[\"製程\",\"連續式蒸餾機製出95度以上穀物蒸餾酒，加植物性成分後再用單式蒸餾機蒸餾\"],[\"地位\",\"配方多達千種以上，「琴酒是雞尾酒心臟」\"]]}},{\"h\":\"BOMBAY（龐貝藍鑽）\",\"notes\":[\"品牌中文名稱：龐貝藍鑽；產區：英國。\",\"品牌特色：琴酒主要的調味原料都是杜松子，龐貝藍鑽特級琴酒卻獨家使用10種草本植物混合調味，這10種調味原料都是從生產品質最優良的產地取得。\",\"結合古典維多利亞女王頭像的標誌與冰藍的瓶身設計，古典與現代並存。\",\"使用100%天然蘇格蘭穀類酒以及純淨威爾斯凡尼湖泉水。\",\"酒中精粹來自不同國家的10種主要植物原料。\",\"使用蒸氣融合法，將百分之百天然穀物烈酒本身蒸餾3次。\",\"蒸餾過程中使用獨特研發設計的汽鍋頭式蒸餾器（Carterhead，全球僅四套，Bombay Sapphire 獨家使用）及銅製的香料籃。\",\"經過3次蒸餾，能使含有烈酒的蒸汽在銅籃中與10種天然草本植物精華充分混合。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Bombay Sapphire\",\"1L\",\"42%\",\"無\",\"標誌性冰藍色四角瓶身與維多利亞女王肖像；10種天然草本植物、蒸氣注入法；琴通寧與馬丁尼頂級首選\"]]}},{\"h\":\"Botanist（植物學家）\",\"notes\":[\"品牌中文名稱：植物學家；產區：蘇格蘭。\",\"是艾雷島（Islay）唯一生產的干琴酒（DRY GIN）。\",\"堅持不添加任何香精，透過手工採集艾雷島上的22種在地植物，加上9種經典琴酒草本原料。\",\"經由獨家「羅夢式蒸餾器（Lomond Still）」緩慢萃取，造就豐富細膩、具備濃郁花果香氣的優雅風味。\",\"由純正的艾雷島民、釀酒界的傳奇大師 JIM MCEWAN 親手創造。\",\"以目前世上唯一的羅夢式蒸餾器低壓文火緩慢蒸餾。\",\"運用他50年釀酒經驗，於2010年創造出代表艾雷島風味的頂級植物學家琴酒 The Botanist Gin。\",\"非冷凝過濾保留最豐富的芬芳，而且創造、蒸餾、裝瓶都在艾雷島上完成。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Botanist Gin\",\"1L\",\"46%\",\"無\",\"22種艾雷島在地植物＋9種經典琴酒草本原料；羅夢式蒸餾器；非冷凝過濾\"]]}},{\"h\":\"ROKU（六）\",\"notes\":[\"品牌中文名稱：六；產區：日本。\",\"品牌特色：1.由日本三得利工藝師（Blender）精心調配 2.堅持使用「當季」新鮮現摘的植物 3.針對不同植物的特性採用獨立的蒸餾法 4.瓶身設計具備六個切面，象徵使用的六種日本植物；瓶標使用日本傳統和紙，印有漢字「六」。\",\"六（ROKU）是日本三得利集團第一款頂級日本琴酒。\",\"使用6種經典的日本植物：櫻花、櫻花葉、日本柚子皮、煎茶、玉露、日本山椒。\",\"經過日本大阪三得利烈酒廠的日本琴酒工藝師浸製、蒸餾、最後調和而成。\",\"細緻是透過6種獨特的日本植物以及8種經典琴酒材料所表現出來的均衡風味。\",\"製程中最獨特的地方是工藝師選用了4種不一樣的壺式蒸餾器分批蒸餾。\",\"瓶身以六角形狀呈現，代表使用的6種日本植物，並將植物的樣貌以浮雕形式呈現在6個面上；瓶標以漢字「六」印製在傳統和紙上，加上燙金六角戳章。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"ROKU GIN\",\"1L\",\"43%\",\"無\",\"6種日本植物（櫻花、櫻花葉、煎茶、玉露、山椒、柚子皮）＋8種經典琴酒配方；以櫻花香氣收尾\"],[\"Roku Kasane\",\"1L\",\"47%\",\"無\",\"調配比例與製程升級；釀造過程使用米蒸餾酒，酒體更圓潤柔滑；靈感源自「重疊（Kasane）」美學\"]]}},{\"h\":\"Hendrick's（亨利爵士）\",\"notes\":[\"品牌中文名稱：亨利爵士；產區：蘇格蘭。\",\"品牌特色：裝瓶、釀造都是在蘇格蘭境內完成；極少量的手工生產，大約一次只蒸餾出500公升；使用兩種不同蒸餾器—班尼特蒸餾器與馬車頭蒸餾器蒸餾出來的烈酒做完美調和。\",\"亨利爵士琴酒創立於1999年，是由格蘭父子集團推出的小批次琴酒品牌。\",\"使用兩座骨董蒸餾器：卡特黑德（Carter head）和班內特銅壺蒸餾器（Bennett），使用神秘的比例混合。\",\"使用「保加利亞的玫瑰花瓣」與「荷蘭的小黃瓜」等11種獨特且優質的原料。\",\"再加上蘇格蘭的低地軟水，製作出全球獨一無二、從製造到裝瓶都在蘇格蘭完成的超優質琴酒。\",\"與杜松子、小黃瓜、胡萎絕妙合諧，並將紫羅蘭和玫瑰花瓣的香氛層層封存（教材原文）。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"HENDRICK GIN\",\"1L\",\"44%\",\"無\",\"史上工序最複雜的頂級琴酒，手工小批次生產；11種植物，玫瑰花及小黃瓜香味\"],[\"Hendricks Sunspell\",\"1L\",\"43.4%\",\"無\",\"以原版配方為基底，增添溫暖柑橘香氣與和諧香料尾韻；限量版，靈感源自日落\"]]}},{\"h\":\"Tanqueray（坦奎瑞）\",\"notes\":[\"品牌中文名稱：坦奎瑞；產區：英國。\",\"Tanqueray（坦奎利）是全球頂級的倫敦乾琴酒（London Dry Gin）品牌，創立於1830年。\",\"最大特色在於完美平衡，保留古典琴酒的靈魂，同時擁有極高的純淨度與標誌性的杜松子與柑橘香氣。\",\"是十九世紀的皇家貴族、50年代的好萊塢巨星，甚至是今日名流時尚圈的最愛。\",\"自1830年創立以來，原版配方始終堅持只使用四種核心植物：杜松子、芫荽、歐白芷根、甘草。\",\"透過四次的蒸餾，能完美去除雜質，並萃取出最細緻、豐滿的草本與柑橘風味。\"],\"table\":{\"head\":[\"品名\",\"容量\",\"酒精度\",\"橡木桶\",\"重點\"],\"rows\":[[\"Tanqueray 1L\",\"1L\",\"43.1%\",\"無\",\"自1830年堅持不變的原始配方；四次蒸餾；杜松子、圓當歸、柑橘皮、薰衣草和紫羅蘭香氣\"]]}},{\"h\":\"品牌對照總表（國家／原料／蒸餾次數／特色）\",\"notes\":[\"本表依教材各品牌頁整理，便於橫向比較。\",\"蒸餾次數有明確數字者：Belvedere 4次、Grey Goose 5次、Bombay Sapphire 3次、Tanqueray 4次；Absolut 為連續蒸餾法（連續蒸餾上百次）。\"],\"table\":{\"head\":[\"品牌\",\"類別\",\"產區\",\"原料／主要特色\",\"蒸餾次數\"],\"rows\":[[\"ABSOLUT 絕對\",\"伏特加\",\"瑞典\",\"10
