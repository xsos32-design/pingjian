}\nbody{\n  background:var(--paper); color:var(--ink);\n  font-family:\"Noto Sans TC\",-apple-system,\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  font-size:15px; line-height:1.65; margin:0;\n}\n.wrap{max-width:960px; margin:0 auto; padding:0 18px; padding-block:0 64px}\nh1,h2,h3{font-family:\"Noto Serif TC\",serif; text-wrap:balance; margin:0}\n.mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace; font-variant-numeric:tabular-nums}\n\n/* ---- masthead ---- */\nheader.top{border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:20}\n.top-in{max-width:960px; margin:0 auto; padding:14px 18px; display:flex; flex-wrap:wrap; gap:12px; align-items:baseline}\n.brandmark{font-family:\"Noto Serif TC\",serif; font-weight:900; font-size:20px; letter-spacing:.02em}\n.brandmark em{font-style:normal; color:var(--brass)}\n.kicker{font-size:11px; letter-spacing:.22em; color:var(--ink-3); text-transform:uppercase}\n.spacer{flex:1}\n.scoreboard{display:flex; gap:8px; align-items:baseline}\n.scoreboard .big{font-family:\"IBM Plex Mono\",monospace; font-weight:600; font-size:24px; color:var(--brass); font-variant-numeric:tabular-nums}\n.scoreboard .of{font-size:12px; color:var(--ink-3)}\n\n/* ---- tabs ---- */\nnav.tabs{display:flex; gap:2px; max-width:960px; margin:0 auto; padding:0 12px; flex-wrap:wrap}\n.tab{appearance:none; border:1px solid transparent; border-bottom:none; background:none; color:var(--ink-2);\n  font-family:inherit; font-size:14px; padding:9px 14px; cursor:pointer; border-radius:6px 6px 0 0; margin-bottom:-1px}\n.tab:hover{color:var(--ink)}\n.tab[aria-selected=\"true\"]{background:var(--paper); border-color:var(--line); color:var(--ink); font-weight:700}\n.tab:focus-visible{outline:2px solid var(--brass); outline-offset:2px}\n\n/* ---- draw panel ---- */\n.draw{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:20px; box-shadow:var(--shadow)}\n.draw-head{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px}\n.draw-head h2{font-size:16px}\n.slots{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px}\n.slot{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px}\n.slot .lab{font-size:11px; letter-spacing:.14em; color:var(--ink-3); margin-bottom:2px}\n.slot .val{font-weight:700; font-size:14.5px; line-height:1.45}\n.slot .sub{font-size:12px; color:var(--ink-2); margin-top:2px}\nbutton.act{appearance:none; font-family:inherit; font-size:13.5px; padding:7px 14px; border-radius:999px; cursor:pointer;\n  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink)}\nbutton.act:hover{border-color:var(--brass); color:var(--brass)}\nbutton.act:focus-visible{outline:2px solid var(--brass); outline-offset:2px}\nbutton.act.primary{background:var(--brass); border-color:var(--brass); color:var(--surface)}\nbutton.act.primary:hover{filter:brightness(1.08); color:var(--surface)}\n\n/* ---- section + item ---- */\n.sec{margin-top:26px}\n.sec-head{display:flex; align-items:baseline; gap:10px; padding-bottom:6px; border-bottom:2px solid var(--ink); margin-bottom:2px}\n.sec-head h3{font-size:17px}\n.sec-head .pts{margin-left:auto; font-size:12px; color:var(--ink-2)}\n.item{display:grid; grid-template-columns:56px 1fr auto; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); align-items:start}\n.item .no{font-family:\"IBM Plex Mono\",monospace; font-size:12.5px; color:var(--brass); font-weight:600; padding-top:2px}\n.item .chk{font-weight:500}\n.item .say{margin-top:6px; font-size:13.5px; color:var(--ink-2); background:var(--surface-2); border-left:3px solid var(--brass-2);\n  padding:8px 10px; border-radius:0 6px 6px 0; white-space:pre-line}\n.item .say.hidden{color:transparent; text-shadow:0 0 9px var(--ink-3); cursor:pointer; user-select:none}\n.item .say.hidden::after{content:\"　點擊顯示話術\"; color:var(--ink-3); text-shadow:none; font-size:12px}\n.item .trap{margin-top:6px; font-size:12.5px; color:var(--red)}\n.item .trap::before{content:\"扣分　\"; letter-spacing:.1em; font-size:11px; opacity:.75}\n.marks{display:flex; gap:4px; padding-top:2px}\n.mk{appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2);\n  font-family:\"IBM Plex Mono\",monospace; font-size:12.5px; width:30px; height:30px; border-radius:6px; cursor:pointer}\n.mk:hover{border-color:var(--brass)}\n.mk:focus-visible{outline:2px solid var(--brass); outline-offset:1px}\n.mk[aria-pressed=\"true\"]{background:var(--green-wash); border-color:var(--green); color:var(--green); font-weight:600}\n.mk[aria-pressed=\"true\"][data-zero=\"1\"]{background:var(--red-wash); border-color:var(--red); color:var(--red)}\n.chkbox{width:30px; height:30px; border:1px solid var(--line-strong); border-radius:6px; background:var(--surface); cursor:pointer; color:var(--ink-3); font-size:15px}\n.chkbox[aria-pressed=\"true\"]{background:var(--green-wash); border-color:var(--green); color:var(--green)}\n\n\n/* ---- merged flow ---- */\n.filters{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:18px}\n.chip{appearance:none; font:inherit; font-size:13px; padding:5px 13px; border-radius:999px; cursor:pointer;\n  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2)}\n.chip:hover{border-color:var(--brass); color:var(--brass)}\n.chip[aria-pressed=\"true\"]{background:var(--brass); border-color:var(--brass); color:var(--surface); font-weight:700}\n.chip:focus-visible{outline:2px solid var(--brass); outline-offset:2px}\n.fhint{font-size:12.5px; color:var(--ink-3); margin-left:auto}\n.tags{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:4px}\n.tg{font-family:\"IBM Plex Mono\",monospace; font-size:11px; padding:1px 7px; border-radius:999px; letter-spacing:.02em}\n.tg.star{background:var(--brass-wash); color:var(--brass); border:1px solid var(--brass-2)}\n.tg.cks{background:var(--green-wash); color:var(--green); border:1px solid var(--green)}\n.tg.only{background:var(--red-wash); color:var(--red); border:1px solid var(--red)}\n.tg.now{background:var(--green); color:var(--surface); border:1px solid var(--green)}\n.diff{margin-top:6px; font-size:13px; color:var(--ink-2); background:var(--surface); border:1px dashed var(--line-strong);\n  padding:8px 10px; border-radius:6px; white-space:pre-line}\n.diff::before{content:\"兩份差異　\"; font-size:11px; letter-spacing:.12em; color:var(--red)}\n\n/* ---- notes / callouts ---- */\n.note{border:1px solid var(--line); border-left:4px solid var(--brass); background:var(--surface); border-radius:0 8px 8px 0;\n  padding:12px 14px; margin-top:18px; font-size:13.5px; color:var(--ink-2)}\n.note strong{color:var(--ink)}\n.note.warn{border-left-color:var(--red)}\n.lead{color:var(--ink-2); font-size:14px; margin:10px 0 0}\n\n/* ---- english ---- */\n.en{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:14px; background:var(--surface)}\n.en-h{background:var(--surface-2); padding:8px 14px; font-weight:700; font-size:14px; border-bottom:1px solid var(--line)}\n.en-row{display:grid; grid-template-columns:minmax(150px,.9fr) 1.4fr; gap:0; border-bottom:1px solid var(--line)}\n.en-row:last-child{border-bottom:none}\n.en-row div{padding:9px 14px}\n.en-row .cust{color:var(--ink-2); font-size:13.5px; background:var(--surface-2)}\n.en-row .me{font-size:14px}\n.en-row .me.hidden{color:transparent; text-shadow:0 0 9px var(--ink-3); cursor:pointer; user-select:none}\n.en-row .me.hidden::after{content:\"　點我顯示\"; color:var(--ink-3); text-shadow:none; font-size:12px}\n.en-row .me .eg{display:block; margin-top:4px; font-size:13px; color:var(--ink-2); font-style:italic}\n\n/* ---- mines ---- */\n.mines{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-top:16px}\n.mine{border:1px solid var(--line); border-top:3px solid var(--red); border-radius:0 0 8px 8px; background:var(--surface); padding:12px 14px}\n.mine h4{margin:0 0 6px; font-family:\"Noto Serif TC\",serif; font-size:14.5px}\n.mine ul{margin:0; padding-left:18px; font-size:13.5px; color:var(--ink-2)}\n.mine li{margin-bottom:4px}\n.hidden-pane{display:none}\ntable.pts{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:12px}\ntable.pts th,table.pts td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:left}\ntable.pts td.n{font-family:\"IBM Plex Mono\",monospace; text-align:right; font-variant-numeric:tabular-nums}\n@media (max-width:560px){\n  .item{grid-template-columns:46px 1fr; }\n  .marks,.chkbox{grid-column:1/-1; justify-self:start}\n  .en-row{grid-template-columns:1fr}\n  .en-row .cust{border-bottom:1px dashed var(--line)}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}\n</style>\n\n<header class=\"top\">\n  <div class=\"top-in\">\n    <div>\n      <div class=\"kicker\">昇恆昌 · 桃園機場</div>\n      <div class=\"brandmark\">六星級評鑑<em>練習場</em></div>\n    </div>\n    <div class=\"spacer\"></div>\n    <div class=\"scoreboard\" id=\"sb\">\n      <span class=\"big\" id=\"sbNow\">0</span><span class=\"of\">／ <span id=\"sbMax\">0</span> 分</span>\n    </div>\n  </div>\n  <nav class=\"tabs\" role=\"tablist\">\n    <button class=\"tab\" role=\"tab\" aria-selected=\"true\" data-pane=\"p-flow\">完整流程</button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-pane=\"p-fab\">FAB 24 品</button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-pane=\"p-en\">英文口試</button>\n    <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-pane=\"p-mine\">扣分地雷</button>\n  </nav>\n</header>\n\n<div class=\"wrap\">\n\n  <section class=\"draw\">\n    <div class=\"draw-head\">\n      <h2>考前抽籤</h2>\n      <div class=\"spacer\"></div>\n      <button class=\"act primary\" id=\"btnDraw\">重新抽籤</button>\n      <button class=\"act\" id=\"btnSay\">話術：遮蔽中</button>\n      <button class=\"act\" id=\"btnClear\">清除評分</button>\n    </div>\n    <div class=\"slots\" id=\"slots\"></div>\n    <p class=\"lead\">抽籤規則：兩項商品、一種結帳方式、兩題 Q&amp;A。CKS 版另抽考官會員情境（一／二／三）。</p>\n  </section>\n\n  <!-- ============ 合併流程 ============ -->\n  <div id=\"p-flow\">\n    <div class=\"filters\" id=\"filters\">\n      <button class=\"chip\" data-f=\"all\" aria-pressed=\"true\">全部</button>\n      <button class=\"chip\" data-f=\"star\" aria-pressed=\"false\">只看六星級</button>\n      <button class=\"chip\" data-f=\"cks\" aria-pressed=\"false\">只看 CKS 六心級</button>\n      <button class=\"chip\" data-f=\"diff\" aria-pressed=\"false\">只看兩份的差異</button>\n      <span class=\"fhint\" id=\"fhint\"></span>\n    </div>\n    <div id=\"flowList\"></div>\n  </div>\n\n  <!-- ============ 英文 ============ -->\n  <div id=\"p-en\" class=\"hidden-pane\">\n    <div class=\"note\"><strong>考法：</strong>顧客（考官）說左欄，你接右欄。商品推薦的六個單元要用當天抽到的商品講一次完整的，六單元缺一不可。</div>\n\n    <div class=\"en\">\n      <div class=\"en-h\">1　迎賓歡迎</div>\n      <div class=\"en-row\"><div class=\"cust\">（顧客走近）</div><div class=\"me\" data-say=\"1\">Good morning / Good afternoon / Good evening.<br>Welcome to Everrich (Profond / Kingfond) Duty Free shop.<br>May I help you? / What can I do for you?</div></div>\n    </div>\n\n    <div class=\"en\">\n      <div class=\"en-h\">2　了解顧客</div>\n      <div class=\"en-row\"><div class=\"cust\">I am looking for a gift. ／ I am looking for ** ／ Do you sell ** ?</div><div class=\"me\" data-say=\"1\">Is the person a man or a woman? / May I ask if the person is a male or a female?<br>Is he / she your friend / elder / boss?<br>Is it for you or for someone else?<br>Yes, this way please.</div></div>\n      <div class=\"en-row\"><div class=\"cust\">Thank you, I am just looking around.</div><div class=\"me\" data-say=\"1\">Please take your time, my name is **.<br>If you need any help, please let me know. I am at your service.</div></div>\n      <div class=\"en-row\"><div class=\"cust\">（完全不回應）</div><div class=\"me\" data-say=\"1\">保持微笑、目視、不糾纏，讓出通道；顧客停步再切入。</div></div>\n    </div>\n\n    <div class=\"en\">\n      <div class=\"en-h\">3　商品推薦 — 六個單元（兩項商品各講一次）</div>\n      <div class=\"en-row\"><div class=\"cust\">What kind of liquor / chocolate is it?</div><div class=\"me\" data-say=\"1\">單元一　商品類別<span class=\"eg\">It's a boxed assortment of Belgian chocolate. / It's a single malt Scotch whisky.</span></div></div>\n      <div class=\"en-row\"><div class=\"cust\">Where is this brand from? / Where is it made?</div><div class=\"me\" data-say=\"1\">單元二　品牌國家 / 產地 / 城市<span class=\"eg\">GODIVA is from Belgium, founded in Brussels in 1926.</span></div></div>\n      <div class=\"en-row\"><div class=\"cust\">How much is it? / How much is it in ** dollars?</div><div class=\"me\" data-say=\"1\">單元三　開架品規格<span class=\"eg\">This box has 8 pieces, and it is 1,280 NT dollars.</span></div></div>\n      <div class=\"en-row\"><div class=\"cust\">What is the flavor?</div><div class=\"me\" data-say=\"1\">單元四　口味與口感<span class=\"eg\">It's smooth and creamy, with a hazelnut filling — not too sweet.</span></div></div>\n      <div class=\"en-row\"><div class=\"cust\">What is its uniqueness?</div><div class=\"me\" data-say=\"1\">單元五　商品特色<span class=\"eg\">It is a duty-free exclusive box, and it is our best seller for gifts.</span></div></div>\n      <div class=\"en-row\"><div class=\"cust\">Can you give me a discount?</div><div class=\"me\" data-say=\"1\">單元六　折扣<span class=\"eg\">If you take two boxes, you get 10 percent off. / I'm sorry, the price is already duty-free, but we have a set price for two.</span></div></div>\n    </div>\n\n    <div class=\"en\">\n      <div class=\"en-h\">4　結帳</div>\n      <div class=\"en-row\"><div class=\"cust\">OK, I would like to buy those.</div><div class=\"me\" data-say=\"1\">Thank you, this way please.<br>The completeness of the goods is confirmed.<br>May I have your passport and boarding pass, please.<br>Where is your final destination?<br>Would you transfer the flight in HK / Bangkok?<br>Please do not open the flight security bag until you arrive at your final destination.<br>Thank you, here are your passport and boarding pass.<br>The total is OOO NT dollars.<br>How would you like to pay? （或 Would you like to pay by cash or credit card?）</div></div>\n      <div class=\"en-row\"><div class=\"cust\">I would like to pay in cash.</div><div class=\"me\" data-say=\"1\">This is your XXX NT dollars. Just a moment, please.<br>Sorry to keep you waiting. Here are your change $00, and your receipt.</div></div>\n      <div class=\"en-row\"><div class=\"cust\">I would like to pay by credit card.</div><div class=\"me\" data-say=\"1\">Just a moment, please.<br>Sorry to keep you waiting, please sign here.<br>Here are your receipt and credit card, please put them away.</div></div>\n    </div>\n\n    <div class=\"en\">\n      <div class=\"en-h\">5–6　封袋核對與送客</div>\n      <div class=\"en-row\"><div class=\"cust\">（封袋前與客核對數量）</div><div class=\"me\" data-say=\"1\">Here's a total of two items. Thank you.</div></div>\n      <div class=\"en-row\"><div class=\"cust\">（送客）</div><div class=\"me\" data-say=\"1\">Thank you for coming to Everrich (Profond / Kingfond).<br>We hope to see you again soon.<br>Have a nice day! / Have a nice trip. / Wish you a pleasant journey.</div></div>\n    </div>\n  </div>\n\n  <!-- ============ FAB ============ -->\n  <div id=\"p-fab\" class=\"hidden-pane\">\n    <div class=\"note\"><strong>115 年 09 月 FAB 講義（酒類 24 品）：</strong>F＝完整品名，A＝特點 3 點，B＝好處，開頭一定接「因為您剛剛提到⋯」。點灰色區塊顯示答案，或用上面的「話術：全部顯示」一次攤開。</div>\n    <div class=\"draw\" style=\"margin-top:14px\">\n      <div class=\"draw-head\" style=\"margin-bottom:0\">\n        <input id=\"fabQ\" type=\"text\" placeholder=\"搜尋品名或關鍵字…\" style=\"flex:1; min-width:180px; font:inherit; font-size:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink)\">\n        <button class=\"act\" id=\"fabPick\">隨機抽一支考我</button>\n      </div>\n    </div>\n    <div id=\"fabList\"></div>\n    <div class=\"note warn\"><strong>講義原文照登，兩點提醒：</strong>編號 1、2、17、18 這四支講義只列 2 點特點（其餘列 3 點）；JW Blue Xordinaire 那句「蘊含 4.50 年珍稀老酒」是講義原文，數字看起來有問題，考前跟商訓確認一下要怎麼唸。</div>\n  </div>\n\n  <!-- ============ 地雷 ============ -->\n  <div id=\"p-mine\" class=\"hidden-pane\">\n    <p class=\"lead\">這頁只放「做了也不給分／少一個動作就扣分」的地方。考前五分鐘看這頁就好。</p>\n    <div class=\"mines\">\n      <div class=\"mine\"><h4>會員講 RICHCLUB，不是 iRich</h4><ul>\n        <li>公司會員制度已改為 <strong>RICHCLUB</strong>：LV1 初心者／LV2 探索者／LV3 創造者／LV4 領航者。</li>\n        <li>舊制 iRich（百合／飛魚／貓頭鷹／太陽）不再適用，六星級評分表上的 iRich 是舊寫法。</li>\n        <li>環保袋點數講「RICH POINT 50 點」。</li>\n      </ul></div>\n      <div class=\"mine\"><h4>只有動作、沒有話術＝不給分</h4><ul>\n        <li>引導結帳要「主動開口」＋手勢，光帶路不算。</li>\n        <li>核對售貨單要把單據翻到背面、用手比商品請客人確認，沒比扣 1 分。</li>\n        <li>信用卡簽名要手指簽名處，還要核對卡背簽名，各扣 1 分。</li>\n        <li>行動支付感應／出示條碼都要手指刷卡機。</li>\n      </ul></div>\n      <div class=\"mine\"><h4>錢要一張張攤開</h4><ul>\n        <li>收現金沒攤開點收扣 1 分。</li>\n        <li>找零沒攤開點交扣 2 分（比收錢還重）。</li>\n        <li>單據一律雙手交付。</li>\n      </ul></div>\n      <div class=\"mine\"><h4>B（好處）沒呼應聊天就 0 分</h4><ul>\n        <li>3-1、3-2 的 B 各 6 分，沒呼應 2-3 聊到的生活資料直接 0。</li>\n        <li>有呼應但沒說出「因為您剛剛提到⋯」扣 1 分。</li>\n        <li>所以 2-3 聊天一定要聊出可用的點（家庭／休閒／工作），後面才有分可拿。</li>\n      </ul></div>\n      <div class=\"mine\"><h4>逐字話術不能改</h4><ul>\n        <li>「請您出示您的護照及登機證。」全對才給分（水頭：護照/入台證）。</li>\n        <li>「因為飛安規定，請問您到達 XX 後，還要再轉機或轉船嗎？」</li>\n        <li>「已和您確認商品完整性（此為特價折扣商品，恕不退換貨），謝謝您！」</li>\n        <li>「總共是 XXX 元，請問您要刷卡？付現？還是行動支付？」三種都要唸到。</li>\n      </ul></div>\n      <div class=\"mine\"><h4>商品完整性</h4><ul>\n        <li>每項商品都要：覆誦品名 → 展示確認完整性 → 報總件數。</li>\n        <li>品名沒覆誦扣 1、數量沒核對扣 1、沒展示扣 1。</li>\n        <li>客人不拆封就做外觀確認，不能跳過。</li>\n      </ul></div>\n      <div class=\"mine\"><h4>結尾三件事</h4><ul>\n        <li>提醒保養／保存方式／保存期限 ＋ 再讚賞一次 ＋ 核對數量。</li>\n        <li>以公司膠帶封袋，未封扣 1 分；沒拿袋子就雙手交商品。</li>\n        <li>送客要鞠躬，客人沒買也要送（六星級：客沒買扣全部分數）。</li>\n      </ul></div>\n    </div>\n\n    <div class=\"note warn\"><strong>配分待確認：</strong>六星級表上大項標示「結帳 15 分」，但逐項加總只有 13 分；「成交 2 分」底下卻有圖像法、1/2 減半法、3 個 YES 三項各 2 分。這兩處標示與明細對不上，建議考前跟考官確認以哪個為準。本頁計分是用<strong>逐項明細</strong>加總的。</div>\n  </div>\n</div>\n\n<script>\n/* ---------------- 抽籤池 ---------------- */\nlet POOL_ITEM=[];  /* 由 FAB 24 品帶入 */\nconst POOL_PAY = [\"現金結帳\",\"信用卡結帳\",\"行動支付結帳（虛擬卡片 Apple Pay／Google Pay）\",\"行動支付結帳（條碼）\"];\nconst POOL_SCENE = [\"情境一：考官已是會員\",\"情境二：考官非會員，現場加入\",\"情境三：考官非會員，說明後仍不加入\"];\nconst POOL_QA = [\"Q&A 第 ? 題（題庫尚未建檔）\",\"Q&A 第 ? 題（題庫尚未建檔）\"];\n\n/* ---------------- 合併流程：六星級（配分）× CKS 六心級 ---------------- */\n/* w: both = 兩份都考；star = 只有六星級；cks = 只有 CKS。pt 有值＝六星級配分，null＝CKS 無配分項 */\nconst FLOW=[\n {t:\"一　服儀\", it:[\n  {S:\"1-1\",K:\"1-1\",w:\"both\",pt:2,c:\"服裝儀容符合標準：制服鞋襪／頭髮指甲飾品妝容／名牌、員工識別證（及機場證）\",\n   say:\"六星級：一項不合格各扣 1 分，最多扣 2 分\"},\n  {S:\"1-2\",K:\"1-2\",w:\"both\",pt:1,c:\"鞠躬\",\n   say:\"女／兩腳並攏；男／兩腳與肩同寬。手自然下垂、雙手交叉、拇指相扣、四指合併，眼睛平視對方，30 度鞠躬，嘴角上揚、露齒微笑\"}\n ]},\n {t:\"二　接觸與需求\", it:[\n  {S:\"2-1\",K:\"2-1\",w:\"both\",pt:2,c:\"迎賓招呼語（音調上揚）\",\n   say:\"六星級：「您好，歡迎光臨昇恆昌免稅店！請問有什麼需要為您服務的地方嗎？」\",\n   diff:\"CKS：「您好，歡迎光臨！請問有什麼需要為您服務的地方嗎？」——CKS 沒有「昇恆昌免稅店」五個字，六星級有。\"},\n  {S:\"2-2\",K:\"2-2\",w:\"both\",pt:1,c:\"破冰互動\",\n   say:\"六星級：拉近距離的話術或動作／觀察客人說出讚美的一句話，任一即可\",\n   diff:\"CKS 的判準不一樣，是下列三擇一：\\n1 主動給予購物建議（這是目前最熱銷的土鳳梨酥）\\n2 主動帶入促銷機制（買六件以上 9 折）\\n3 主動探詢核心需求（今天是要買送朋友的伴手禮嗎？）\"},\n  {S:\"2-3\",K:\"—\",w:\"star\",pt:2,c:\"聊天：蒐集顧客 360 度生活資料（家庭／休閒／工作）\",\n   say:\"這是六星級獨有的關卡，也是後面 3-1B、3-2B 共 12 分的唯一依據\",\n   trap:\"CKS 沒這一題，但六星級沒挖到資料，B 共 12 分直接歸零\"}\n ]},\n {t:\"三　推薦商品 1\", it:[\n  {S:\"3-1 F\",K:\"2-3\",w:\"both\",pt:9,c:\"F 描述：完整品名（品牌、系列、年份、規格）\",\n   say:\"六星級：F 一項 3 分，共 9 分。115年09月講義的 F 就是「完整品名」那一行\",\n   diff:\"CKS 寫法是「說明品牌品名、容量規格或特定口味」，沒有配分。\"},\n  {S:\"3-1 A\",K:\"2-3\",w:\"both\",pt:9,c:\"A 特點：講 3 項\",\n   say:\"六星級：一項 3 分。講義多數品項列 3 點，少數只列 2 點\",\n   diff:\"CKS 同樣要求「講出 3 項產品特點」，只是沒有配分表。\"},\n  {S:\"3-1 B\",K:\"—\",w:\"star\",pt:6,c:\"B 好處：「因為您剛剛提到⋯」\",\n   say:\"未呼應 2-3 聊天資訊此項 0 分；有呼應但未說關鍵句扣 1 分\",\n   trap:\"CKS 完全沒有 B 這一段，六星級這裡一支就是 6 分\"}\n ]},\n {t:\"四　推薦商品 2 與串聯\", it:[\n  {S:\"3-2 串\",K:\"2-5\",w:\"both\",pt:4,c:\"串聯銷售：從兩項商品中挑最適合串聯的，陳述推薦理由\",\n   say:\"六星級：有串聯上述商品 4 分\",\n   diff:\"CKS 2-5 寫法：「靈活運用抽選商品進行搭配推薦，並陳述推薦理由」，例：另外非常推薦您多帶一盒手信坊牛軋餅，這在韓國旅客中很受歡迎。\"},\n  {S:\"3-2 F\",K:\"2-4\",w:\"both\",pt:9,c:\"商品 2 的 F 描述：完整品名\",say:\"同商品 1 規則\"},\n  {S:\"3-2 A\",K:\"2-4\",w:\"both\",pt:9,c:\"商品 2 的 A 特點：講 3 項\",say:\"同商品 1 規則\"},\n  {S:\"3-2 B\",K:\"—\",w:\"star\",pt:6,c:\"商品 2 的 B 好處：「因為您剛剛提到⋯」\",say:\"同商品 1 規則\"},\n  {S:\"—\",K:\"2-6\",w:\"cks\",pt:null,c:\"結合行銷活動促成連帶銷售（依當下挑選的商品給實際活動連結）\",\n   say:\"「您現在已經買了三件商品，我們伴手禮全區買六件以上可以做 9 折優惠，有需要嗎？」\",\n   trap:\"六星級表上沒有這一條，CKS 有——用當月實際促銷門檻引導湊件\"},\n  {S:\"—\",K:\"2-7\",w:\"cks\",pt:null,c:\"給予正面認同並提供情緒價值\",\n   say:\"無固定話術，傳遞正面情緒即給分。「這個鳳梨酥真的很好吃，您一定還會想要再回來買一次。」\",\n   trap:\"六星級沒有這一條\"}\n ]},\n {t:\"五　成交技巧（只有六星級）\", it:[\n  {S:\"3C\",K:\"—\",w:\"star\",pt:2,c:\"圖像法\",say:\"「您想像一下⋯」＋舉例說明或描述使用後的感受和畫面\"},\n  {S:\"3C\",K:\"—\",w:\"star\",pt:2,c:\"1/2 減半法\",say:\"「幫您推薦的二款中，您比較喜歡哪一款？」句尾用「是不是？」收\"},\n  {S:\"3C\",K:\"—\",w:\"star\",pt:2,c:\"三個 YES\",say:\"設計三個讓顧客連續說 YES 的問題，第三次點頭後收單\"}\n ]},\n {t:\"六　服務銷售 Q&A\", it:[\n  {S:\"5-1\",K:\"3-1\",w:\"both\",pt:6,c:\"考官抽選的 2 題 Q&A（在流程中適當時機併入）\",\n   say:\"依 Q&A 評分表話術給分，六星級每題 3 分\",\n   trap:\"Q&A 評分表兩份都沒附，尚未取得\"}\n ]},\n {t:\"七　結帳\", it:[\n  {S:\"6-1\",K:\"4-1\",w:\"both\",pt:1,c:\"禮貌性引導客人至櫃檯結帳\",say:\"兩份都要求「主動開口並引導」才給分，只帶路不算\"},\n  {S:\"6-2\",K:\"4-2\",w:\"both\",pt:3,c:\"與顧客核對數量及商品完整性\",\n   say:\"六星級：覆誦品名（未做扣1）＋核對數量（未做扣1）＋展示商品確認完整性（未做扣1）\",\n   diff:\"CKS 多一句收尾：每項商品做完 1 覆誦品名確認數量、2 展示確認完整性之後，要說「您今天共買 XX 個商品」。\"},\n  {S:\"6-3\",K:\"4-3\",w:\"both\",pt:3,c:\"確認護照或登機證\",\n   say:\"「請您出示您的護照及登機證」——逐字，全對才給分\",\n   diff:\"六星級另列水頭營業部版本：「請您出示您的護照（入台證）及登機證。」\",trap:\"漏字就是 0 分\"},\n  {S:\"6-4\",K:\"4-4\",w:\"both\",pt:1,c:\"詢問飛安規定\",\n   say:\"「（不好意思，）因為飛安規定，請問您到達 XX 後，還要再轉機或轉船嗎？」\"},\n  {S:\"6-5\",K:\"4-5\",w:\"both\",pt:2,c:\"會員（現行 RICHCLUB）\",\n   say:\"先問：「請問您有／您是 RICHCLUB 會員嗎？」\\n是會員→「好的，麻煩您出示行動會員卡畫面，我為您累積點數。」＋「您有 XXX 元可以折抵，請問要幫您全部折抵還是部分折抵呢？」\\n非會員→「跟您介紹，我們公司有 RICHCLUB 會員，現在註冊即可獲得 100 元商品抵用券，結帳也能立刻累積消費點數。」\",\n   diff:\"CKS 表寫的就是 RICHCLUB，並分三種考官情境：\\n情境一 已是會員→出示行動會員卡累積點數\\n情境二 非會員、現場加入→介紹 RICHCLUB 官方帳號，註冊得 100 元抵用券\\n情境三 非會員、說明後仍不加入→「我瞭解了，謝謝您。未來如果有機會，仍歡迎您加入 RICHCLUB 會員，享受多元的服務與消費體驗。接下來為您結帳。」\\n六星級表上印的是舊制 iRich，講的時候一律改 RICHCLUB。\",\n   trap:\"舊制 iRich（百合／飛魚／貓頭鷹／太陽）已不適用，現行是 RICHCLUB LV1 初心者／LV2 探索者／LV3 創造者／LV4 領航者；情境三是 CKS 獨有，情境三時購物袋與折抵兩題都不適用\"},\n  {S:\"6-6\",K:\"4-7\",w:\"both\",pt:1,c:\"購物袋需求\",\n   say:\"「因為響應環保，如果您不需購物袋即可獲得 RICH POINT 50 點，請問您需要購物袋嗎？」\",\n   diff:\"六星級表原文寫「iRichClub 50 點紅利點數」，那是舊制寫法；CKS 表寫 RICH POINT 50 點，以現行 RICHCLUB 為準。考官情境三不適用這一題。\"},\n  {S:\"—\",K:\"4-8\",w:\"cks\",pt:null,c:\"酬賓券／抵用券折抵（情境三不適用）\",\n   say:\"情境一（會員）：「您目前有商品酬賓券，要幫您使用嗎？」→「您有 XXX 元可以折抵，請問要幫您全部折抵還是部份折抵嗎？」（不適用酬賓券的類別可略過第一句）\\n情境二（現場加入）：「您已獲得 100 元商品抵用券，要幫您直接使用嗎？」→「之後消費只要出示會員 QR Code，就能持續累積點數喔！」\",\n   trap:\"六星級把折抵併在會員那一題，CKS 獨立成一題\"},\n  {S:\"6-7\",K:\"4-6 ＋ 4-9\",w:\"both\",pt:2,c:\"商品逐一過 POS ＋ 結帳服務用語\",\n   say:\"「總共是 XXX 元，請問您要刷卡？付現？還是行動支付？」三種都要唸到\",\n   diff:\"CKS 把「商品逐一過 POS」（4-6）與結帳話術（4-9）拆成兩條，六星級合併成一條並註明：商品未過 POS 扣 1 分、未說話術扣 2 分。\"}\n ]},\n {t:\"八　結帳方式 ‧ 現金\", pay:\"現金\", it:[\n  {S:\"7-1\",K:\"5-1\",w:\"both\",pt:2,c:\"當場核對並雙手收下現金\",\n   say:\"「收您 XX 元，請您稍等。」一張張攤開點收\",trap:\"六星級註明未攤開扣 1 分\"},\n  {S:\"7-2\",K:\"5-2\",w:\"both\",pt:3,c:\"輸入 POS、列印售貨單並與顧客核對數量金額\",\n   say:\"「已和您確認商品完整性（此為特價折扣商品，恕不退換貨），謝謝您！」售貨單翻背面，以手比商品請客人確認\",\n   trap:\"沒比扣 1 分\"},\n  {S:\"7-3\",K:\"5-3\",w:\"both\",pt:2,c:\"現金收取與找零金額正確\",say:\"找零一張張攤開點交\",trap:\"六星級註明未攤開扣 2 分，比收錢還重\"},\n  {S:\"7-4\",K:\"5-4\",w:\"both\",pt:3,c:\"點交現金及售貨單，雙手交予顧客\",say:\"「找您 XX 元，這是您的收據，請您確認。」\"}\n ]},\n {t:\"八　結帳方式 ‧ 信用卡\", pay:\"信用卡\", it:[\n  {S:\"7-1\",K:\"5-1\",w:\"both\",pt:2,c:\"雙手收下顧客信用卡（正確金額輸入 POS 及 EDC）\",say:\"「收您信用卡。」\"},\n  {S:\"7-2\",K:\"5-2\",w:\"both\",pt:2,c:\"請顧客於簽單簽名\",\n   say:\"「總共是 XX 元，麻煩於此處簽名，謝謝您！」手指簽名處，並核對卡背簽名是否與持卡人姓名相符\",\n   trap:\"六星級：未指扣 1 分、未核對卡背再扣 1 分\"},\n  {S:\"7-3\",K:\"5-3\",w:\"both\",pt:3,c:\"列印售貨單及簽帳單後與顧客核對\",\n   say:\"「已和您確認商品完整性（此為特價折扣商品，恕不退換貨），謝謝您！」翻背面、以手比商品\"},\n  {S:\"7-4\",K:\"5-4\",w:\"both\",pt:3,c:\"雙手點交信用卡、簽帳單及售貨單\",say:\"「這是您的信用卡及收據，請您確認。」\"}\n ]},\n {t:\"八　結帳方式 ‧ 行動支付\", pay:\"行動支付\", it:[\n  {S:\"7-1\",K:\"5-1\",w:\"both\",pt:3,c:\"依顧客付款方式應對\",\n   say:\"虛擬卡片（Apple Pay／Google Pay）：「麻煩請於此處感應，謝謝您」＋手指刷卡機\\n條碼：「請出示您的付款條碼／手機條碼，謝謝您！」\"},\n  {S:\"7-2\",K:\"5-2\",w:\"both\",pt:1,c:\"掃完付款碼後確認 POS 畫面已顯示付款成功\",say:\"（動作）確認付款成功畫面\"},\n  {S:\"7-3\",K:\"5-3\",w:\"both\",pt:3,c:\"列印售貨單及簽帳單後與顧客核對\",\n   say:\"「已和您確認商品完整性（此為特價折扣商品，恕不退換貨），謝謝您！」翻背面、以手比商品\"},\n  {S:\"7-4\",K:\"5-4\",w:\"both\",pt:3,c:\"雙手交付簽帳單及售貨單\",\n   say:\"六星級：「這是您的收據，請您確認。」\",\n   diff:\"CKS：「這是您的收據及刷卡明細，請您確認。」\"}\n ]},\n {t:\"九　商品點交\", it:[\n  {S:\"8-1\",K:\"6-1\",w:\"both\",pt:3,c:\"提醒保養方式／保存方式／保存期限，再次讚賞顧客明智的選擇，並核對【數量】\",say:\"三件事都要講到，最後回到數量\"},\n  {S:\"8-2\",K:\"6-2\",w:\"both\",pt:2,c:\"以公司膠帶將購物袋口封住，雙手將提袋交與顧客\",say:\"未封袋扣 1 分；若未拿購物袋，雙手將商品交予顧客\"}\n ]},\n {t:\"十　送客\", it:[\n  {S:\"9-1\",K:\"7-1\",w:\"both\",pt:2,c:\"微笑目送顧客並鞠躬感謝\",\n   say:\"「謝謝光臨，祝您旅途愉快！」送客需鞠躬\",\n   diff:\"CKS 對會員多一句問卷邀請：「近期您會收到昇恆昌顧客滿意度問卷，如果您滿意今天的服務再請給我滿分 5 分評價！」非會員則只需微笑目送並鞠躬。\",\n   trap:\"六星級註明：若客沒買，這一項扣全部分數\"}\n ]}\n];\n\n/* ---------------- 狀態 ---------------- */\nconst KEY=\"sixstar-drill-v1\";\nlet state={pay:null, sceneIdx:0, items:[], qa:[], reveal:false, marks:{}, filter:\"all\"};\ntry{const raw=localStorage.getItem(KEY); if(raw) state=Object.assign(state,JSON.parse(raw));}catch(e){}\nfunction save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }\nconst pick=a=>a[Math.floor(Math.random()*a.length)];\n\nfunction draw(){\n  if(!POOL_ITEM.length) POOL_ITEM=FAB.map(x=>x.n);\n  const a=pick(POOL_ITEM); let b=pick(POOL_ITEM); let g=0;\n  while(b===a && g++<20) b=pick(POOL_ITEM);\n  state.items=[a,b];\n  state.pay=pick(POOL_PAY);\n  state.sceneIdx=Math.floor(Math.random()*3);\n  state.qa=[1,2].map(()=> \"第 \"+(Math.floor(Math.random()*20)+1)+\" 題\");\n  state.marks={};\n  save(); renderSlots(); renderAll();\n}\nfunction renderSlots(){\n  const s=document.getElementById(\"slots\");\n  if(!state.pay) { s.innerHTML='<div class=\"slot\"><div class=\"lab\">尚未抽籤</div><div class=\"val\">按右上「重新抽籤」開始</div></div>'; return; }\n  const cell=(l,v,sub)=>`<div class=\"slot\"><div class=\"lab\">${l}</div><div class=\"val\">${v}</div>${sub?`<div class=\"sub\">${sub}</div>`:\"\"}</div>`;\n  s.innerHTML =\n    cell(\"商品 1\",\"1. \"+state.items[0])+\n    cell(\"商品 2\",\"2. \"+state.items[1],\"這兩支要串聯，F 講全名、A 講特點、B 接聊天\")+\n    cell(\"結帳方式\",state.pay)+\n    cell(\"考官情境（CKS）\",POOL_SCENE[state.sceneIdx])+\n    cell(\"Q&amp;A 抽題\",state.qa.join(\"　·　\"),\"題庫未建檔，請補上 Q&amp;A 評分表\");\n}\n\n/* ---------------- 畫面 ---------------- */\nfunction payOf(){ if(!state.pay) return null; if(state.pay.indexOf(\"現金\")===0) return \"現金\"; if(state.pay.indexOf(\"信用卡\")===0) return \"信用卡\"; return \"行動支付\"; }\n\nfunction tagsHTML(it){\n  let h='<div class=\"tags\">';\n  if(it.w===\"both\"){\n    h+='<span class=\"tg star\">六星 '+it.S+'</span><span class=\"tg cks\">CKS '+it.K+'</span>';\n    if(it.diff) h+='<span class=\"tg only\">話術有差</span>';\n  }else if(it.w===\"star\"){\n    h+='<span class=\"tg star\">六星 '+it.S+'</span><span class=\"tg only\">CKS 沒有</span>';\n  }else{\n    h+='<span class=\"tg cks\">CKS '+it.K+'</span><span class=\"tg only\">六星沒有</span>';\n  }\n  if(it.now) h+='<span class=\"tg now\">現行講法</span>';\n  return h+'</div>';\n}\n\nfunction itemHTML(sec,idx,it){\n  const id=sec+\"|\"+it.S+\"|\"+it.K+\"|\"+idx;\n  let marks=\"\";\n  if(it.pt){\n    const half=it.pt>2?Math.round(it.pt/2):null;\n    const opts=[0]; if(half&&half!==it.pt) opts.push(half); opts.push(it.pt);\n    marks='<div class=\"marks\">'+opts.map(v=>{\n      const on=state.marks[id]===v;\n      return '<button class=\"mk\" data-id=\"'+id+'\" data-v=\"'+v+'\" data-zero=\"'+(v===0?1:0)+'\" aria-pressed=\"'+on+'\" title=\"得 '+v+' 分\">'+v+'</button>';\n    }).join(\"\")+'</div>';\n  }else{\n    const on=state.marks[id]===1;\n    marks='<div class=\"marks\"><button class=\"chkbox\" data-id=\"'+id+'\" data-v=\"1\" aria-pressed=\"'+on+'\" title=\"做到了\">✓</button></div>';\n  }\n  return '<div class=\"item\">'+\n    '<div class=\"no\">'+(it.pt?it.pt+'分':'CKS')+'</div>'+\n    '<div>'+tagsHTML(it)+'<div class=\"chk\">'+it.c+'</div>'+\n      '<div class=\"say'+(state.reveal?\"\":\" hidden\")+'\" data-say=\"1\">'+it.say+'</div>'+\n      (it.diff?'<div class=\"diff\">'+it.diff+'</div>':'')+\n      (it.trap?'<div class=\"trap\">'+it.trap+'</div>':'')+\n    '</div>'+marks+'</div>';\n}\n\nfunction passFilter(it){\n  if(state.filter===\"all\") return true;\n  if(state.filter===\"star\") return it.w!==\"cks\";\n  if(state.filter===\"cks\") return it.w!==\"star\";\n  return it.w!==\"both\" || !!it.diff;   // diff\n}\n\nfunction renderAll(){\n  const cur=payOf();\n  let html=\"\", max=0, got=0, shown=0;\n  FLOW.forEach(sec=>{\n    if(sec.pay && sec.pay!==cur) return;\n    const its=sec.it.filter(passFilter);\n    if(!its.length) return;\n    const secMax=sec.it.reduce((a,i)=>a+(i.pt||0),0);\n    html+='<section class=\"sec\"><div class=\"sec-head\"><h3>'+sec.t+'</h3>'+\n      (secMax?'<span class=\"pts\">六星 '+secMax+' 分</span>':'<span class=\"pts\">CKS 專屬</span>')+'</div>';\n    its.forEach((it,i)=>{ html+=itemHTML(sec.t,sec.it.indexOf(it),it); shown++; });\n    html+='</section>';\n    sec.it.forEach((it,i)=>{\n      if(!it.pt) return;\n      max+=it.pt;\n      const v=state.marks[sec.t+\"|\"+it.S+\"|\"+it.K+\"|\"+i];\n      if(typeof v===\"number\") got+=v;\n    });\n  });\n  if(!cur) html='<div class=\"note\">先按上面的<strong>重新抽籤</strong>，抽到結帳方式後才會顯示對應的結帳流程。</div>'+html;\n  document.getElementById(\"flowList\").innerHTML=html;\n  document.getElementById(\"fhint\").textContent=\"顯示 \"+shown+\" 條\";\n  document.getElementById(\"sbNow\").textContent=got;\n  document.getElementById(\"sbMax\").textContent=max;\n  document.querySelectorAll(\".en-row .me, #fabList .say\").forEach(e=>e.classList.toggle(\"hidden\",!state.reveal));\n}\n\n/* ---------------- 事件 ---------------- */\ndocument.addEventListener(\"click\",e=>{\n  const mk=e.target.closest(\".mk,.chkbox\");\n  if(mk){\n    const id=mk.dataset.id, v=Number(mk.dataset.v);\n    state.marks[id]= state.marks[id]===v ? undefined : v;\n    if(state.marks[id]===undefined) delete state.marks[id];\n    save(); renderAll(); return;\n  }\n  const say=e.target.closest('[data-say]');\n  if(say){ say.classList.toggle(\"hidden\"); return; }\n});\ndocument.querySelectorAll(\"#filters .chip\").forEach(c=>c.addEventListener(\"click\",()=>{\n  state.filter=c.dataset.f; save();\n  document.querySelectorAll(\"#filters .chip\").forEach(x=>x.setAttribute(\"aria-pressed\",String(x===c)));\n  renderAll();\n}));\ndocument.querySelectorAll(\".tab\").forEach(t=>t.addEventListener(\"click\",()=>{\n  document.querySelectorAll(\".tab\").forEach(x=>x.setAttribute(\"aria-selected\",String(x===t)));\n  [\"p-flow\",\"p-fab\",\"p-en\",\"p-mine\"].forEach(id=>{\n    document.getElementById(id).classList.toggle(\"hidden-pane\", id!==t.dataset.pane);\n  });\n  document.getElementById(\"sb\").style.visibility = t.dataset.pane===\"p-flow\" ? \"visible\" : \"hidden\";\n}));\ndocument.getElementById(\"btnDraw\").addEventListener(\"click\",draw);\ndocument.getElementById(\"btnClear\").addEventListener(\"click\",()=>{state.marks={}; save(); renderAll();});\nconst bs=document.getElementById(\"btnSay\");\nfunction syncSay(){ bs.textContent=\"話術：\"+(state.reveal?\"全部顯示\":\"遮蔽中\"); }\nbs.addEventListener(\"click\",()=>{ state.reveal=!state.reveal; save(); syncSay(); renderAll(); });\n\n\nconst FAB=[\n {n:\"格蘭菲迪 VAT 02（GF Perpetual Collection VAT 02）\",b:\"格蘭菲迪\",\n  A:[\"主要熟成於西班牙雪莉桶裡，接著再於索羅拉融合桶（Solera Vat）活躍地結合\",\"帶來濃郁果香滑順口感\"],\n  B:\"免稅通路獨家販售\"},\n {n:\"百富18年單一純麥威士忌（Balvenie 18YO PX 0.7L）\",b:\"百富\",\n  A:[\"酒精濃度 48.7%\",\"在美國橡木桶中陳釀 18 年，再過 Pedro Ximénez 雪莉桶熟陳，一次享受雙橡木桶帶來多層次風味口感\"],\n  B:\"免稅 "蘇格登\",\n  A:[\"熟成於波本桶與白橡木桶\",\"秋季果園風味\",\"焦糖蘋果、甜梨、香瓜，還有一絲香草和奶油糖迷人風味\"],\n  B:\"免稅通路獨賣\"},\n {n:\"大摩 13 年蘇格蘭單一麥芽威士忌\",b:\"大摩\",\n  A:[\"這款獨特的 13 年單一麥芽威士忌在美國白橡木波本桶、Oloroso 雪莉桶中熟成\",\"額外一年的熟成，賦予了酒液更豐富的香氣\"],\n  B:\"免稅通路獨賣\"},\n {n:\"波摩 19 年黑皮諾桶\",b:\"波摩\",\n  A:[\"免稅通路專賣的全新葡萄酒桶系列\",\"在美國波本桶精心熟成，並於來自法國黑皮諾紅酒桶中過桶收尾\"],\n  B:\"免稅通路獨賣\"},\n {n:\"金門酒廠 56 度 22 年陳年高粱酒 0.6L\",b:\"金門酒廠\",\n  A:[\"承襲古法釀造，【純糧固態發酵釀酒工藝】\",\"酒液經「擷頭去尾」精心挑選\",\"窖藏於恆溫恆濕的坑道中至少 22 年以上，自然醇化、熟陳\"],\n  B:\"金門酒廠最高年份的陳年高粱，值得品酩收藏的珍稀酒款\"},\n {n:\"金酒典藏珍品 0.75L\",b:\"金門酒廠\",\n  A:[\"酒精濃度 56%\",\"金門酒廠三年「陳年金門高粱酒」\",\"2016 舊金山烈酒大賽雙金牌獎\"],\n  B:\"中華民國金門縣的特產，使用金門特產「旱地高粱」\"},\n {n:\"金酒時光窖藏原酒 6.56 NO.2 58.6%\",b:\"金門酒廠\",\n  A:[\"多重陳年酒液勾兌，打造飽滿圓潤的酒體結構\",\"熱帶果香與木質調完美平衡，層次豐富\",\"提供深度品鑑體驗，適合追求複雜風味的藏家\"],\n  B:\"昇恆昌獨家販售\"},\n {n:\"金酒時光窖藏原酒 6.61 NO.2 58.2%\",b:\"金門酒廠\",\n  A:[\"花香與果香交織，賦予酒液精緻優雅的風格\",\"奶油風味與酸甜平衡，提升飲用愉悅感\",\"適合高端宴會或紀念場合，彰顯品味與獨特性\"],\n  B:\"昇恆昌獨家販售\"},\n {n:\"奔富 Penfolds Bin 389 CaS\",b:\"奔富\",\n  A:[\"53% 卡本內、47% 希哈葡萄品種\",\"在葛蘭許用過的橡木桶熟化\",\"有小葛蘭許別稱\"],\n  B:\"CP 值高的送禮紅酒，希哈的豐厚口感\"},\n {n:\"奔富 Grange Bin 95 2017\",b:\"奔富\",\n  A:[\"首款同時獲得 WS & RP 雙滿分\",\"少數 100% 希哈釀造年份\",\"最多澳洲人收藏的葡萄酒\"],\n  B:\"澳洲葡萄酒之王，重要人士的最好禮物\"}\n];\nfunction fabCards(q){\n  const kw=(q||\"\").trim();\n  const rows=FAB.map((p,i)=>({p:p,i:i+1}))\n    .filter(o=>!kw || (o.p.n+o.p.b+o.p.A.join(\"\")+o.p.B).indexOf(kw)>=0);\n  const box=document.getElementById(\"fabList\");\n  if(!rows.length){ box.innerHTML='<div class=\"note\">沒有符合的品項。</div>'; return; }\n  box.innerHTML=rows.map(o=>{\n    const p=o.p;\n    const a=p.A.map((t,k)=>(k+1)+\". \"+t).join(\"\\n\");\n    return '<section class=\"sec\"><div class=\"sec-head\"><h3>'+p.n+'</h3><span class=\"pts\">'+p.b+' ‧ 第 '+o.i+' 支</span></div>'+\n      '<div class=\"item\"><div class=\"no\">A<br><span style=\"color:var(--ink-3)\">'+(p.A.length*3)+'分</span></div>'+\n      '<div><div class=\"chk\">特點（講 '+p.A.length+' 點）</div><div class=\"say'+(state.reveal?\"\":\" hidden\")+'\" data-say=\"1\">'+a+'</div></div></div>'+\n      '<div class=\"item\"><div class=\"no\">B<br><span style=\"color:var(--ink-3)\">6分</span></div>'+\n      '<div><div class=\"chk\">好處（因為您剛剛提到⋯）</div><div class=\"say'+(state.reveal?\"\":\" hidden\")+'\" data-say=\"1\">'+p.B+'</div></div></div>'+\n      '</section>';\n  }).join(\"\");\n}\ndocument.getElementById(\"fabQ\").addEventListener(\"input\",e=>fabCards(e.target.value));\ndocument.getElementById(\"fabPick\").addEventListener(\"click\",()=>{\n  const p=FAB[Math.floor(Math.random()*FAB.length)];\n  document.getElementById(\"fabQ\").value=p.n;\n  fabCards(p.n);\n  document.querySelector('.tab[data-pane=\"p-fab\"]').click();\n});\nfabCards(\"\");\n\nif(!state.pay) draw(); else { renderSlots(); renderAll(); }\nsyncSay();\ndocument.querySelectorAll(\"#filters .chip\").forEach(c=>c.setAttribute(\"aria-pressed\",String(c.dataset.f===state.filter)));\n<\/script>\n\n</body></html>\n", "rpg.html": "<!doctype html><html lang=\"zh-Hant\"><head>\n<meta name=\"robots\" content=\"noindex,nofollow,noarchive\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>\n</head><body>\n<title>免稅櫃檯 · 六星試煉</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap\">\n<style>\n:root{\n  --night:#0D121D; --deep:#131A29; --glass:#182032; --panel:#161E2E; --panel-2:#1D2637;\n  --line:#2A3446; --line-2:#3A465C;\n  --ink:#ECE5D8; --dim:#8E97AB; --faint:#616B80;\n  --brass:#E2B364; --brass-deep:#A87C33; --brass-wash:#2A2315;\n  --win:#5FC29B; --win-wash:#14291F; --lose:#E28273; --lose-wash:#2B1A18;\n  --shadow:0 18px 48px -24px #000;\n}\n*{box-sizing:border-box}\nbody{\n  margin:0; background:var(--night); color:var(--ink);\n  font-family:\"Noto Sans TC\",-apple-system,\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  font-size:15px; line-height:1.7;\n  background-image:radial-gradient(120% 70% at 50% -10%, #1B2436 0%, #0D121D 62%);\n  background-attachment:fixed;\n}\n.wrap{max-width:720px; margin:0 auto; padding:0 18px; padding-block:0 56px}\nh1,h2,h3{font-family:\"Noto Serif TC\",serif; margin:0; text-wrap:balance}\n.mono{font-family:\"IBM Plex Mono\",ui-monospace,monospace; font-variant-numeric:tabular-nums}\n\n/* HUD */\n.hud{position:sticky; top:0; z-index:10; background:rgba(13,18,29,.92); backdrop-filter:blur(8px);\n  border-bottom:1px solid var(--line)}\n.hud-in{max-width:720px; margin:0 auto; padding:10px 18px; display:flex; gap:14px; align-items:center}\n.hud .title{font-family:\"Noto Serif TC\",serif; font-weight:900; font-size:15px; letter-spacing:.04em; white-space:nowrap}\n.hud .title em{font-style:normal; color:var(--brass)}\n.hud .grow{flex:1}\n.stat{font-family:\"IBM Plex Mono\",monospace; font-size:13px; color:var(--dim); white-space:nowrap}\n.stat b{color:var(--brass); font-size:17px; font-weight:600}\n.bar{height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:0}\n.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--brass-deep),var(--brass)); width:0%; transition:width .35s ease}\n\n/* NPC card */\n.stage{margin-top:22px}\n.npc{display:flex; gap:14px; align-items:flex-start; background:var(--panel); border:1px solid var(--line);\n  border-radius:14px; padding:14px 16px; box-shadow:var(--shadow)}\n.face{width:52px; height:52px; flex:0 0 52px; border-radius:50%; display:grid; place-items:center;\n  font-family:\"Noto Serif TC\",serif; font-weight:900; font-size:19px; color:var(--night);\n  background:linear-gradient(150deg,var(--brass),var(--brass-deep))}\n.npc .who{font-weight:700; font-size:14.5px}\n.npc .tag{font-size:12px; color:var(--dim)}\n.npc .mood{margin-left:auto; font-family:\"IBM Plex Mono\",monospace; font-size:12px; color:var(--dim); text-align:right}\n.hearts{letter-spacing:2px; color:var(--brass); font-size:13px}\n.scene{margin-top:12px; color:var(--dim); font-size:13.5px; border-left:2px solid var(--line-2); padding-left:12px; white-space:pre-line}\n.say{margin-top:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px 14px 14px 14px;\n  padding:12px 14px; font-family:\"Noto Serif TC\",serif; font-size:16px; line-height:1.75; animation:pop .25s ease}\n@keyframes pop{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}\n\n/* prompt + options */\n.prompt{margin-top:22px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}\n.prompt h3{font-size:16px}\n.prompt .ref{font-family:\"IBM Plex Mono\",monospace; font-size:12px; color:var(--brass); border:1px solid var(--brass-deep);\n  border-radius:999px; padding:1px 9px}\n.prompt .pt{margin-left:auto; font-family:\"IBM Plex Mono\",monospace; font-size:12px; color:var(--dim)}\n.opts{display:flex; flex-direction:column; gap:8px; margin-top:12px}\n.opt{display:flex; gap:12px; text-align:left; width:100%; background:var(--panel); color:var(--ink);\n  border:1px solid var(--line); border-radius:11px; padding:12px 14px; font:inherit; cursor:pointer;\n  transition:border-color .15s, background .15s, transform .1s}\n.opt:hover:not(:disabled){border-color:var(--brass-deep); background:var(--panel-2)}\n.opt:active:not(:disabled){transform:translateY(1px)}\n.opt:focus-visible{outline:2px solid var(--brass); outline-offset:2px}\n.opt:disabled{cursor:default; opacity:.55}\n.opt .key{font-family:\"IBM Plex Mono\",monospace; font-size:12.5px; color:var(--brass); flex:0 0 auto; padding-top:2px}\n.opt .txt{white-space:pre-line}\n.opt[data-picked=\"1\"]{border-color:var(--brass); background:var(--brass-wash); opacity:1}\n.opt[data-res=\"good\"]{border-color:var(--win); background:var(--win-wash); opacity:1}\n.opt[data-res=\"bad\"]{border-color:var(--lose); background:var(--lose-wash); opacity:1}\n.opt .mk{margin-left:auto; font-family:\"IBM Plex Mono\",monospace; font-size:12px; color:var(--dim); flex:0 0 auto}\n.multi-bar{display:flex; gap:10px; align-items:center; margin-top:10px; font-size:13px; color:var(--dim)}\nbutton.go{font:inherit; font-size:14px; background:var(--brass); color:#1A1206; border:none; border-radius:999px;\n  padding:8px 20px; cursor:pointer; font-weight:700}\nbutton.go:disabled{background:var(--line); color:var(--faint); cursor:default}\nbutton.go:focus-visible{outline:2px solid var(--brass); outline-offset:2px}\nbutton.ghost{font:inherit; font-size:13.5px; background:none; color:var(--dim); border:1px solid var(--line-2);\n  border-radius:999px; padding:7px 16px; cursor:pointer}\nbutton.ghost:hover{color:var(--ink); border-color:var(--brass-deep)}\n\n/* feedback */\n.fb{margin-top:14px; border-radius:12px; padding:12px 15px; border:1px solid var(--line); background:var(--panel);\n  animation:pop .25s ease}\n.fb.good{border-left:4px solid var(--win)}\n.fb.part{border-left:4px solid var(--brass)}\n.fb.bad{border-left:4px solid var(--lose)}\n.fb .head{display:flex; gap:10px; align-items:baseline; font-family:\"IBM Plex Mono\",monospace; font-size:13px}\n.fb .head .sc{font-size:16px; font-weight:600}\n.fb.good .head .sc{color:var(--win)} .fb.part .head .sc{color:var(--brass)} .fb.bad .head .sc{color:var(--lose)}\n.fb .rule{margin-top:6px; font-size:13.5px; color:var(--dim)}\n.fb .rule b{color:var(--ink); font-weight:500}\n.fb .react{margin-top:8px; font-family:\"Noto Serif TC\",serif; font-size:14.5px; color:var(--ink)}\n.fb .react::before{content:\"顧客　\"; font-family:\"Noto Sans TC\",sans-serif; font-size:11px; letter-spacing:.14em; color:var(--faint)}\n.next{margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}\n\n/* start & end */\n.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:var(--shadow); margin-top:24px}\n.card h2{font-size:22px; margin-bottom:6px}\n.lede{color:var(--dim); font-size:14px}\n.rules{margin:16px 0 0; padding:0; list-style:none; font-size:13.5px; color:var(--dim)}\n.rules li{padding:7px 0; border-top:1px solid var(--line)}\n.rules b{color:var(--ink); font-weight:500}\n.grade{font-family:\"Noto Serif TC\",serif; font-size:64px; font-weight:900; line-height:1; color:var(--brass)}\n.endtop{display:flex; gap:18px; align-items:center; flex-wrap:wrap}\n.endtop .num{font-family:\"IBM Plex Mono\",monospace; font-size:15px; color:var(--dim)}\n.endtop .num b{color:var(--ink); font-size:26px; font-weight:600}\n.losses{margin-top:18px; border-top:1px solid var(--line)}\n.loss{display:grid; grid-template-columns:60px 1fr auto; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px}\n.loss .r{font-family:\"IBM Plex Mono\",monospace; color:var(--brass); font-size:12.5px}\n.loss .d{color:var(--dim)}\n.loss .n{font-family:\"IBM Plex Mono\",monospace; color:var(--lose)}\n.hide{display:none}\n@media (max-width:480px){\n  .hud-in{gap:10px} .hud .title{font-size:13px}\n  .loss{grid-template-columns:52px 1fr auto}\n  .grade{font-size:52px}\n}\n@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}\n</style>\n\n<div class=\"hud\">\n  <div class=\"hud-in\">\n    <div class=\"title\">免稅櫃檯 <em>六星試煉</em></div>\n    <div class=\"grow\"></div>\n    <div class=\"stat\" id=\"hStep\">—</div>\n    <div class=\"stat\">得分 <b id=\"hScore\">0</b>/<span id=\"hMax\">0</span></div>\n  </div>\n  <div class=\"bar\"><i id=\"hBar\"></i></div>\n</div>\n\n<div class=\"wrap\">\n  <!-- 開始 -->\n  <div id=\"start\" class=\"card\">\n    <h2>今晚你站 2140 櫃</h2>\n    <p class=\"lede\">考官坐在後面，客人從空橋走過來。你有一次機會把這單做完——照六星級評分表，逐句計分。</p>\n    <ul class=\"rules\">\n      <li><b>顧客是隨機的</b>　人設、行程、會員狀態每局不同，話術要跟著換。</li>\n      <li><b>聊天決定 12 分</b>　你在閒聊挖到什麼生活資料，後面「B 好處」才有東西呼應。挖錯方向，那 12 分直接歸零。</li>\n      <li><b>選錯當場看得到</b>　每一步顯示評分表哪一條、扣幾分、顧客臉色怎麼變。</li>\n      <li><b>會員講 RICHCLUB</b>　舊制 iRich 已不適用，遊戲裡一律用現行講法。</li>\n      <li><b>結算給評級</b>　S / A / B / C，附失分清單，知道下次補哪裡。</li>\n    </ul>\n    <div class=\"next\"><button class=\"go\" id=\"btnStart\">開始接客</button></div>\n  </div>\n\n  <!-- 遊戲 -->\n  <div id=\"game\" class=\"stage hide\">\n    <div class=\"npc\">\n      <div class=\"face\" id=\"npcFace\">—</div>\n      <div>\n        <div class=\"who\" id=\"npcName\">—</div>\n        <div class=\"tag\" id=\"npcTag\">—</div>\n      </div>\n      <div class=\"mood\">\n        <div class=\"hearts\" id=\"npcHearts\">♥♥♥</div>\n        <div id=\"npcMood\">觀望中</div>\n      </div>\n    </div>\n    <div class=\"scene\" id=\"scene\"></div>\n    <div class=\"say\" id=\"say\"></div>\n\n    <div class=\"prompt\">\n      <h3 id=\"qTitle\">—</h3>\n      <span class=\"ref\" id=\"qRef\">—</span>\n      <span class=\"pt\" id=\"qPt\">—</span>\n    </div>\n    <div class=\"opts\" id=\"opts\"></div>\n    <div class=\"multi-bar hide\" id=\"multiBar\">\n      <span id=\"multiCount\">已選 0 / 3</span>\n      <button class=\"go\" id=\"btnConfirm\" disabled>確認</button>\n    </div>\n    <div id=\"fb\"></div>\n    <div class=\"next hide\" id=\"nextWrap\"><button class=\"go\" id=\"btnNext\">繼續</button></div>\n  </div>\n\n  <!-- 結算 -->\n  <div id=\"end\" class=\"card hide\">\n    <div class=\"endtop\">\n      <div class=\"grade\" id=\"eGrade\">A</div>\n      <div class=\"num\">總分<br><b id=\"eScore\">0</b> / <span id=\"eMax\">0</span></div>\n      <div class=\"num\">正確率<br><b id=\"ePct\">0</b>%</div>\n    </div>\n    <p class=\"lede\" id=\"eWord\" style=\"margin-top:14px\"></p>\n    <div class=\"losses\" id=\"eLoss\"></div>\n    <div class=\"next\" style=\"margin-top:18px\">\n      <button class=\"go\" id=\"btnAgain\">再接一位客人</button>\n      <button class=\"ghost\" id=\"btnSame\">同一位客人重來</button>\n    </div>\n  </div>\n</div>\n\n<script>\n/* ============ 顧客 ============ */\nconst CUSTOMERS=[\n {k:\"金\",name:\"金美英 ild(b);\n  });\n}\n\nfunction benefitOpts(prod){\n  const c=S.cust;\n  const f=S.fact;\n  const PB=prod?prod.B:\"這支很適合您\";\n  const others=Object.values(c.topics).filter(t=>!f||t.fact!==f.fact);\n  const other=others[0];\n  if(!f||!f.benefit){\n    return [\n      {t:\"「因為您剛剛提到⋯⋯」（你其實沒聊到任何生活資料，只能硬掰）\",v:0,\n       fb:\"2-3 沒挖到資料，B 這 6 分就是 0，沒有補救方法。\",react:\"我剛剛有說什麼嗎？\",h:-1},\n      {t:\"「這個大家都說好喝。」\",v:0,fb:\"B 必須呼應顧客的生活資料，泛泛之談 0 分。\",react:\"喔。\"},\n      {t:\"「總之很適合您。」\",v:0,fb:\"同上，0 分。\",react:\"……\"}\n    ];\n  }\n  const a={t:\"「因為您剛剛提到\"+f.fact+\"，這支\"+PB+\"，\"+f.benefit+\"。」\",v:6,h:1,\n    fb:\"滿分寫法＝關鍵句「因為您剛剛提到⋯」＋講義上那句 B 好處＋轉成對這位客人的用處。\",react:\"對耶，這樣剛好。\"};\n  const b={t:\"「這支\"+PB+\"喔。」\",v:5,\n    fb:\"講義的 B 有講出來，但沒說「因為您剛剛提到⋯」，扣 1 分。\",react:\"嗯，不錯。\"};\n  const d={t:\"「因為您剛剛提到\"+other.fact+\"，這支\"+PB+\"。」\",v:0,\n    fb:\"呼應錯對象——客人沒說過這件事，此項 0 分。\",react:\"我沒有說過這個吧？\",h:-1};\n  return [a,b,d].sort(()=>Math.random()-.5);\n}\n\nfunction togglePick(btn,idx){\n  const need=S.stages[S.i].need;\n  const at=picked.indexOf(idx);\n  if(at>=0){picked.splice(at,1); btn.dataset.picked=\"0\";}\n  else{ if(picked.length>=need) return; picked.push(idx); btn.dataset.picked=\"1\"; }\n  $(\"multiCount\").textContent=\"已選 \"+picked.length+\" / \"+need;\n  $(\"btnConfirm\").disabled=picked.length!==need;\n}\n\nfunction lock(){ document.querySelectorAll(\"#opts .opt\").forEach(b=>b.disabled=true); }\n\nfunction finishStage(got,kind,ruleHTML,react,heart){\n  S.score+=got;\n  const s=S.stages[S.i];\n  if(got<s.pt) S.log.push({ref:s.ref,title:s.title,lost:s.pt-got,why:String(ruleHTML||\"\").replace(/<[^>]+>/g,\"\")});\n  if(typeof heart===\"number\") S.heart=Math.max(0,Math.min(5,S.heart+heart));\n  hearts();\n  $(\"hScore\").textContent=S.score;\n  const cls = got===s.pt?\"good\":(got>0?\"part\":\"bad\");\n  $(\"fb\").innerHTML='<div class=\"fb '+cls+'\"><div class=\"head\"><span class=\"sc\">'+(got>0?\"+\"+got:\"0\")+' 分</span>'+\n    '<span style=\"color:var(--dim)\">'+s.r
